<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>星空水晶生存战 - 主页菜单</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Exo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />
<link rel="stylesheet" href="styles/app.css" />
</head>
<body>
<div id="startScreen">
  <div class="panel panel-home panel-start">
    <div class="panel-shell">
      <div class="panel-pin panel-pin-left" aria-hidden="true"></div>
      <div class="panel-pin panel-pin-right" aria-hidden="true"></div>
      <div class="panel-ornament panel-planet" aria-hidden="true">🪐</div>
      <div class="panel-ornament panel-meteor" aria-hidden="true">☄</div>
      <div class="panel-header">
        <div class="panel-kicker">ALPHA STAR SURVIVAL</div>
        <h1>星空水晶生存战</h1>
        <p class="panel-lead">在阿尔法星的赤色荒原上收集晶石、躲避怪物、刷新段位，冲击更高纪录。</p>
      </div>
      <div class="cta-row">
        <div class="cta-center"><button id="startBtn" class="cta-button"><span class="cta-icon">🚀</span><span>开始游戏</span></button></div>
        <button id="shopEntryBtn" class="shop-main-btn"><span class="sm-icon">🛒</span><span>星际商店</span></button>
      </div>
      <div class="panel-intro">每一局都会提升晶石价值与敌人强度，合理利用加速、回血和无敌果实才能冲上更高段位。</div>
      <div id="startAchievementPanel" class="achievement-panel"></div>
      <div class="hero-strip">
        <div class="hero-stat"><span>模式</span><strong>生存收集</strong></div>
        <div class="hero-stat"><span>操作</span><strong>WASD / 摇杆</strong></div>
        <div class="hero-stat"><span>目标</span><strong>刷分解锁成就</strong></div>
      </div>
      <div class="bgm-volume">
        <span class="bgm-vol-label">🔊 BGM</span>
        <input type="range" id="bgmVolSlider" min="0" max="100" value="50" class="bgm-vol-slider">
      </div>
    </div>
  </div>
</div>

<div id="shopScreen" style="display:none;">
  <div class="panel panel-home panel-shop">
    <div class="panel-shell">
      <div class="panel-pin panel-pin-left" aria-hidden="true"></div>
      <div class="panel-pin panel-pin-right" aria-hidden="true"></div>
      <div class="panel-ornament panel-planet" aria-hidden="true">🪐</div>
      <div class="panel-ornament panel-meteor" aria-hidden="true">☄</div>
      <div class="panel-header">
        <div class="panel-kicker">STAR MARKET</div>
        <h1>星际商店</h1>
      </div>
      <div class="shop-points-bar">
        <span class="sp-label">✨ 累计积分</span>
        <span class="sp-value" id="shopPointsDisplay">0</span>
      </div>
      <div class="shop-grid" id="shopGrid"></div>
      <div class="shop-back-row" style="text-align:center">
        <button class="shop-back-btn" id="shopBackBtn">← 返回主页</button>
      </div>
    </div>
  </div>
</div>

<div id="shopConfirm">
  <div class="shop-confirm-card">
    <h3>确认购买</h3>
    <p id="shopConfirmText"></p>
    <div class="shop-confirm-btns">
      <button class="shop-confirm-yes" id="shopConfirmYes">确认</button>
      <button class="shop-confirm-no" id="shopConfirmNo">取消</button>
    </div>
  </div>
</div>

<div id="shopClosedToast" class="shop-closed-toast">商店关门了，请下次再来</div>

<script type="module" src="scripts/home.js"></script>
</body>
</html>
