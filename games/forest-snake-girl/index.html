<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Forest Snake Girl - Free Online Game</title>
<meta name="description" content="Cute forest snake game with elf girls. Walls wrap around so you never crash. Mobile friendly.">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#a8e6cf,#56ab2f);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;user-select:none;padding:10px}
h1{color:#1d5a1d;margin:5px 0;font-size:22px;text-shadow:1px 1px 2px rgba(255,255,255,.5)}
#hud{display:flex;gap:15px;margin-bottom:10px;font-weight:bold}
#hud div{background:#fff;padding:6px 14px;border-radius:20px;box-shadow:0 2px 6px rgba(0,0,0,.1);font-size:14px;color:#2d6a2d}
canvas{background:#e8f5e9;border:3px solid #2d6a2d;border-radius:10px;touch-action:none;max-width:100%;max-height:65vh}
.screen{position:fixed;inset:0;background:rgba(168,230,207,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;padding:20px;text-align:center}
.screen h2{color:#1d5a1d;font-size:30px;margin-bottom:10px}
.screen p{color:#2d6a2d;margin-bottom:20px;line-height:1.6;font-size:15px}
.skin{font-size:70px;margin:15px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}
.btn{background:#2d6a2d;color:#fff;border:none;padding:14px 36px;font-size:18px;border-radius:30px;cursor:pointer;font-weight:bold;box-shadow:0 4px 10px rgba(0,0,0,.2);transition:.1s}
.btn:active{transform:scale(.95)}
.hidden{display:none!important}
.back{position:fixed;top:10px;left:10px;background:#fff;padding:8px 14px;border-radius:20px;text-decoration:none;color:#2d6a2d;font-weight:bold;box-shadow:0 2px 6px rgba(0,0,0,.1);z-index:5;font-size:14px}
.unlocks{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin:10px;max-width:300px}
.unlocks span{font-size:30px;opacity:.25;transition:.3s}
.unlocks span.on{opacity:1;transform:scale(1.15)}
</style></head>
<body>
<a href="../../index.html" class="back">← Home</a>
<h1>🌳 Forest Snake Girl 🌳</h1>
<div id="hud"><div>Score: <span id="s">0</span></div><div>Best: <span id="b">0</span></div></div>
<canvas id="g" width="400" height="400"></canvas>
<div id="start" class="screen">
<h2>🌳 Forest Snake Girl 🌳</h2><div class="skin">🧝‍♀️</div>
<p>Walls wrap around — never crash on edges!<br>Eat mushrooms to unlock fairy skins<br>📱 Swipe or arrow keys</p>
<button class="btn" onclick="play()">Start Adventure</button>
</div>
<div id="end" class="screen hidden">
<h2>Caught by yourself!</h2><div class="skin" id="es">🧝‍♀️</div>
<p>Score: <b id="fs">0</b> &nbsp; Best: <b id="fb">0</b></p>
<div class="unlocks" id="ul"></div>
<button class="btn" onclick="play()">Try Again</button>
</div>
<script>
const C=document.getElementById('g'),X=C.getContext('2d');
const SK=['🧝‍♀️','🧚','🧚‍♀️','🦋','🌸','👸','🦄','🌺'];
const FD=['🍄','🌰','🍇','🌸','🍃','🍓'];
const W=20;
let G,sn,d,nd,fx,fy,fe,sc,bs,tm,sp,si;
bs=+localStorage.getItem('fsgBest')||0;
document.getElementById('b').textContent=bs;
function fit(){let s=Math.min(innerWidth-20,innerHeight*.6,420);s=Math.floor(s/W)*W;C.width=C.height=s;G=s/W}
function play(){
 document.getElementById('start').classList.add('hidden');
 document.getElementById('end').classList.add('hidden');
 fit();sn=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
 d={x:1,y:0};nd=d;sc=0;si=0;sp=150;
 document.getElementById('s').textContent=0;
 food();clearInterval(tm);tm=setInterval(tick,sp);
}
function food(){do{fx=0|Math.random()*W;fy=0|Math.random()*W}while(sn.some(p=>p.x===fx&&p.y===fy));fe=FD[0|Math.random()*FD.length]}
function tick(){
 d=nd;let h={x:(sn[0].x+d.x+W)%W,y:(sn[0].y+d.y+W)%W};
 if(sn.some(p=>p.x===h.x&&p.y===h.y))return over();
 sn.unshift(h);
 if(h.x===fx&&h.y===fy){sc++;document.getElementById('s').textContent=sc;si=Math.min(0|sc/5,SK.length-1);food();if(sc%10===0&&sp>70){sp-=8;clearInterval(tm);tm=setInterval(tick,sp)}}
 else sn.pop();
 draw();
}
function draw(){
 X.fillStyle='#e8f5e9';X.fillRect(0,0,C.width,C.height);
 X.strokeStyle='rgba(45,106,45,.08)';
 for(let i=0;i<=W;i++){X.beginPath();X.moveTo(i*G,0);X.lineTo(i*G,C.height);X.stroke();X.beginPath();X.moveTo(0,i*G);X.lineTo(C.width,i*G);X.stroke()}
 for(let i=sn.length-1;i>0;i--){X.fillStyle=`hsl(${100+i*2},60%,${55-i*1}%)`;X.beginPath();X.arc(sn[i].x*G+G/2,sn[i].y*G+G/2,G/2-2,0,6.3);X.fill()}
 X.font=`${G*.9}px serif`;X.textAlign='center';X.textBaseline='middle';
 X.fillText(fe,fx*G+G/2,fy*G+G/2);
 X.fillText(SK[si],sn[0].x*G+G/2,sn[0].y*G+G/2);
}
function over(){
 clearInterval(tm);
 if(sc>bs){bs=sc;localStorage.setItem('fsgBest',bs);document.getElementById('b').textContent=bs}
 document.getElementById('fs').textContent=sc;
 document.getElementById('fb').textContent=bs;
 document.getElementById('es').textContent=SK[si];
 let u=document.getElementById('ul');u.innerHTML='';
 SK.forEach((s,i)=>{let e=document.createElement('span');e.textContent=s;if(i<=si)e.className='on';u.appendChild(e)});
 document.getElementById('end').classList.remove('hidden');
}
addEventListener('keydown',e=>{
 let k=e.key;
 if((k==='ArrowUp'||k==='w')&&d.y===0)nd={x:0,y:-1};
 else if((k==='ArrowDown'||k==='s')&&d.y===0)nd={x:0,y:1};
 else if((k==='ArrowLeft'||k==='a')&&d.x===0)nd={x:-1,y:0};
 else if((k==='ArrowRight'||k==='d')&&d.x===0)nd={x:1,y:0};
});
let tx,ty;
C.addEventListener('touchstart',e=>{e.preventDefault();tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:false});
C.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
C.addEventListener('touchend',e=>{
 e.preventDefault();
 let t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
 if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
 if(Math.abs(dx)>Math.abs(dy)){if(dx>0&&d.x===0)nd={x:1,y:0};else if(dx<0&&d.x===0)nd={x:-1,y:0}}
 else{if(dy>0&&d.y===0)nd={x:0,y:1};else if(dy<0&&d.y===0)nd={x:0,y:-1}}
},{passive:false});
addEventListener('resize',()=>{fit();if(sn)draw()});
fit();
</script></body></html>
