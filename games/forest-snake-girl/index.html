<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>3D 星空水晶生存游戏</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow:hidden;width:100%;height:100%;font-family:"Microsoft YaHei",Arial,sans-serif;background:#050816;color:#fff}
#game{width:100vw;height:100vh;display:block}
#hudDesktop{position:fixed;top:12px;left:12px;z-index:10;display:none;flex-direction:column;gap:6px;font-size:15px;text-shadow:0 2px 4px #000;pointer-events:none}
#hudDesktop .hud-line{padding:6px 10px;border-radius:8px;background:rgba(0,0,0,.35);backdrop-filter:blur(4px)}
#hudMobile{position:fixed;top:8px;left:8px;z-index:10;display:none;width:178px;pointer-events:none;transform-origin:top left}
.mobile-hud-panel{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:6px;border-radius:12px;background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(5px);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.mobile-hud-item{min-height:30px;padding:4px 5px;border-radius:7px;background:rgba(255,255,255,.08);text-shadow:0 1px 3px #000}
.mobile-hud-label{display:block;font-size:10px;line-height:1;color:rgba(220,235,255,.78)}
.mobile-hud-value{display:block;margin-top:2px;font-size:12px;font-weight:bold;line-height:1.1;color:#fff}
.mobile-hud-wide{grid-column:span 2}
#warning{position:fixed;top:50%;left:50%;z-index:20;transform:translate(-50%,-50%);padding:14px 22px;border-radius:12px;background:rgba(255,0,0,.86);color:#fff;font-size:24px;font-weight:bold;display:none;animation:pulse .8s infinite alternate;pointer-events:none}
@keyframes pulse{from{transform:translate(-50%,-50%) scale(1);opacity:.75}to{transform:translate(-50%,-50%) scale(1.08);opacity:1}}
#damageOverlay{position:fixed;inset:0;z-index:9;background:rgba(255,0,0,.18);pointer-events:none;opacity:0;transition:opacity .08s linear}
#startScreen,#gameOverScreen{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at top,rgba(90,120,255,.25),transparent 38%),linear-gradient(180deg,#06091f 0%,#0b102f 55%,#050816 100%)}
.panel{width:min(92vw,650px);padding:28px;border-radius:20px;text-align:center;background:rgba(0,0,0,.48);border:1px solid rgba(255,255,255,.18);box-shadow:0 18px 50px rgba(0,0,0,.55);backdrop-filter:blur(10px)}
.panel h1{margin:0 0 14px;font-size:30px;color:#82c7ff}
.panel p{margin:8px 0;line-height:1.6;color:#e8f0ff}
button{margin-top:20px;padding:13px 28px;border:none;border-radius:999px;font-size:18px;font-weight:bold;cursor:pointer;color:#07111f;background:linear-gradient(135deg,#8ef6ff,#82c7ff);box-shadow:0 8px 20px rgba(116,185,255,.35)}
button:active{transform:scale(.96)}
#joystick{position:fixed;left:22px;bottom:28px;width:120px;height:120px;z-index:12;display:none;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);touch-action:none}
#stick{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(116,185,255,.9);box-shadow:0 0 18px rgba(116,185,255,.85)}
#tip{display:none!important}
@media(max-width:768px){
#hudDesktop{display:none!important}
#hudMobile{transform:scale(.88)}
#joystick{display:block;left:50%;bottom:18px;transform:translateX(-50%);width:128px;height:128px;background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.23)}
#stick{left:38px;top:38px;width:52px;height:52px}
.panel{width:min(92vw,460px);padding:20px}
.panel h1{font-size:23px}
.panel p{font-size:13px}
button{font-size:16px;padding:11px 24px}
#warning{font-size:18px;padding:10px 16px}
}
@media(max-width:420px){
#hudMobile{transform:scale(.78);top:6px;left:6px}
#joystick{width:118px;height:118px;bottom:14px}
#stick{left:34px;top:34px;width:50px;height:50px}
}
</style>
</head>

<body>
<canvas id="game"></canvas>
<div id="damageOverlay"></div>

<div id="hudDesktop">
  <div class="hud-line">积分：<span data-bind="score">0</span></div>
  <div class="hud-line">生命：<span data-bind="hp">50</span></div>
  <div class="hud-line">存活：<span data-bind="time">0.0</span>s</div>
  <div class="hud-line">水晶：<span data-bind="crystal">蓝色 +5</span></div>
  <div class="hud-line">敌人速度等级：<span data-bind="enemyLevel">1</span></div>
  <div class="hud-line">场上敌人：<span data-bind="enemyCount">0</span></div>
  <div class="hud-line">紫色精英怪：<span data-bind="purpleCount">0</span>/3</div>
  <div class="hud-line">状态果实：<span data-bind="fruitInfo">25秒后加速果实</span></div>
  <div class="hud-line">加速剩余：<span data-bind="speedBuff">0.0</span>s</div>
  <div class="hud-line">无敌剩余：<span data-bind="invincibleBuff">0.0</span>s</div>
</div>

<div id="hudMobile">
  <div class="mobile-hud-panel">
    <div class="mobile-hud-item"><span class="mobile-hud-label">积分</span><span class="mobile-hud-value" data-bind="score">0</span></div>
    <div class="mobile-hud-item"><span class="mobile-hud-label">生命</span><span class="mobile-hud-value" data-bind="hp">50</span></div>
    <div class="mobile-hud-item"><span class="mobile-hud-label">时间</span><span class="mobile-hud-value"><span data-bind="time">0.0</span>s</span></div>
    <div class="mobile-hud-item"><span class="mobile-hud-label">敌人</span><span class="mobile-hud-value" data-bind="enemyCount">0</span></div>
    <div class="mobile-hud-item"><span class="mobile-hud-label">紫怪</span><span class="mobile-hud-value"><span data-bind="purpleCount">0</span>/3</span></div>
    <div class="mobile-hud-item"><span class="mobile-hud-label">加速</span><span class="mobile-hud-value"><span data-bind="speedBuff">0.0</span>s</span></div>
    <div class="mobile-hud-item"><span class="mobile-hud-label">无敌</span><span class="mobile-hud-value"><span data-bind="invincibleBuff">0.0</span>s</span></div>
    <div class="mobile-hud-item mobile-hud-wide"><span class="mobile-hud-label">水晶</span><span class="mobile-hud-value" data-bind="crystal">蓝色 +5</span></div>
    <div class="mobile-hud-item mobile-hud-wide"><span class="mobile-hud-label">果实</span><span class="mobile-hud-value" data-bind="fruitInfo">25秒后加速果实</span></div>
  </div>
</div>

<div id="warning">警告：生命值过低！</div>
<div id="tip"></div>
<div id="joystick"><div id="stick"></div></div>

<div id="startScreen">
  <div class="panel">
    <h1>星空水晶生存战</h1>
    <p>控制玩家收集水晶，躲避红色敌人和紫色精英怪。</p>
    <p>晶石生成更快，最多20个；怪物卡住2秒会自动销毁。</p>
    <p>加血包削弱为 +8 HP，无敌果实仍可叠加其他状态。</p>
    <p>建议手机横屏游玩。</p>
    <button id="startBtn">开始游戏</button>
  </div>
</div>

<div id="gameOverScreen" style="display:none;">
  <div class="panel">
    <h1>游戏结束</h1>
    <p>最终积分：<span id="finalScore">0</span></p>
    <p>存活时间：<span id="finalTime">0.0</span>s</p>
    <button id="restartBtn">重新开始</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { FBXLoader } from "three/addons/loaders/FBXLoader.js";

let scene,camera,renderer,skyboxMesh=null;
let galaxyClouds=[],galaxyCloudTexture=null;

let platformModel=null,platformMeshes=[],platformRaycaster=new THREE.Raycaster();
let platformWalkRadiusX=20,platformWalkRadiusZ=20,platformReady=false;

let decorationRockModel=null,decorationRockReady=false;

let player,playerFallbackBody=null,playerModel=null,playerMixer=null;
let playerActions={},currentPlayerAnim="",playerHitAnimTimer=0,playerIsDead=false;
let playerTintTargets=[],playerLocatorGroup=null;

let playerHeadUISprite=null,playerHeadUICanvas=null,playerHeadUIContext=null,playerHeadUITexture=null;
let lastHeadUIScore=-1,lastHeadUIHp=-1;

let playerSideEffects=[],crystalScorePopups=[];
let playerBaseColorTexture=null,playerNormalTexture=null;

let playerRadius=.65,clock=new THREE.Clock();
let gameRunning=false,gameOverPending=false,score=0,hp=50,aliveTime=0;

let crystals=[],enemies=[],rocks=[],fruits=[],enemySpawnQueue=[];
let keys={},moveInput=new THREE.Vector2(0,0),playerMovingThisFrame=false;

let enemySpawnTimer=0,crystalSpawnTimer=0,fruitSpawnTimer=0,purpleEnemySpawnTimer=0,nextPurpleEnemySpawnTime=20;
let invincibleFruitSpawnTimer=0,nextInvincibleFruitSpawnTime=50,invincibleTimer=0,invincibleVisualActive=false,invincibleHue=0;
let speedBuffTimer=0,damageFlashTimer=0,lowHpWarningTimer=0,knockbackVelocity=new THREE.Vector3(0,0,0);

let audioCtx=null,audioUnlocked=false,bgmTimer=null,bgmStep=0;

const shared={geo:{},mat:{}};

const worldSize=42;
const maxHp=50;
const maxCrystals=20;
const INITIAL_CRYSTAL_COUNT=8;
const CRYSTAL_SPAWN_INTERVAL=1.25;
const maxFruits=12;
const maxPurpleEnemies=3;
const purpleDetectRange=9.5;
const basePlayerSpeed=5.0;

const HEAL_AMOUNT=8;

const ENEMY_SPEED_MULTIPLIER=1.15;
const ENEMY_MAX_DIFFICULTY_TIME=120;
const MAX_SCENE_ENEMIES=24;
const ENEMY_STUCK_DESTROY_TIME=2.0;
const ENEMY_STUCK_MOVE_EPSILON=0.08;

const INVINCIBLE_FRUIT_COUNT=2;
const INVINCIBLE_FRUIT_LIFE=4.0;
const INVINCIBLE_DURATION=5.0;
const INVINCIBLE_SPEED_MULTIPLIER=2.0;

const GALAXY_CLOUD_SCALE_MULTIPLIER=6;

const SKYBOX_TEXTURE_URL="model/tex/skybox_basecolor_01.png";

const PLATFORM_MODEL_URL="model/Sphere001.fbx";
const PLATFORM_TOP_TEXTURE_URL="model/tex/Sphere001_basecolor_01.png";
const PLATFORM_SIDE_TEXTURE_URL="model/tex/Sphere001_basecolor_02.png";
const PLATFORM_NORMAL_TEXTURE_URL="model/tex/Sphere001_normalmap_01.png";
const PLATFORM_EXTRA_SCALE=1.5;
const PLATFORM_TOP_Y=0;
const PLATFORM_TOP_TEXTURE_REPEAT_X=1;
const PLATFORM_TOP_TEXTURE_REPEAT_Y=1;
const PLATFORM_SIDE_TEXTURE_REPEAT_X=1;
const PLATFORM_SIDE_TEXTURE_REPEAT_Y=1;

const DECORATION_ROCK_MODEL_URL="model/rock_01.fbx";
const DECORATION_ROCK_TEXTURE_URL="model/tex/rock_01_basecolor.png";
const DECORATION_ROCK_PLATFORM_SIZE_RATIO=1.28;
const DECORATION_ROCK_TOP_OFFSET=1.25;
const DECORATION_ROCK_TEXTURE_FLIP_Y=true;
const DECORATION_ROCK_TEXTURE_MIRROR_X=false;

const OBSTACLE_COLOR=0x9F7448;

const PLAYER_MODEL_URL="model/wanjia01.FBX";
const PLAYER_BASE_COLOR_URL="model/tex/wanjia01_basecolor.PNG";
const PLAYER_NORMAL_MAP_URL="model/tex/wanjia01_normalmap.PNG";
const PLAYER_IDLE_ANIM_URL="model/ani/wanjia01_idle.FBX";
const PLAYER_RUN_ANIM_URL="model/ani/wanjia01_run.fbx";
const PLAYER_ATTACKED_ANIM_URL="model/ani/wanjia01_attacked.fbx";
const PLAYER_MODEL_SCALE=.018;
const PLAYER_MODEL_X_ROTATION=-Math.PI/2;
const PLAYER_MODEL_Y_ROTATION=0;
const PLAYER_MODEL_Z_ROTATION=0;
const PLAYER_TEXTURE_FLIP_Y=true;

const playerNormalColor=0x1689ff;
const playerDamageColor=0xff3333;

const hudDesktop=document.getElementById("hudDesktop");
const hudMobile=document.getElementById("hudMobile");
const warning=document.getElementById("warning");
const damageOverlay=document.getElementById("damageOverlay");
const startScreen=document.getElementById("startScreen");
const gameOverScreen=document.getElementById("gameOverScreen");
const tip=document.getElementById("tip");
const finalScore=document.getElementById("finalScore");
const finalTime=document.getElementById("finalTime");

init();

function isMobileLayout(){return window.innerWidth<=768}

function setHUDVisible(visible){
  if(!visible){
    hudDesktop.style.display="none";
    hudMobile.style.display="none";
    return;
  }
  if(isMobileLayout()){
    hudDesktop.style.display="none";
    hudMobile.style.display="block";
  }else{
    hudDesktop.style.display="flex";
    hudMobile.style.display="none";
  }
}

function setBind(name,value){
  document.querySelectorAll(`[data-bind="${name}"]`).forEach(el=>el.textContent=value);
}

function init(){
  scene=new THREE.Scene();

  camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,.1,1000);
  camera.position.set(0,18,18);
  camera.lookAt(0,0,0);

  renderer=new THREE.WebGLRenderer({
    canvas:document.getElementById("game"),
    antialias:window.innerWidth>768,
    powerPreference:"high-performance"
  });
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,isMobileLayout()?1.25:1.6));
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate=true;

  initSharedResources();
  createLights();
  createSkybox();
  createGalaxyClouds();
  createPlatformModel();
  createDecorationRock();
  createPlayer();

  setupControls();
  setupJoystick();

  window.addEventListener("pointerdown",()=>unlockAudio(),{once:true});
  window.addEventListener("resize",onResize);

  document.getElementById("startBtn").onclick=startGame;
  document.getElementById("restartBtn").onclick=startGame;

  animate();
}

function initSharedResources(){
  shared.geo.enemyBody=new THREE.SphereGeometry(.65,14,14);
  shared.geo.enemyHorn=new THREE.ConeGeometry(.25,.5,8);
  shared.geo.enemyEye=new THREE.SphereGeometry(.08,8,8);
  shared.geo.purpleBody=new THREE.SphereGeometry(.65*1.3,18,18);
  shared.geo.purpleHorn=new THREE.ConeGeometry(.32*1.3,.65*1.3,8);
  shared.geo.purpleAura=new THREE.TorusGeometry(.82*1.3,.045,8,30);
  shared.geo.rock=new THREE.DodecahedronGeometry(1,0);
  shared.geo.speedFruit=new THREE.SphereGeometry(.45,16,16);
  shared.geo.speedRing=new THREE.TorusGeometry(.58,.035,8,24);
  shared.geo.healBox=new THREE.BoxGeometry(.85,.65,.85);
  shared.geo.healCrossA=new THREE.BoxGeometry(.52,.12,.08);
  shared.geo.healCrossB=new THREE.BoxGeometry(.12,.52,.08);
  shared.geo.invCore=new THREE.IcosahedronGeometry(.5,1);
  shared.geo.invAura1=new THREE.TorusGeometry(.72,.045,10,48);
  shared.geo.invAura2=new THREE.TorusGeometry(.54,.035,10,48);

  shared.mat.enemyBody=new THREE.MeshStandardMaterial({color:0xff3333,emissive:0x660000,emissiveIntensity:.35,roughness:.5});
  shared.mat.enemyHorn=new THREE.MeshStandardMaterial({color:0x280000});
  shared.mat.enemyEye=new THREE.MeshBasicMaterial({color:0xffff66});
  shared.mat.purpleBody=new THREE.MeshStandardMaterial({color:0x9b35ff,emissive:0x5a00aa,emissiveIntensity:.55,roughness:.42,metalness:.08});
  shared.mat.purpleHorn=new THREE.MeshStandardMaterial({color:0x2b0048,emissive:0x4b0082,emissiveIntensity:.35});
  shared.mat.purpleAura=new THREE.MeshBasicMaterial({color:0xd99cff,transparent:true,opacity:.85});
  shared.mat.obstacle=new THREE.MeshStandardMaterial({color:OBSTACLE_COLOR,roughness:.92,metalness:0});
  shared.mat.speedFruit=new THREE.MeshStandardMaterial({color:0x7cff6b,emissive:0x1aff00,emissiveIntensity:.55,roughness:.35});
  shared.mat.speedRing=new THREE.MeshBasicMaterial({color:0x99ff88});
  shared.mat.healBox=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xff4444,emissiveIntensity:.28,roughness:.35});
  shared.mat.healCross=new THREE.MeshBasicMaterial({color:0xff2222});
  shared.mat.invCore=new THREE.MeshStandardMaterial({color:0xfff36a,emissive:0xff66ff,emissiveIntensity:.75,roughness:.18,metalness:.2});
  shared.mat.invAura1=new THREE.MeshBasicMaterial({color:0x66ffff,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false});
  shared.mat.invAura2=new THREE.MeshBasicMaterial({color:0xff66ff,transparent:true,opacity:.75,blending:THREE.AdditiveBlending,depthWrite:false});
}

function createLights(){
  scene.add(new THREE.AmbientLight(0x6AB7BC,isMobileLayout()?1.05:1.15));
  scene.add(new THREE.HemisphereLight(0x9bbcff,0x15172d,isMobileLayout()?.85:.95));

  const sun=new THREE.DirectionalLight(0xE59F3E,isMobileLayout()?2.2:2.65);
  sun.position.set(-18,28,16);
  sun.castShadow=true;

  const target=new THREE.Object3D();
  target.position.set(0,0,0);
  scene.add(target);
  sun.target=target;

  const mapSize=isMobileLayout()?1024:2048;
  sun.shadow.mapSize.width=mapSize;
  sun.shadow.mapSize.height=mapSize;
  sun.shadow.camera.near=1;
  sun.shadow.camera.far=90;
  sun.shadow.camera.left=-45;
  sun.shadow.camera.right=45;
  sun.shadow.camera.top=45;
  sun.shadow.camera.bottom=-45;
  sun.shadow.bias=-0.00035;
  sun.shadow.normalBias=0.035;
  sun.shadow.radius=isMobileLayout()?2:3;

  scene.add(sun);

  const fill=new THREE.PointLight(0x4f8cff,isMobileLayout()?.9:1.25,45);
  fill.position.set(8,8,8);
  scene.add(fill);
}

function createSkybox(){
  new THREE.TextureLoader().load(
    SKYBOX_TEXTURE_URL,
    texture=>{
      texture.colorSpace=THREE.SRGBColorSpace;
      texture.wrapS=THREE.ClampToEdgeWrapping;
      texture.wrapT=THREE.ClampToEdgeWrapping;
      texture.anisotropy=4;

      skyboxMesh=new THREE.Mesh(
        new THREE.SphereGeometry(480,64,32),
        new THREE.MeshBasicMaterial({map:texture,side:THREE.BackSide,depthWrite:false,depthTest:false})
      );
      skyboxMesh.renderOrder=-999;
      scene.add(skyboxMesh);
    },
    undefined,
    err=>{
      console.warn("天空盒贴图加载失败：",SKYBOX_TEXTURE_URL,err);
      scene.background=new THREE.Color(0x050816);
    }
  );
}

function createGalaxyCloudTexture(){
  const canvas=document.createElement("canvas");
  canvas.width=512;
  canvas.height=256;
  const ctx=canvas.getContext("2d");

  const grad=ctx.createRadialGradient(256,128,10,256,128,250);
  grad.addColorStop(0,"rgba(190,245,255,.62)");
  grad.addColorStop(.24,"rgba(112,190,255,.42)");
  grad.addColorStop(.48,"rgba(185,120,255,.24)");
  grad.addColorStop(.72,"rgba(255,180,120,.13)");
  grad.addColorStop(1,"rgba(20,30,80,0)");
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,512,256);

  for(let i=0;i<90;i++){
    const x=Math.random()*512;
    const y=Math.random()*256;
    const r=Math.random()*1.8+.4;
    const a=Math.random()*.65+.15;
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${a})`;
    ctx.fill();
  }

  const texture=new THREE.CanvasTexture(canvas);
  texture.colorSpace=THREE.SRGBColorSpace;
  texture.needsUpdate=true;
  return texture;
}

function createGalaxyClouds(){
  galaxyCloudTexture=createGalaxyCloudTexture();
  const count=isMobileLayout()?8:14;

  for(let i=0;i<count;i++){
    const mesh=new THREE.Mesh(
      new THREE.PlaneGeometry(1,1),
      new THREE.MeshBasicMaterial({
        map:galaxyCloudTexture,
        color:new THREE.Color().setHSL(.55+Math.random()*.18,.85,.75),
        transparent:true,
        opacity:isMobileLayout()?0.22:0.3,
        side:THREE.DoubleSide,
        depthWrite:false,
        depthTest:true,
        blending:THREE.AdditiveBlending
      })
    );

    const angle=Math.random()*Math.PI*2;
    const radius=34+Math.random()*34;
    const y=-8-Math.random()*14;

    mesh.position.set(Math.cos(angle)*radius,y,Math.sin(angle)*radius);
    mesh.rotation.x=-Math.PI/2+THREE.MathUtils.randFloat(-.25,.25);
    mesh.rotation.z=Math.random()*Math.PI*2;

    const sx=(10+Math.random()*16)*GALAXY_CLOUD_SCALE_MULTIPLIER;
    const sy=(4+Math.random()*8)*GALAXY_CLOUD_SCALE_MULTIPLIER;
    mesh.scale.set(sx,sy,1);

    mesh.renderOrder=-10;
    scene.add(mesh);

    galaxyClouds.push({
      mesh,
      mode:i%3===0?"orbit":"drift",
      baseRadius:radius,
      angle,
      angularSpeed:THREE.MathUtils.randFloat(.018,.045)*(Math.random()<.5?-1:1),
      driftSpeed:THREE.MathUtils.randFloat(.35,.85)*(Math.random()<.5?-1:1),
      rotateSpeed:THREE.MathUtils.randFloat(.018,.08)*(Math.random()<.5?-1:1),
      baseY:y,
      bobSpeed:THREE.MathUtils.randFloat(.25,.55),
      bobOffset:Math.random()*Math.PI*2
    });
  }
}

function updateGalaxyClouds(dt){
  for(const cloud of galaxyClouds){
    const mesh=cloud.mesh;

    if(cloud.mode==="orbit"){
      cloud.angle+=cloud.angularSpeed*dt;
      mesh.position.x=Math.cos(cloud.angle)*cloud.baseRadius;
      mesh.position.z=Math.sin(cloud.angle)*cloud.baseRadius;
    }else{
      mesh.position.x+=cloud.driftSpeed*dt;
      if(mesh.position.x>90)mesh.position.x=-90;
      if(mesh.position.x<-90)mesh.position.x=90;
    }

    mesh.position.y=cloud.baseY+Math.sin(aliveTime*cloud.bobSpeed+cloud.bobOffset)*1.1;
    mesh.rotation.z+=cloud.rotateSpeed*dt;
  }
}

function loadTexture(url,options={}){
  const texture=new THREE.TextureLoader().load(
    url,
    ()=>console.log("贴图加载成功：",url),
    undefined,
    err=>console.warn("贴图加载失败：",url,err)
  );

  texture.colorSpace=options.colorSpace||THREE.SRGBColorSpace;
  texture.wrapS=options.wrapS||THREE.RepeatWrapping;
  texture.wrapT=options.wrapT||THREE.RepeatWrapping;
  texture.repeat.set(options.repeatX??1,options.repeatY??1);
  texture.flipY=options.flipY??false;
  texture.anisotropy=options.anisotropy??4;
  return texture;
}

function createPlatformMaterials(){

  const sideTexture=loadTexture(PLATFORM_SIDE_TEXTURE_URL,{colorSpace:THREE.SRGBColorSpace,repeatX:PLATFORM_SIDE_TEXTURE_REPEAT_X,repeatY:PLATFORM_SIDE_TEXTURE_REPEAT_Y,flipY:false,anisotropy:8});
  const normalTexture=loadTexture(PLATFORM_NORMAL_TEXTURE_URL,{colorSpace:THREE.NoColorSpace,repeatX:1,repeatY:1,flipY:false,anisotropy:8});

  return [

function createPlatformModel(){
  new FBXLoader().load(
    PLATFORM_MODEL_URL,
    fbx=>{
      platformModel=fbx;
      platformMeshes=[];

      scene.add(platformModel);
      fitPlatformToWorld(platformModel);

      const platformMaterials=createPlatformMaterials();

      platformModel.traverse(obj=>{
        if(obj.isMesh||obj.isSkinnedMesh){
          obj.castShadow=false;
          obj.receiveShadow=true;

          if(obj.geometry){
            obj.geometry.computeBoundingBox();
            obj.geometry.computeVertexNormals();
          }

          applyTopSideBottomMaterialsWorld(obj,platformMaterials);
          platformMeshes.push(obj);
        }
      });

      updatePlatformWalkBounds();
      platformReady=true;
      fitDecorationRockToPlatform();

      console.log("平台模型加载成功：",PLATFORM_MODEL_URL);
    },
    undefined,
    err=>console.warn("平台模型加载失败：",PLATFORM_MODEL_URL,err)
  );
}

function fitPlatformToWorld(object3D){
  object3D.updateMatrixWorld(true);

  let box=new THREE.Box3().setFromObject(object3D);
  const size=new THREE.Vector3();
  const center=new THREE.Vector3();

  box.getSize(size);
  box.getCenter(center);

  const maxXZ=Math.max(size.x,size.z);

  if(maxXZ>.001){
    object3D.scale.multiplyScalar(worldSize/maxXZ*PLATFORM_EXTRA_SCALE);
  }

  object3D.updateMatrixWorld(true);

  box=new THREE.Box3().setFromObject(object3D);
  box.getCenter(center);

  object3D.position.x-=center.x;
  object3D.position.z-=center.z;

  object3D.updateMatrixWorld(true);

  box=new THREE.Box3().setFromObject(object3D);
  object3D.position.y+=PLATFORM_TOP_Y-box.max.y;
  object3D.updateMatrixWorld(true);
}

function applyTopSideBottomMaterialsWorld(mesh,materials){
  const geometry=mesh.geometry;

  if(!geometry||!geometry.attributes||!geometry.attributes.position){
    mesh.material=materials[1];
    return;
  }

  if(!geometry.attributes.normal)geometry.computeVertexNormals();

  geometry.clearGroups();

  const posAttr=geometry.attributes.position;
  const index=geometry.index;
  const triCount=index?index.count/3:posAttr.count/3;

  mesh.updateMatrixWorld(true);

  const box=new THREE.Box3().setFromObject(mesh);
  const height=Math.max(.001,box.max.y-box.min.y);
  const topY=box.max.y;

  const a=new THREE.Vector3(),b=new THREE.Vector3(),c=new THREE.Vector3();
  const ab=new THREE.Vector3(),ac=new THREE.Vector3(),normal=new THREE.Vector3(),center=new THREE.Vector3();

  for(let i=0;i<triCount;i++){
    let ia,ib,ic;

    if(index){
      ia=index.getX(i*3);
      ib=index.getX(i*3+1);
      ic=index.getX(i*3+2);
    }else{
      ia=i*3;
      ib=i*3+1;
      ic=i*3+2;
    }

    a.fromBufferAttribute(posAttr,ia).applyMatrix4(mesh.matrixWorld);
    b.fromBufferAttribute(posAttr,ib).applyMatrix4(mesh.matrixWorld);
    c.fromBufferAttribute(posAttr,ic).applyMatrix4(mesh.matrixWorld);

    ab.subVectors(b,a);
    ac.subVectors(c,a);
    normal.crossVectors(ab,ac).normalize();

    center.copy(a).add(b).add(c).multiplyScalar(1/3);

    let materialIndex=1;

    const nearTop=center.y>topY-height*.18;
    const mostlyUp=normal.y>.28;
    const stronglyUp=normal.y>.55;

    if((nearTop&&mostlyUp)||stronglyUp)materialIndex=0;
    else if(normal.y<-.45)materialIndex=2;

    geometry.addGroup(i*3,3,materialIndex);
  }

  mesh.material=materials;
}

function createDecorationRock(){
  const texture=loadTexture(DECORATION_ROCK_TEXTURE_URL,{
    colorSpace:THREE.SRGBColorSpace,
    repeatX:DECORATION_ROCK_TEXTURE_MIRROR_X?-1:1,
    repeatY:1,
    flipY:DECORATION_ROCK_TEXTURE_FLIP_Y,
    anisotropy:8
  });

  if(DECORATION_ROCK_TEXTURE_MIRROR_X)texture.offset.x=1;
  texture.needsUpdate=true;

  const material=new THREE.MeshStandardMaterial({map:texture,color:0xffffff,roughness:.9,metalness:0});

  new FBXLoader().load(
    DECORATION_ROCK_MODEL_URL,
    fbx=>{
      decorationRockModel=fbx;

      decorationRockModel.traverse(obj=>{
        if(obj.isMesh||obj.isSkinnedMesh){
          obj.castShadow=true;
          obj.receiveShadow=true;

          if(obj.geometry){
            obj.geometry.computeBoundingBox();
            obj.geometry.computeVertexNormals();
          }

          obj.material=material;

      decorationRockReady=true;
      fitDecorationRockToPlatform();

      console.log("装饰模型 rock_01 加载成功：",DECORATION_ROCK_MODEL_URL);

    undefined,
    err=>console.warn("装饰模型 rock_01 加载失败：",DECORATION_ROCK_MODEL_URL,err)
  );
}

function fitDecorationRockToPlatform(){
  if(!platformReady||!platformModel||!decorationRockReady||!decorationRockModel)return;

  platformModel.updateMatrixWorld(true);

  decorationRockModel.scale.set(1,1,1);
  decorationRockModel.position.set(0,0,0);
  decorationRockModel.rotation.set(0,0,0);
  decorationRockModel.updateMatrixWorld(true);

  const platformBox=new THREE.Box3().setFromObject(platformModel);
  const platformSize=new THREE.Vector3();
  const platformCenter=new THREE.Vector3();

  platformBox.getSize(platformSize);
  platformBox.getCenter(platformCenter);

  let rockBox=new THREE.Box3().setFromObject(decorationRockModel);
  const rockSize=new THREE.Vector3();
  const rockCenter=new THREE.Vector3();

  rockBox.getSize(rockSize);
  rockBox.getCenter(rockCenter);

  const platformMaxXZ=Math.max(platformSize.x,platformSize.z);
  const rockMaxXZ=Math.max(rockSize.x,rockSize.z);

  if(rockMaxXZ>.001){
    decorationRockModel.scale.setScalar(platformMaxXZ*DECORATION_ROCK_PLATFORM_SIZE_RATIO/rockMaxXZ);
  }

  decorationRockModel.updateMatrixWorld(true);

  rockBox=new THREE.Box3().setFromObject(decorationRockModel);
  rockBox.getCenter(rockCenter);

  decorationRockModel.position.x+=platformCenter.x-rockCenter.x;
  decorationRockModel.position.z+=platformCenter.z-rockCenter.z;

  decorationRockModel.updateMatrixWorld(true);

  rockBox=new THREE.Box3().setFromObject(decorationRockModel);
  decorationRockModel.position.y+=platformBox.max.y+DECORATION_ROCK_TOP_OFFSET-rockBox.max.y;
  decorationRockModel.updateMatrixWorld(true);

  console.log("rock_01 已放大并抬高：",DECORATION_ROCK_PLATFORM_SIZE_RATIO,DECORATION_ROCK_TOP_OFFSET);
}

function updatePlatformWalkBounds(){
  if(!platformModel){
    platformWalkRadiusX=worldSize/2-1;
    platformWalkRadiusZ=worldSize/2-1;
    return;
  }

  platformModel.updateMatrixWorld(true);

  const box=new THREE.Box3().setFromObject(platformModel);
  const size=new THREE.Vector3();
  box.getSize(size);

  platformWalkRadiusX=Math.max(4,size.x*.46);
  platformWalkRadiusZ=Math.max(4,size.z*.46);
}

function clampToPlatform(pos,margin=0){
  const rx=Math.max(1,platformWalkRadiusX-margin);
  const rz=Math.max(1,platformWalkRadiusZ-margin);

  const nx=pos.x/rx;
  const nz=pos.z/rz;
  const len=Math.sqrt(nx*nx+nz*nz);

  if(len>1){
    pos.x=nx/len*rx;
    pos.z=nz/len*rz;
  }

  pos.y=getPlatformHeightAt(pos.x,pos.z);
  return pos;
}

function getPlatformHeightAt(x,z){
  if(!platformReady||platformMeshes.length===0)return PLATFORM_TOP_Y;

  platformRaycaster.set(new THREE.Vector3(x,80,z),new THREE.Vector3(0,-1,0));
  const hits=platformRaycaster.intersectObjects(platformMeshes,false);

  if(hits&&hits.length>0)return hits[0].point.y;
  return PLATFORM_TOP_Y;
}

function snapObjectToPlatform(object3D,extraY=0){
  object3D.position.y=getPlatformHeightAt(object3D.position.x,object3D.position.z)+extraY;
}

function drawRoundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function updatePlayerHeadUI(force=false){
  if(!playerHeadUISprite||!playerHeadUIContext||!playerHeadUITexture)return;

  const safeHp=Math.max(0,hp);

  if(!force&&lastHeadUIScore===score&&lastHeadUIHp===safeHp)return;

  lastHeadUIScore=score;
  lastHeadUIHp=safeHp;

  const ctx=playerHeadUIContext;
  const w=playerHeadUICanvas.width;

  ctx.clearRect(0,0,playerHeadUICanvas.width,playerHeadUICanvas.height);
  ctx.save();

  ctx.shadowColor="rgba(0,0,0,.65)";
  ctx.shadowBlur=18;
  ctx.shadowOffsetY=6;

  drawRoundRect(ctx,64,24,384,126,28);
  ctx.fillStyle="rgba(6,13,24,.74)";
  ctx.fill();

  ctx.shadowBlur=0;
  ctx.shadowOffsetY=0;

  ctx.font="bold 34px Microsoft YaHei, Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillStyle="#fff3b0";
  ctx.fillText(`晶石积分 ${score}`,w/2,58);

  const barX=104;
  const barY=94;
  const barW=304;
  const barH=32;
  const hpRatio=THREE.MathUtils.clamp(safeHp/maxHp,0,1);

  drawRoundRect(ctx,barX,barY,barW,barH,16);
  ctx.fillStyle="rgba(255,255,255,.18)";
  ctx.fill();

  const grad=ctx.createLinearGradient(barX,barY,barX+barW,barY);

  if(hpRatio>.55){
    grad.addColorStop(0,"#60ff9a");
    grad.addColorStop(1,"#19d66b");
  }else if(hpRatio>.25){
    grad.addColorStop(0,"#ffe066");
    grad.addColorStop(1,"#ff9f1c");
  }else{
    grad.addColorStop(0,"#ff6b6b");
    grad.addColorStop(1,"#d90429");
  }

  drawRoundRect(ctx,barX,barY,barW*hpRatio,barH,16);
  ctx.fillStyle=grad;
  ctx.fill();

  ctx.lineWidth=3;
  ctx.strokeStyle="rgba(255,255,255,.55)";
  drawRoundRect(ctx,barX,barY,barW,barH,16);
  ctx.stroke();

  ctx.font="bold 22px Microsoft YaHei, Arial";
  ctx.fillStyle="#ffffff";
  ctx.fillText(`${safeHp}/${maxHp}`,w/2,111);

  ctx.restore();

  playerHeadUITexture.needsUpdate=true;
}

function updateCrystalScorePopups(dt){
  for(let i=crystalScorePopups.length-1;i>=0;i--){
    const popup=crystalScorePopups[i];

    popup.life-=dt;

    const progress=1-popup.life/popup.maxLife;
    const fade=THREE.MathUtils.clamp(popup.life/popup.maxLife,0,1);

    popup.sprite.position.y=popup.startY+progress*1.15;
    popup.sprite.scale.setScalar(1+progress*.25);

    if(popup.sprite.material)popup.sprite.material.opacity=fade;

    if(popup.life<=0){
      scene.remove(popup.sprite);

      if(popup.sprite.material){
        if(popup.sprite.material.map)popup.sprite.material.map.dispose();
        popup.sprite.material.dispose();
      }

      crystalScorePopups.splice(i,1);
    }
  }
}

function clearCrystalScorePopups(){
  for(const popup of crystalScorePopups){
    if(popup.sprite){
      scene.remove(popup.sprite);

      if(popup.sprite.material){
        if(popup.sprite.material.map)popup.sprite.material.map.dispose();
        popup.sprite.material.dispose();
      }
    }
  }

  crystalScorePopups.length=0;
}

function updatePlayerSideEffects(dt){
  for(let i=playerSideEffects.length-1;i>=0;i--){
    const fx=playerSideEffects[i];

    fx.life-=dt;

    const t=1-fx.life/fx.maxLife;
    const fade=THREE.MathUtils.clamp(fx.life/fx.maxLife,0,1);

    fx.group.position.y=t*.55;
    fx.group.rotation.y+=dt*4.2;

    if(fx.ring){
      fx.ring.rotation.z+=dt*7;
      fx.ring.scale.setScalar(1+t*.9);
      fx.ring.material.opacity=.85*fade;
    }

    if(fx.pulse){
      fx.pulse.scale.setScalar(1+t*1.4);
      fx.pulse.material.opacity=.35*fade;
    }

    if(fx.sprite){
      fx.sprite.position.y=1.45+t*.45;
      fx.sprite.material.opacity=fade;
    }

    if(fx.life<=0){
      player.remove(fx.group);

      fx.group.traverse(obj=>{
        if(obj.geometry)obj.geometry.dispose();
        if(obj.material){
          if(obj.material.map)obj.material.map.dispose();
          obj.material.dispose();
        }
      });

      playerSideEffects.splice(i,1);
    }
  }
}

function clearPlayerSideEffects(){
  for(const fx of playerSideEffects){
    if(fx.group){
      player.remove(fx.group);

      fx.group.traverse(obj=>{
        if(obj.geometry)obj.geometry.dispose();
        if(obj.material){
          if(obj.material.map)obj.material.map.dispose();
          obj.material.dispose();
        }
      });
    }
  }

  playerSideEffects.length=0;
}

function loadPlayerTextures(onDone){
  const textureLoader=new THREE.TextureLoader();
  let loadedCount=0;

  function doneOne(){
    loadedCount++;
    if(loadedCount>=2)onDone();
  }

  textureLoader.load(
    PLAYER_BASE_COLOR_URL,
    texture=>{
      texture.colorSpace=THREE.SRGBColorSpace;
      texture.flipY=PLAYER_TEXTURE_FLIP_Y;
      texture.anisotropy=8;
      playerBaseColorTexture=texture;
      doneOne();
    },
    undefined,
    err=>{
      console.warn("玩家颜色贴图加载失败：",PLAYER_BASE_COLOR_URL,err);
      doneOne();
    }
  );

  textureLoader.load(
    PLAYER_NORMAL_MAP_URL,
    texture=>{
      texture.colorSpace=THREE.NoColorSpace;
      texture.flipY=PLAYER_TEXTURE_FLIP_Y;
      texture.anisotropy=8;
      playerNormalTexture=texture;
      doneOne();
    },
    undefined,
    err=>{
      console.warn("玩家法线贴图加载失败：",PLAYER_NORMAL_MAP_URL,err);
      doneOne();
    }
  );
}

function createPlayerMaterial(){
  return new THREE.MeshStandardMaterial({
    map:playerBaseColorTexture||null,
    normalMap:playerNormalTexture||null,
    normalScale:new THREE.Vector2(1,1),
    color:0xffffff,
    roughness:.58,
    metalness:.02,
    emissive:0x000000,
    emissiveIntensity:0
  });
}

function registerPlayerTintTarget(mesh){
  const mats=Array.isArray(mesh.material)?mesh.material:[mesh.material];

  for(const mat of mats){
    if(!mat)continue;

    if(mat.color){
      playerTintTargets.push({
        mat,
        color:mat.color.clone(),
        emissive:mat.emissive?mat.emissive.clone():null
      });
    }
  }
}

function setPlayerTintDamaged(enabled){
  if(invincibleTimer>0&&enabled)return;

  for(const target of playerTintTargets){
    if(enabled){
      if(target.mat.color)target.mat.color.setHex(playerDamageColor);
      if(target.mat.emissive)target.mat.emissive.setHex(0x330000);
    }else{
      if(target.mat.color)target.mat.color.copy(target.color);
      if(target.mat.emissive&&target.emissive)target.mat.emissive.copy(target.emissive);
    }
  }
}

function sanitizeFBXNodeName(name){
  if(!name)return name;
  return name.replace(/[\s.:\/\\]/g,"");
}

function normalizeBoneNameForMatch(name){
  if(!name)return "";

  let result=name;

  if(result.includes("|")){
    const parts=result.split("|");
    result=parts[parts.length-1];
  }

  result=result.replace(/[\s.:\/\\]/g,"");
  result=result.toLowerCase();

  return result;
}

function buildModelNodeMap(root){
  const map=new Map();

  root.traverse(obj=>{
    if(!obj.name)return;

    const rawName=obj.name;
    const normalized=normalizeBoneNameForMatch(rawName);

    map.set(rawName,rawName);
    map.set(normalized,rawName);
  });

  return map;
}

function retargetClipToModel(rawClip,modelRoot,clipName){
  const nodeMap=buildModelNodeMap(modelRoot);
  const newTracks=[];
  const missingTracks=[];

  for(const track of rawClip.tracks){
    const dotIndex=track.name.indexOf(".");

    if(dotIndex===-1){
      newTracks.push(track.clone());
      continue;
    }

    const trackNodeName=track.name.substring(0,dotIndex);
    const propertyName=track.name.substring(dotIndex);
    const normalizedTrackName=normalizeBoneNameForMatch(trackNodeName);

    const matchedName=nodeMap.get(trackNodeName)||nodeMap.get(normalizedTrackName);

    if(matchedName){
      const newTrack=track.clone();
      newTrack.name=matchedName+propertyName;
      newTracks.push(newTrack);
    }else{
      missingTracks.push(track.name);
    }
  }

  const newClip=rawClip.clone();
  newClip.name=clipName;
  newClip.tracks=newTracks;

  if(missingTracks.length>0){
    console.warn(`${clipName} 未匹配轨道前10个：`,missingTracks.slice(0,10));
  }

  return newClip;
}

function loadPlayerFBX(){
  new FBXLoader().load(
    PLAYER_MODEL_URL,
    fbx=>{
      playerModel=fbx;

      playerModel.scale.setScalar(PLAYER_MODEL_SCALE);
      playerModel.rotation.set(PLAYER_MODEL_X_ROTATION,PLAYER_MODEL_Y_ROTATION,PLAYER_MODEL_Z_ROTATION);
      playerModel.position.set(0,0,0);

      playerTintTargets=[];

      playerModel.traverse(obj=>{
        if(obj.name)obj.name=sanitizeFBXNodeName(obj.name);

        if(obj.isMesh||obj.isSkinnedMesh){
          obj.castShadow=true;
          obj.receiveShadow=true;

          const material=createPlayerMaterial();
          obj.material=material;
          registerPlayerTintTarget(obj);
        }
      });

      if(playerFallbackBody)playerFallbackBody.visible=false;

      player.add(playerModel);
      playerMixer=new THREE.AnimationMixer(playerModel);

      loadPlayerAnimation("idle",PLAYER_IDLE_ANIM_URL,true);
      loadPlayerAnimation("run",PLAYER_RUN_ANIM_URL,true);
      loadPlayerAnimation("attacked",PLAYER_ATTACKED_ANIM_URL,false);

      console.log("玩家模型加载成功：",PLAYER_MODEL_URL);
    },
    undefined,
    err=>console.warn("玩家模型加载失败：",PLAYER_MODEL_URL,err)
  );
}

function loadPlayerAnimation(name,url,loop){
  new FBXLoader().load(
    url,
    animFbx=>{
      if(!playerMixer||!playerModel)return;
      if(!animFbx.animations||animFbx.animations.length===0)return;

      const rawClip=animFbx.animations[0];
      const clip=retargetClipToModel(rawClip,playerModel,name);

      if(!clip.tracks||clip.tracks.length===0)return;

      const action=playerMixer.clipAction(clip,playerModel);

      action.enabled=true;
      action.paused=false;
      action.setEffectiveWeight(1);
      action.setEffectiveTimeScale(1);

      if(loop){
        action.setLoop(THREE.LoopRepeat,Infinity);
        action.clampWhenFinished=false;
      }else{
        action.setLoop(THREE.LoopOnce,1);
        action.clampWhenFinished=true;
      }

      playerActions[name]=action;

      if(name==="idle"&&!gameRunning&&!playerIsDead){
        setTimeout(()=>playPlayerAnim("idle",.15,true),100);
      }
    },
    undefined,
    err=>console.warn("玩家动画加载失败：",url,err)
  );
}

function stopAllPlayerActions(exceptName=""){
  for(const key in playerActions){
    const action=playerActions[key];
    if(!action)continue;
    if(key!==exceptName)action.fadeOut(.12);
  }
}

function playPlayerAnim(name,fade=.12,restart=false){
  const action=playerActions[name];
  if(!action)return;

  if(currentPlayerAnim===name&&!restart)return;

  stopAllPlayerActions(name);

  if(restart)action.reset();

  action.enabled=true;
  action.paused=false;
  action.setEffectiveWeight(1);
  action.setEffectiveTimeScale(1);
  action.fadeIn(fade);
  action.play();

  currentPlayerAnim=name;
}

function forcePlayPlayerAnim(name,fade=.05){
  const action=playerActions[name];
  if(!action)return;

  stopAllPlayerActions(name);

  action.reset();
  action.enabled=true;
  action.paused=false;
  action.setEffectiveWeight(1);
  action.setEffectiveTimeScale(1);
  action.fadeIn(fade);
  action.play();

  currentPlayerAnim=name;
}

function updatePlayerAnimation(dt){
  if(playerMixer)playerMixer.update(dt);

  if(playerIsDead)return;

  if(playerHitAnimTimer>0){
    playerHitAnimTimer-=dt;

    if(playerHitAnimTimer<=0){
      if(playerMovingThisFrame)playPlayerAnim("run",.12,false);
      else playPlayerAnim("idle",.12,false);
    }

    return;
  }

  if(playerMovingThisFrame)playPlayerAnim("run",.12,false);
  else playPlayerAnim("idle",.18,false);
}

function clearPlayerActions(){
  for(const key in playerActions){
    const action=playerActions[key];

    if(action){
      action.stop();
      action.reset();
      action.enabled=true;
      action.paused=false;
      action.setEffectiveWeight(1);
      action.setEffectiveTimeScale(1);
    }
  }

  currentPlayerAnim="";
}

function createRocks(){
  rocks.forEach(r=>scene.remove(r.mesh));
  rocks=[];

  for(let i=0;i<8;i++){
    let pos=randomPosition();

    if(distance2D(pos,player.position)<5){
      i--;
      continue;
    }

    const radius=1.1+Math.random()*1.2;
    const mesh=new THREE.Mesh(shared.geo.rock,shared.mat.obstacle);

    mesh.position.set(pos.x,getPlatformHeightAt(pos.x,pos.z)+radius*.65,pos.z);
    mesh.rotation.set(Math.random(),Math.random(),Math.random());
    mesh.scale.set(radius,radius*(.7+Math.random()*.8),radius);
    mesh.castShadow=true;
    mesh.receiveShadow=true;

    scene.add(mesh);

    rocks.push({mesh,radius:radius*.9});
  }
}

function clearObjects(arr){
  arr.forEach(o=>{
    if(o.mesh)scene.remove(o.mesh);
  });
  arr.length=0;
}

function getTier(){
  if(score>=520)return{crystalColor:0xffffff,crystalName:"星白色",crystalValue:80,enemyLevel:7,enemySpeed:7.0,enemyDamage:20};
  if(score>=320)return{crystalColor:0xfff1a8,crystalName:"金色",crystalValue:50,enemyLevel:6,enemySpeed:6.4,enemyDamage:15};
  if(score>=200)return{crystalColor:0xff8c00,crystalName:"橙色",crystalValue:30,enemyLevel:5,enemySpeed:5.8,enemyDamage:12};
  if(score>=120)return{crystalColor:0x001f8f,crystalName:"深蓝色",crystalValue:20,enemyLevel:4,enemySpeed:5.2,enemyDamage:10};
  if(score>=70)return{crystalColor:0xff3030,crystalName:"红色",crystalValue:10,enemyLevel:3,enemySpeed:4.5,enemyDamage:5};
  if(score>=35)return{crystalColor:0xb14cff,crystalName:"紫色",crystalValue:8,enemyLevel:2,enemySpeed:3.8,enemyDamage:5};
  if(score>=15)return{crystalColor:0x2ecc71,crystalName:"绿色",crystalValue:6,enemyLevel:1,enemySpeed:3.3,enemyDamage:5};

  return{
    crystalColor:0x48a8ff,

    enemyLevel:1,

}

function getEnemyDifficultyProgress(){
  return THREE.MathUtils.clamp(aliveTime/ENEMY_MAX_DIFFICULTY_TIME,0,1);
}

function getMaxEnemies(){
  const p=getEnemyDifficultyProgress();
  const max=Math.floor(THREE.MathUtils.lerp(7,MAX_SCENE_ENEMIES,p));
  return Math.min(MAX_SCENE_ENEMIES,max);
}

function getEnemyGroupSize(){
  const p=getEnemyDifficultyProgress();

  if(p>=1)return randomInt(4,6);
  if(p>=.75)return randomInt(3,5);
  if(p>=.5)return randomInt(3,4);
  if(p>=.25)return randomInt(2,4);

  return randomInt(2,3);
}

function getEnemySpawnInterval(){
  const p=getEnemyDifficultyProgress();
  return THREE.MathUtils.lerp(3.4,1.65,p);
}

function getPurpleEnemyCount(){
  return enemies.filter(e=>e.type==="purple").length;
}

function spawnCrystal(){
  const t=getTier();
  const pos=findSafePosition(1.2);

  const mesh=new THREE.Mesh(
    new THREE.OctahedronGeometry(.65,0),
    new THREE.MeshStandardMaterial({
      color:t.crystalColor,
      emissive:t.crystalColor,
      emissiveIntensity:.55,
      roughness:.25,
      metalness:.15
    })
  );

  mesh.position.set(pos.x,getPlatformHeightAt(pos.x,pos.z)+.8,pos.z);
  mesh.castShadow=true;
  scene.add(mesh);

  crystals.push({mesh,radius:.75,value:t.crystalValue});
}

function spawnEnemyGroup(count){
  const canSpawn=Math.max(0,getMaxEnemies()-enemies.length-enemySpawnQueue.length);
  const real=Math.min(count,canSpawn);

  if(real<=0)return;

  const base=randomEdgePosition();

  for(let i=0;i<real;i++){
    const pos=base.clone().add(new THREE.Vector3(
      (Math.random()-.5)*4.5,
      0,
      (Math.random()-.5)*4.5
    ));

    clampToWorld(pos);
    enemySpawnQueue.push(pos);
  }
}

function processEnemySpawnQueue(){
  const perFrame=isMobileLayout()?1:2;

  for(let i=0;i<perFrame&&enemySpawnQueue.length>0;i++){
    if(enemies.length>=getMaxEnemies()){
      enemySpawnQueue.length=0;
      return;
    }

    const pos=enemySpawnQueue.shift();
    spawnEnemyAt(pos);
  }
}

function spawnEnemyAt(pos){

  const group=new THREE.Group();

  const body=new THREE.Mesh(shared.geo.enemyBody,shared.mat.enemyBody);
  body.position.y=.75;
  body.castShadow=true;
  body.receiveShadow=true;
  group.add(body);

  const horn=new THREE.Mesh(shared.geo.enemyHorn,shared.mat.enemyHorn);
  horn.position.y=1.45;
  horn.castShadow=true;
  group.add(horn);

  const eye1=new THREE.Mesh(shared.geo.enemyEye,shared.mat.enemyEye);
  eye1.position.set(-.2,.85,.58);
  group.add(eye1);

  const eye2=new THREE.Mesh(shared.geo.enemyEye,shared.mat.enemyEye);
  eye2.position.set(.2,.85,.58);
  group.add(eye2);

  group.position.set(pos.x,getPlatformHeightAt(pos.x,pos.z),pos.z);
  scene.add(group);

  enemies.push({
    mesh:group,
    type:"normal",
    radius:.7,
    speed:t.enemySpeed*ENEMY_SPEED_MULTIPLIER,
    damage:t.enemyDamage,
    spawnTime:performance.now(),
    active:false,
    agility:1.0,
    stuckTimer:0,

function getFruitSpawnInterval(){
  if(aliveTime<25)return Infinity;
  if(aliveTime>=120)return 1.25;
  if(aliveTime>=60)return 2.2;
  return 4.2;
}

function chooseFruitType(){

  return Math.random()<.55?"speed":"heal";
}

function spawnFruit(){

  const group=createFruitMesh(type);

function spawnInvincibleFruitPair(){
  for(let i=0;i<INVINCIBLE_FRUIT_COUNT;i++)spawnInvincibleFruit();
  playSfx("invincibleSpawn");
}

function spawnInvincibleFruit(){
  const pos=findSafePosition(1.0);
  const group=createFruitMesh("invincible");

  group.position.set(pos.x,getPlatformHeightAt(pos.x,pos.z),pos.z);
  scene.add(group);

  fruits.push({
    mesh:group,
    radius:.82,
    type:"invincible",
    life:INVINCIBLE_FRUIT_LIFE
  });

function activateInvincible(){
  invincibleTimer=INVINCIBLE_DURATION;
  invincibleVisualActive=true;
  spawnPlayerSideEffect("invincible");
  playSfx("invincible");
}

function updateInvincibleState(dt){
  if(invincibleTimer>0){
    invincibleTimer-=dt;
    if(invincibleTimer<0)invincibleTimer=0;
  }

  if(invincibleTimer>0){
    invincibleHue=(invincibleHue+dt*.75)%1;

    const color=new THREE.Color().setHSL(invincibleHue,.95,.62);
    const emissive=new THREE.Color().setHSL((invincibleHue+.35)%1,.95,.45);
    const pulse=.45+Math.sin(aliveTime*18)*.25;

    for(const target of playerTintTargets){
      if(target.mat.color)target.mat.color.copy(color);
      if(target.mat.emissive){
        target.mat.emissive.copy(emissive);
        target.mat.emissiveIntensity=.35+pulse;
      }
    }
  }else if(invincibleVisualActive){
    invincibleVisualActive=false;
    restorePlayerTint();
  }
}

function restorePlayerTint(){
  for(const target of playerTintTargets){
    if(target.mat.color)target.mat.color.copy(target.color);
    if(target.mat.emissive&&target.emissive){
      target.mat.emissive.copy(target.emissive);
      target.mat.emissiveIntensity=0;
    }
  }
}

function animate(){
  requestAnimationFrame(animate);

  const dt=Math.min(clock.getDelta(),.033);

  if(skyboxMesh&&camera)skyboxMesh.position.copy(camera.position);

  updateGalaxyClouds(dt);
  processEnemySpawnQueue();

  if(gameRunning)update(dt);
  else if(playerMixer)playerMixer.update(dt);

  renderer.render(scene,camera);
}

function update(dt){
  aliveTime+=dt;

  if(speedBuffTimer>0)speedBuffTimer-=dt;

  if(lowHpWarningTimer>0){
    lowHpWarningTimer-=dt;
    warning.style.display="block";
  }else{
    warning.style.display="none";
  }

  updateInvincibleState(dt);
  updatePlayer(dt);
  updatePlayerHeadUI();
  updatePlayerLocatorHalo(dt);
  updatePlayerSideEffects(dt);
  updateCrystalScorePopups(dt);
  updateDamageFeedback(dt);
  updatePlayerAnimation(dt);
  updateCamera(dt);
  updateCrystals(dt);
  updateEnemies(dt);
  updateFruits(dt);
  updateSpawns(dt);
  updateHUD();

  if(hp<=0&&!gameOverPending)endGame();
}

function updatePlayer(dt){
  playerMovingThisFrame=false;
  if(playerIsDead)return;

  let input=new THREE.Vector2(0,0);

  if(keys["KeyW"]||keys["ArrowUp"])input.y-=1;
  if(keys["KeyS"]||keys["ArrowDown"])input.y+=1;
  if(keys["KeyA"]||keys["ArrowLeft"])input.x-=1;
  if(keys["KeyD"]||keys["ArrowRight"])input.x+=1;

  input.x+=moveInput.x;
  input.y+=moveInput.y;

  if(input.length()>1)input.normalize();

  const speed=
    basePlayerSpeed*
    (speedBuffTimer>0?1.65:1)*
    (invincibleTimer>0?INVINCIBLE_SPEED_MULTIPLIER:1);

  const move=new THREE.Vector3(input.x,0,input.y).multiplyScalar(speed*dt);

  if(move.lengthSq()>0){
    playerMovingThisFrame=true;

    const old=player.position.clone();

    player.position.add(move);
    clampToWorld(player.position);

    if(collidesWithRocks(player.position,playerRadius)){
      player.position.copy(old);
      clampToWorld(player.position);
    }

    snapObjectToPlatform(player,0);
    player.rotation.y=Math.atan2(move.x,move.z);
  }else{
    snapObjectToPlatform(player,0);
  }

  if(knockbackVelocity.lengthSq()>.01){
    const old=player.position.clone();

    player.position.add(knockbackVelocity.clone().multiplyScalar(dt));
    clampToWorld(player.position);

    if(collidesWithRocks(player.position,playerRadius)){
      player.position.copy(old);
      clampToWorld(player.position);
      knockbackVelocity.multiplyScalar(.25);
    }

    snapObjectToPlatform(player,0);
    knockbackVelocity.multiplyScalar(Math.pow(.04,dt));
  }else{
    knockbackVelocity.set(0,0,0);
  }
}

function updateDamageFeedback(dt){
  if(invincibleTimer>0){
    damageFlashTimer=0;
    setPlayerTintDamaged(false);
    damageOverlay.style.opacity=0;
    return;
  }

  if(damageFlashTimer>0){
    damageFlashTimer-=dt;
    setPlayerTintDamaged(true);
    damageOverlay.style.opacity=1;
  }else{
    setPlayerTintDamaged(false);
    damageOverlay.style.opacity=0;
  }
}

function updateCamera(dt){
  const target=new THREE.Vector3(player.position.x,player.position.y+17,player.position.z+18);
  camera.position.lerp(target,1-Math.pow(.001,dt));
  camera.lookAt(player.position.x,player.position.y,player.position.z);
}

function updateCrystals(dt){
  const t=getTier();

  for(let i=crystals.length-1;i>=0;i--){
    const c=crystals[i];

    c.mesh.rotation.y+=dt*2.2;
    c.mesh.rotation.x+=dt*.8;
    c.mesh.position.y=getPlatformHeightAt(c.mesh.position.x,c.mesh.position.z)+.85+Math.sin(aliveTime*3+i)*.12;

    c.mesh.material.color.setHex(t.crystalColor);
    c.mesh.material.emissive.setHex(t.crystalColor);
    c.value=t.crystalValue;

    if(distance2D(player.position,c.mesh.position)<playerRadius+c.radius){
      const popupPosition=c.mesh.position.clone();
      const addValue=c.value;

      score+=addValue;
      spawnCrystalScorePopup(popupPosition,addValue);
      playSfx("crystal");

      scene.remove(c.mesh);
      crystals.splice(i,1);

      if(crystals.length<maxCrystals){
        setTimeout(()=>{
          if(gameRunning&&crystals.length<maxCrystals)spawnCrystal();
        },500);
      }
    }
  }
}

function updateEnemies(dt){
  const now=performance.now();

  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];

    if(!e.active&&now-e.spawnTime>=300)e.active=true;

    if(!e.active){
      const s=1+Math.sin(now*.03)*.08;
      e.mesh.scale.setScalar(s);
      continue;
    }

    const frameStartPos=e.mesh.position.clone();

    if(e.type==="purple"){
      const d=distance2D(player.position,e.mesh.position);

      if(d<=e.detectRange)e.mode="chase";
      else if(d>e.detectRange*1.35)e.mode="wander";

      const pulse=1+Math.sin(aliveTime*6+i)*.035;
      e.mesh.scale.setScalar(pulse);

      for(const child of e.mesh.children){
        if(child.geometry&&child.geometry.type==="TorusGeometry")child.rotation.z+=dt*3.5;
      }
    }

    let dir;

    if(e.type==="purple"&&e.mode==="wander")dir=getPurpleWanderDirection(e,dt);
    else dir=getEnemySteeringDirection(e);

    if(dir.lengthSq()>.001){
      const old=e.mesh.position.clone();

      e.mesh.position.add(dir.clone().multiplyScalar(e.speed*dt));
      clampToWorld(e.mesh.position);
      snapObjectToPlatform(e.mesh,0);

      if(collidesWithRocks(e.mesh.position,e.radius)){
        e.mesh.position.copy(old);
        clampToWorld(e.mesh.position);
        snapObjectToPlatform(e.mesh,0);

        const escapeDir=getEnemyEscapeDirection(e);
        if(escapeDir.lengthSq()>.001){
          e.mesh.position.add(escapeDir.multiplyScalar(e.speed*dt*1.35));
          clampToWorld(e.mesh.position);
          snapObjectToPlatform(e.mesh,0);

          if(collidesWithRocks(e.mesh.position,e.radius)){
            e.mesh.position.copy(old);
            snapObjectToPlatform(e.mesh,0);
          }
        }

        if(e.type==="purple"&&e.mode==="wander"){
          resetPurpleWander(e);
        }
      }

      e.mesh.rotation.y=Math.atan2(dir.x,dir.z);
    }else{
      snapObjectToPlatform(e.mesh,0);
    }

    updateEnemyStuckState(e,dt,frameStartPos);

    if(e.stuckTimer>=ENEMY_STUCK_DESTROY_TIME){
      scene.remove(e.mesh);
      enemies.splice(i,1);
      continue;
    }

    if(distance2D(player.position,e.mesh.position)<playerRadius+e.radius){
      if(e.type==="purple"&&e.mode!=="chase")continue;

      applyPlayerDamage(e.damage,e.mesh.position);
      scene.remove(e.mesh);
      enemies.splice(i,1);
    }
  }
}

function updateEnemyStuckState(enemy,dt,frameStartPos){
  const frameMove=distance2D(enemy.mesh.position,frameStartPos);

  if(frameMove>ENEMY_STUCK_MOVE_EPSILON){
    enemy.stuckTimer=0;
    enemy.lastCheckPos.copy(enemy.mesh.position);
    return;
  }

  const totalMove=distance2D(enemy.mesh.position,enemy.lastCheckPos);

  if(totalMove>ENEMY_STUCK_MOVE_EPSILON*2){
    enemy.stuckTimer=0;
    enemy.lastCheckPos.copy(enemy.mesh.position);
  }else{
    enemy.stuckTimer+=dt;
  }
}

function getEnemyEscapeDirection(enemy){
  const pos=enemy.mesh.position;
  const away=new THREE.Vector3(0,0,0);

  for(const rock of rocks){
    const d=distance2D(pos,rock.mesh.position);
    const danger=rock.radius+enemy.radius+1.8;

    if(d<danger){
      const v=new THREE.Vector3().subVectors(pos,rock.mesh.position);
      v.y=0;

      if(v.lengthSq()>.001){
        v.normalize();
        away.add(v.multiplyScalar((danger-d)/danger+0.35));
      }
    }
  }

  if(away.lengthSq()<.001){
    away.set(Math.random()-.5,0,Math.random()-.5);
  }

  away.normalize();
  return away;
}

function getEnemySteeringDirection(enemy){
  const pos=enemy.mesh.position;
  const toPlayer=new THREE.Vector3().subVectors(player.position,pos);
  toPlayer.y=0;

  if(toPlayer.lengthSq()<.001)return new THREE.Vector3(0,0,0);

  toPlayer.normalize();

  const agility=enemy.agility||1;
  const avoidance=new THREE.Vector3(0,0,0);
  const lookAhead=4.2*agility;
  const future=pos.clone().add(toPlayer.clone().multiplyScalar(lookAhead));

  for(const rock of rocks){
    const distNow=distance2D(pos,rock.mesh.position);
    const distFuture=distance2D(future,rock.mesh.position);
    const danger=rock.radius+enemy.radius+2.7*agility;

    if(distNow<danger||distFuture<danger){
      const away=new THREE.Vector3().subVectors(pos,rock.mesh.position);
      away.y=0;

      if(away.lengthSq()>.001){
        away.normalize();

        const tangentA=new THREE.Vector3(-away.z,0,away.x);
        const tangentB=new THREE.Vector3(away.z,0,-away.x);
        const tangent=tangentA.dot(toPlayer)>tangentB.dot(toPlayer)?tangentA:tangentB;

        const strength=THREE.MathUtils.clamp((danger-Math.min(distNow,distFuture))/danger,0,1);

        avoidance.add(away.multiplyScalar(strength*2.8*agility));
        avoidance.add(tangent.multiplyScalar(strength*2.3*agility));
      }
    }
  }

  const finalDir=toPlayer.multiplyScalar(enemy.type==="purple"?1.2:1.0).add(avoidance);

  if(finalDir.lengthSq()>.001)finalDir.normalize();

  return finalDir;
}

function getPurpleWanderDirection(enemy,dt){
  enemy.wanderTimer-=dt;

  if(enemy.wanderTimer<=0)resetPurpleWander(enemy);

  const dir=enemy.wanderDir.clone();
  const avoidance=new THREE.Vector3(0,0,0);
  const future=enemy.mesh.position.clone().add(dir.clone().multiplyScalar(3.2));

  for(const rock of rocks){
    const d=distance2D(future,rock.mesh.position);
    const danger=rock.radius+enemy.radius+2.0;

    if(d<danger){
      const away=new THREE.Vector3().subVectors(enemy.mesh.position,rock.mesh.position);
      away.y=0;

      if(away.lengthSq()>.001){
        away.normalize();
        avoidance.add(away.multiplyScalar((danger-d)/danger*2.6));
      }
    }
  }

  const finalDir=dir.add(avoidance);

  if(finalDir.lengthSq()>.001)finalDir.normalize();

  return finalDir;
}

function resetPurpleWander(enemy){
  const a=Math.random()*Math.PI*2;
  enemy.wanderDir.set(Math.cos(a),0,Math.sin(a));
  enemy.wanderTimer=THREE.MathUtils.randFloat(1.5,3.8);
}

function applyPlayerDamage(damage,enemyPosition){
  if(playerIsDead)return;

  if(invincibleTimer>0){
    playSfx("invincibleHit");
    spawnPlayerSideEffect("shield");
    return;
  }

  hp-=damage;
  playSfx("damage");
  damageFlashTimer=.18;
  playerHitAnimTimer=.45;

  forcePlayPlayerAnim("attacked",.05);

  if(hp<=15){
    lowHpWarningTimer=3.0;
    warning.style.display="block";
  }

  const knockDir=new THREE.Vector3().subVectors(player.position,enemyPosition);
  knockDir.y=0;

  if(knockDir.lengthSq()<.001)knockDir.set(Math.random()-.5,0,Math.random()-.5);

  knockDir.normalize();
  knockbackVelocity.copy(knockDir.multiplyScalar(13.5));
}

function updateFruits(dt){
  for(let i=fruits.length-1;i>=0;i--){
    const f=fruits[i];

    f.life-=dt;
    f.mesh.rotation.y+=dt*2.5;

    for(const child of f.mesh.children){
      if(child.geometry&&child.geometry.type==="TorusGeometry"){
        child.rotation.z+=dt*(f.type==="invincible"?5:2.5);
      }
    }

    f.mesh.position.y=getPlatformHeightAt(f.mesh.position.x,f.mesh.position.z)+Math.sin(aliveTime*4+i)*.12;

    if(f.life<=0){
      scene.remove(f.mesh);
      fruits.splice(i,1);
      continue;
    }

    if(distance2D(player.position,f.mesh.position)<playerRadius+f.radius){
      if(f.type==="speed"){
        speedBuffTimer=Math.min(speedBuffTimer+1.5,8.0);
        spawnPlayerSideEffect("speed");
      }

      if(f.type==="heal"){
        hp=Math.min(maxHp,hp+HEAL_AMOUNT);
        spawnPlayerSideEffect("heal");
      }

      if(f.type==="invincible"){
        activateInvincible();
      }

      scene.remove(f.mesh);
      fruits.splice(i,1);
    }
  }
}

function updateSpawns(dt){
  crystalSpawnTimer+=dt;
  enemySpawnTimer+=dt;
  fruitSpawnTimer+=dt;
  purpleEnemySpawnTimer+=dt;
  invincibleFruitSpawnTimer+=dt;

  if(crystalSpawnTimer>CRYSTAL_SPAWN_INTERVAL&&crystals.length<maxCrystals){
    crystalSpawnTimer=0;
    spawnCrystal();
  }

  if(enemySpawnTimer>getEnemySpawnInterval()){
    enemySpawnTimer=0;
    spawnEnemyGroup(getEnemyGroupSize());
  }

  if(purpleEnemySpawnTimer>nextPurpleEnemySpawnTime){
    purpleEnemySpawnTimer=0;
    nextPurpleEnemySpawnTime=randomInt(15,35);

    if(getPurpleEnemyCount()<maxPurpleEnemies)spawnPurpleEnemy();
  }

  if(invincibleFruitSpawnTimer>nextInvincibleFruitSpawnTime){
    invincibleFruitSpawnTimer=0;
    nextInvincibleFruitSpawnTime=randomInt(40,70);
    spawnInvincibleFruitPair();
  }

  const fruitInterval=getFruitSpawnInterval();

  if(fruitSpawnTimer>fruitInterval&&fruits.length<maxFruits){
    fruitSpawnTimer=0;

    const count=aliveTime>=120?randomInt(1,2):1;

    for(let i=0;i<count;i++){
      if(fruits.length<maxFruits)spawnFruit();
    }
  }
}

  else if(aliveTime<45)setBind("fruitInfo",`加速果实 / 无敌${invincibleNext}s`);
  else if(aliveTime<60)setBind("fruitInfo",`加速+加血 / 无敌${invincibleNext}s`);
  else if(aliveTime<120)setBind("fruitInfo",`果实加快 / 无敌${invincibleNext}s`);
  else setBind("fruitInfo",`MAX刷新 / 无敌${invincibleNext}s`);
}

function randomPosition(){
  const margin=2.2;
  const rx=Math.max(2,platformWalkRadiusX-margin);
  const rz=Math.max(2,platformWalkRadiusZ-margin);

  const angle=Math.random()*Math.PI*2;
  const radius=Math.sqrt(Math.random());

  const x=Math.cos(angle)*rx*radius;
  const z=Math.sin(angle)*rz*radius;
  const y=getPlatformHeightAt(x,z);

  return new THREE.Vector3(x,y,z);
}

function randomEdgePosition(){
  const margin=1.8;
  const rx=Math.max(3,platformWalkRadiusX-margin);
  const rz=Math.max(3,platformWalkRadiusZ-margin);

  const angle=Math.random()*Math.PI*2;

  const x=Math.cos(angle)*rx;
  const z=Math.sin(angle)*rz;
  const y=getPlatformHeightAt(x,z);

  return new THREE.Vector3(x,y,z);
}

function findSafePosition(radius){
  for(let i=0;i<90;i++){
    const pos=randomPosition();

    if(distance2D(pos,player.position)<4.5)continue;
    if(collidesWithRocks(pos,radius))continue;

    let tooClose=false;

    for(const c of crystals){
      if(distance2D(pos,c.mesh.position)<3){
        tooClose=true;
        break;
      }
    }

    for(const f of fruits){
      if(distance2D(pos,f.mesh.position)<3){
        tooClose=true;
        break;
      }
    }

    if(!tooClose)return pos;
  }

  return randomPosition();
}

function collidesWithRocks(pos,radius){
  for(const r of rocks){
    if(distance2D(pos,r.mesh.position)<radius+r.radius)return true;
  }
  return false;
}

function clampToWorld(pos){
  clampToPlatform(pos,.8);
}

function distance2D(a,b){
  const dx=a.x-b.x;
  const dz=a.z-b.z;
  return Math.sqrt(dx*dx+dz*dz);
}

function randomInt(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

function setupControls(){
  window.addEventListener("keydown",e=>keys[e.code]=true);
  window.addEventListener("keyup",e=>keys[e.code]=false);
}

function setupJoystick(){
  const joystick=document.getElementById("joystick");
  const stick=document.getElementById("stick");

  let active=false;
  let center={x:0,y:0};
  let maxDist=42;

  joystick.addEventListener("pointerdown",e=>{
    active=true;
    unlockAudio();

    const rect=joystick.getBoundingClientRect();

    center.x=rect.left+rect.width/2;
    center.y=rect.top+rect.height/2;
    maxDist=rect.width*.35;

    joystick.setPointerCapture(e.pointerId);
    updateStick(e.clientX,e.clientY);
  });

  joystick.addEventListener("pointermove",e=>{
    if(!active)return;
    updateStick(e.clientX,e.clientY);
  });

  joystick.addEventListener("pointerup",()=>{
    active=false;
    moveInput.set(0,0);
    resetStick();
  });

  joystick.addEventListener("pointercancel",()=>{
    active=false;
    moveInput.set(0,0);
    resetStick();
  });

  function updateStick(x,y){
    let dx=x-center.x;
    let dy=y-center.y;

    const dist=Math.sqrt(dx*dx+dy*dy);

    if(dist>maxDist){
      dx=dx/dist*maxDist;
      dy=dy/dist*maxDist;
    }

    const base=joystick.getBoundingClientRect();
    const stickSize=stick.offsetWidth;

    stick.style.left=`${base.width/2-stickSize/2+dx}px`;
    stick.style.top=`${base.height/2-stickSize/2+dy}px`;

    moveInput.set(dx/maxDist,dy/maxDist);
  }

  function resetStick(){
    const base=joystick.getBoundingClientRect();
    const stickSize=stick.offsetWidth;

    stick.style.left=`${base.width/2-stickSize/2}px`;
    stick.style.top=`${base.height/2-stickSize/2}px`;
  }

  resetStick();
}

function onResize(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,isMobileLayout()?1.25:1.6));

  if(playerHeadUISprite){
    playerHeadUISprite.scale.set(isMobileLayout()?5.35:4.65,isMobileLayout()?2.05:1.82,1);
  }

  if(gameRunning)setHUDVisible(true);
}

function initAudio(){
  if(audioCtx)return;

  const AudioContextClass=window.AudioContext||window.webkitAudioContext;

  if(!AudioContextClass){
    console.warn("当前浏览器不支持 WebAudio");
    return;
  }

  audioCtx=new AudioContextClass();
}

function unlockAudio(){
  initAudio();

  if(!audioCtx)return;

  if(audioCtx.state==="suspended")audioCtx.resume();

  audioUnlocked=true;
}

function playTone(freq,duration,type="sine",volume=.06,delay=0){
  if(!audioCtx||!audioUnlocked)return;

  const now=audioCtx.currentTime+delay;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type=type;
  osc.frequency.setValueAtTime(freq,now);

  gain.gain.setValueAtTime(0,now);
  gain.gain.linearRampToValueAtTime(volume,now+.015);
  gain.gain.exponentialRampToValueAtTime(.0001,now+duration);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now+duration+.05);
}

function playNoise(duration=.12,volume=.04){
  if(!audioCtx||!audioUnlocked)return;

  const bufferSize=Math.floor(audioCtx.sampleRate*duration);
  const buffer=audioCtx.createBuffer(1,bufferSize,audioCtx.sampleRate);
  const data=buffer.getChannelData(0);

  for(let i=0;i<bufferSize;i++){
    data[i]=(Math.random()*2-1)*(1-i/bufferSize);
  }

  const source=audioCtx.createBufferSource();
  const gain=audioCtx.createGain();

  source.buffer=buffer;
  gain.gain.value=volume;

  source.connect(gain);
  gain.connect(audioCtx.destination);

  source.start();
}

function playSfx(type){
  if(!audioCtx||!audioUnlocked)return;

  if(type==="start"){
    playTone(392,.12,"sine",.08,0);
    playTone(523.25,.14,"sine",.075,.1);
    playTone(659.25,.18,"sine",.07,.22);
  }

  if(type==="crystal"){
    playTone(880,.08,"triangle",.065,0);
    playTone(1174.66,.1,"triangle",.055,.06);
  }

  if(type==="speed"){
    playTone(523.25,.08,"sawtooth",.045,0);
    playTone(659.25,.08,"sawtooth",.04,.07);
    playTone(783.99,.12,"sawtooth",.035,.14);
  }

  if(type==="heal"){
    playTone(392,.12,"sine",.06,0);
    playTone(523.25,.14,"sine",.055,.11);
    playTone(659.25,.18,"sine",.05,.22);
  }

  if(type==="invincible"){
    playTone(523.25,.08,"triangle",.07,0);
    playTone(659.25,.08,"triangle",.065,.06);
    playTone(783.99,.09,"triangle",.06,.12);
    playTone(1046.5,.16,"triangle",.055,.2);
  }

  if(type==="invincibleSpawn"){
    playTone(311.13,.16,"sine",.035,0);
    playTone(466.16,.18,"sine",.032,.12);
  }

  if(type==="invincibleHit"){
    playTone(740,.08,"square",.035,0);
    playTone(988,.08,"square",.028,.05);
  }

  if(type==="damage"){
    playNoise(.12,.055);
    playTone(110,.16,"square",.045,0);
  }

  if(type==="purple"){
    playTone(196,.16,"triangle",.035,0);
    playTone(246.94,.22,"triangle",.03,.12);
  }

  if(type==="gameover"){
    playTone(329.63,.18,"sine",.06,0);
    playTone(246.94,.22,"sine",.055,.18);
    playTone(164.81,.35,"sine",.05,.42);
  }
}

function startBGM(){
  if(!audioCtx||!audioUnlocked||bgmTimer)return;

  const melody=[196,246.94,293.66,369.99,329.63,293.66,246.94,220];

  bgmTimer=setInterval(()=>{
    if(!gameRunning||!audioCtx||!audioUnlocked)return;

    const note=melody[bgmStep%melody.length];
    const bass=melody[(bgmStep+4)%melody.length]/2;

    playTone(note,.28,"sine",.028,0);
    playTone(bass,.52,"triangle",.018,0);

    if(invincibleTimer>0){
      playTone(note*2,.09,"triangle",.026,.02);
    }else if(bgmStep%4===0){
      playTone(note*2,.08,"triangle",.018,.04);
    }

    bgmStep++;
  },360);
}

function stopBGM(){
  if(bgmTimer){
    clearInterval(bgmTimer);
    bgmTimer=null;
  }
}
</script>
