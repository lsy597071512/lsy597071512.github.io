<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>星空水晶生存战</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Exo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />
<style>
:root{
--c-cyan:#00f0ff;
--c-purple:#b44dff;
--c-pink:#ff2d95;
--c-gold:#ffd700;
--c-green:#39ff14;
--c-red:#ff1744;
--c-dark:#07071e;
--c-mid:#0d0d3b;
--c-panel:rgba(8,8,48,.8);
--c-text:#f0f6ff;
--font-d:'Orbitron','Exo 2','Microsoft YaHei',sans-serif;
--font-b:'Exo 2','Microsoft YaHei',Arial,sans-serif
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow:hidden;width:100%;height:100%;font-family:var(--font-b);background:var(--c-dark);color:var(--c-text)}
#game{width:100vw;height:100vh;display:block}
#scanlines{position:fixed;inset:0;z-index:99998;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,240,255,.018) 3px,rgba(0,240,255,.018) 4px);display:none}

/* ===== HUD Desktop ===== */
#hudDesktop{position:fixed;top:12px;left:12px;z-index:10;display:none;flex-direction:column;gap:5px;font-size:13px;font-family:var(--font-b);pointer-events:none}
#hudDesktop .hud-line{position:relative;padding:5px 28px 5px 12px;border-radius:4px;background:rgba(0,0,0,.55);border:1px solid rgba(0,240,255,.12);border-left:3px solid var(--c-cyan);box-shadow:0 0 12px rgba(0,240,255,.06);backdrop-filter:blur(6px);font-weight:600;color:rgba(240,246,255,.7)}
#hudDesktop .hud-line::after{content:'';position:absolute;right:6px;top:50%;transform:translateY(-50%);width:4px;height:4px;border-radius:50%;background:var(--c-cyan);box-shadow:0 0 6px var(--c-cyan)}
#hudDesktop .hud-line span{color:var(--c-text);font-family:var(--font-d);font-weight:700;text-shadow:0 0 8px rgba(0,240,255,.35)}

/* ===== HUD Mobile ===== */
#hudMobile{position:fixed;top:8px;left:8px;z-index:10;display:none;width:182px;pointer-events:none;transform-origin:top left}
.mobile-hud-panel{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:5px;border-radius:8px;background:rgba(7,7,30,.78);border:1px solid rgba(0,240,255,.14);box-shadow:0 0 20px rgba(0,240,255,.05),inset 0 0 30px rgba(180,77,255,.04);backdrop-filter:blur(8px)}
.mobile-hud-item{position:relative;min-height:28px;padding:3px 6px;border-radius:4px;background:rgba(0,240,255,.04);border:1px solid rgba(0,240,255,.07);overflow:hidden}
.mobile-hud-label{display:block;font-size:9px;line-height:1;font-family:var(--font-b);font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:rgba(0,240,255,.65)}
.mobile-hud-value{display:block;margin-top:1px;font-size:11px;font-weight:700;font-family:var(--font-d);line-height:1.1;color:var(--c-text);text-shadow:0 0 6px rgba(0,240,255,.2)}
.mobile-hud-wide{grid-column:span 2}
.mobile-hud-item::before{content:'';position:absolute;top:0;left:0;width:2px;height:100%;background:linear-gradient(180deg,var(--c-cyan),var(--c-purple));opacity:.4}

/* ===== Start / GameOver Screens ===== */
#startScreen,#gameOverScreen{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 0%,rgba(90,60,255,.35) 0%,transparent 55%),radial-gradient(ellipse at 80% 80%,rgba(255,45,149,.12) 0%,transparent 40%),linear-gradient(180deg,#07071e 0%,#0d0d3b 50%,#07071e 100%)}
#startScreen::before,#gameOverScreen::before{content:'';position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 20% 30%,rgba(255,255,255,.3),transparent),radial-gradient(1px 1px at 40% 70%,rgba(255,255,255,.2),transparent),radial-gradient(1.5px 1.5px at 60% 20%,rgba(255,255,255,.25),transparent),radial-gradient(1px 1px at 80% 50%,rgba(255,255,255,.2),transparent),radial-gradient(1px 1px at 10% 80%,rgba(255,255,255,.15),transparent),radial-gradient(1.5px 1.5px at 90% 10%,rgba(255,255,255,.2),transparent),radial-gradient(1px 1px at 50% 50%,rgba(255,255,255,.1),transparent);background-size:200px 200px}

/* ===== Panel ===== */
.panel{position:relative;width:min(94vw,760px);max-height:94vh;overflow:auto;padding:30px;text-align:center;background:var(--c-panel);border:2px solid rgba(0,240,255,.2);border-radius:16px;box-shadow:0 0 30px rgba(0,240,255,.08),0 20px 60px rgba(0,0,0,.6),inset 0 0 80px rgba(180,77,255,.04);backdrop-filter:blur(12px)}
.panel::before{content:'';position:absolute;inset:-2px;border-radius:16px;padding:2px;background:conic-gradient(from 0deg,transparent,var(--c-cyan),transparent,var(--c-purple),transparent);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.5;animation:rotateBorder 6s linear infinite}
@keyframes rotateBorder{to{transform:rotate(360deg)}}
.panel h1{margin:0 0 10px;font-family:var(--font-d);font-size:32px;font-weight:900;color:var(--c-text);text-shadow:0 0 20px rgba(0,240,255,.4),0 0 60px rgba(0,240,255,.15);-webkit-text-stroke:1px rgba(0,240,255,.15)}
.panel h2{font-family:var(--font-d);font-size:20px;color:var(--c-cyan);text-shadow:0 0 12px rgba(0,240,255,.3)}
.panel p{margin:8px 0;line-height:1.55;font-family:var(--font-b);color:rgba(240,246,255,.78)}

/* ===== Buttons ===== */
button{position:relative;margin-top:20px;padding:14px 44px;border:none;border-radius:999px;font-family:var(--font-d);font-size:18px;font-weight:700;cursor:pointer;color:#07071e;background:linear-gradient(135deg,var(--c-cyan),var(--c-purple));box-shadow:0 0 24px rgba(0,240,255,.28),0 6px 20px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:1.5px;transition:transform .12s,box-shadow .12s}
button:hover{transform:scale(1.04);box-shadow:0 0 36px rgba(0,240,255,.45),0 8px 28px rgba(0,0,0,.4)}
button:active{transform:scale(.96);box-shadow:0 0 16px rgba(0,240,255,.2),0 2px 10px rgba(0,0,0,.3)}
button::after{content:'';position:absolute;top:0;left:10%;right:10%;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.25),transparent);border-radius:999px 999px 50% 50%;pointer-events:none}

/* ===== Warning ===== */
#warning{position:fixed;top:50%;left:50%;z-index:20;transform:translate(-50%,-50%);padding:16px 32px;border-radius:8px;background:rgba(255,17,68,.15);border:2px solid var(--c-red);color:var(--c-red);font-family:var(--font-d);font-size:26px;font-weight:900;display:none;animation:warnPulse .5s infinite alternate;pointer-events:none;text-shadow:0 0 20px rgba(255,17,68,.5);box-shadow:0 0 30px rgba(255,17,68,.2),inset 0 0 30px rgba(255,17,68,.1);letter-spacing:4px}
@keyframes warnPulse{from{transform:translate(-50%,-50%) scale(1);opacity:.7;box-shadow:0 0 20px rgba(255,17,68,.15)}to{transform:translate(-50%,-50%) scale(1.1);opacity:1;box-shadow:0 0 50px rgba(255,17,68,.35)}}

/* ===== Damage Overlay ===== */
#damageOverlay{position:fixed;inset:0;z-index:9;background:radial-gradient(ellipse at center,rgba(255,17,68,.25),transparent 70%);pointer-events:none;opacity:0;transition:opacity .06s linear}

/* ===== Joystick ===== */
#joystick{position:fixed;left:22px;bottom:28px;width:126px;height:126px;z-index:12;display:none;border-radius:50%;background:rgba(0,240,255,.04);border:2px solid rgba(0,240,255,.15);touch-action:none;box-shadow:0 0 24px rgba(0,240,255,.04),inset 0 0 30px rgba(0,240,255,.03)}
#joystick::before{content:'';position:absolute;inset:4px;border-radius:50%;border:1px dashed rgba(0,240,255,.08);pointer-events:none}
#stick{position:absolute;left:36px;top:36px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,rgba(0,240,255,.85),rgba(180,77,255,.7));box-shadow:0 0 24px rgba(0,240,255,.5),0 0 60px rgba(0,240,255,.15);border:2px solid rgba(255,255,255,.15);transition:none}
#stick::after{content:'';position:absolute;inset:8px;border-radius:50%;border:1.5px solid rgba(255,255,255,.12);pointer-events:none}

/* ===== Tip ===== */
#tip{display:none!important}

/* ===== Achievement Panel ===== */
.achievement-panel{margin:16px auto 0;padding:16px;border-radius:12px;background:rgba(0,240,255,.03);border:1px solid rgba(0,240,255,.1);box-shadow:inset 0 0 40px rgba(180,77,255,.04);position:relative;overflow:hidden}
.achievement-panel::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--c-cyan),transparent);opacity:.4}

/* ===== Rank ===== */
.rank-row{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.rank-badge{padding:7px 16px;border-radius:999px;font-size:14px;font-weight:700;font-family:var(--font-d);color:#07071e;background:linear-gradient(135deg,#ffe44d,#ff8c00);box-shadow:0 0 20px rgba(255,215,0,.25);border:2px solid rgba(255,255,255,.12);text-transform:uppercase;letter-spacing:1px}
.rank-stat{padding:6px 10px;border-radius:6px;background:rgba(0,0,0,.3);font-size:12px;font-family:var(--font-b);font-weight:600;color:var(--c-text);border:1px solid rgba(0,240,255,.06)}

/* ===== Progress ===== */
.progress-wrap{height:10px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden;margin:8px auto 10px;max-width:560px;border:1px solid rgba(0,240,255,.08);position:relative}
.progress-wrap::after{content:'';position:absolute;inset:0;border-radius:999px;background:repeating-linear-gradient(90deg,transparent,transparent 4px,rgba(255,255,255,.02) 4px,rgba(255,255,255,.02) 5px);pointer-events:none}
.progress-bar{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,var(--c-cyan),var(--c-purple),var(--c-pink));position:relative;transition:width .4s ease}
.progress-bar::after{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.25),transparent);border-radius:999px 999px 50% 50%}

/* ===== Achievements Grid ===== */
.achievements{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.achievement{padding:8px 6px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);font-size:11px;font-family:var(--font-b);color:rgba(240,246,255,.5);transition:all .3s}
.achievement.unlocked{background:linear-gradient(135deg,rgba(0,240,255,.08),rgba(180,77,255,.06));color:var(--c-text);border-color:rgba(0,240,255,.15);box-shadow:0 0 16px rgba(0,240,255,.08),inset 0 0 20px rgba(180,77,255,.04)}
.achievement .icon{display:block;font-size:18px;margin-bottom:2px}
.new-achievement{margin:10px 0 0;padding:8px 14px;border-radius:8px;font-family:var(--font-b);font-weight:600;color:var(--c-gold);background:rgba(255,215,0,.06);border:1px solid rgba(255,215,0,.15);text-shadow:0 0 8px rgba(255,215,0,.2)}

/* ===== Responsive: <=768px ===== */
@media(max-width:768px){
#hudDesktop{display:none!important}
#hudMobile{transform:scale(.88)}
#joystick{display:block;left:50%;bottom:14px;transform:translateX(-50%);width:132px;height:132px;background:rgba(0,240,255,.03);border:2px solid rgba(0,240,255,.12)}
#stick{left:38px;top:38px;width:56px;height:56px}
.panel{width:min(94vw,560px);padding:14px 16px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.panel h1{font-size:20px;margin-bottom:6px}
.panel p{font-size:12px;margin:4px 0}
button{font-size:14px;padding:10px 22px;margin-top:12px}
#warning{font-size:18px;padding:12px 20px}
.achievements{grid-template-columns:repeat(2,1fr);gap:4px;margin-top:6px}
.achievement{padding:5px 4px;font-size:9px;border-radius:6px}
.achievement .icon{font-size:14px;margin-bottom:1px}
.rank-badge{padding:5px 10px;font-size:12px}
.rank-stat{padding:4px 7px;font-size:10px}
.rank-row{gap:5px;margin-bottom:6px}
.achievement-panel{margin:10px auto 0;padding:10px}
.achievement-panel p{font-size:11px;margin:4px 0}
.progress-wrap{height:8px;margin:5px auto 6px}
.new-achievement{padding:5px 8px;font-size:11px;margin:6px 0 0}
}

/* ===== Responsive: <=420px ===== */
@media(max-width:420px){
#hudMobile{transform:scale(.76);top:6px;left:6px}
#joystick{width:120px;height:120px;bottom:10px}
#stick{left:33px;top:33px;width:54px;height:54px}
.panel{padding:10px 12px}
.panel h1{font-size:18px}
button{font-size:13px;padding:8px 18px;margin-top:10px}
.rank-stat{font-size:9px}
.achievement{padding:4px 3px;font-size:8px}
.rank-badge{padding:4px 8px;font-size:11px}
}

/* ===== Responsive: <=360px ===== */
@media(max-width:360px){
.achievements{grid-template-columns:1fr 1fr;gap:3px}
.achievement-panel{padding:6px}
.achievement .icon{font-size:12px}
.rank-row{flex-wrap:wrap;gap:3px}
}
/* ===== Loading Screen ===== */
#loadingScreen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#07071e}
#loadingScreen .l-bg{position:absolute;inset:0;background:url(TEX/loading_d.png) center/cover no-repeat;opacity:.45;filter:blur(1px)}
#loadingScreen .l-wrap{position:relative;z-index:1;text-align:center}
#loadingScreen .l-title{font-family:var(--font-d);font-size:clamp(16px,5vw,26px);font-weight:900;color:var(--c-text);text-shadow:0 0 20px rgba(0,240,255,.4);margin-bottom:20px;letter-spacing:2px}
#loadingScreen .l-spinner{width:28px;height:28px;border:2px solid rgba(0,240,255,.15);border-top-color:var(--c-cyan);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
#loadingScreen .l-bar-outer{width:min(80vw,360px);height:6px;border-radius:3px;background:rgba(0,240,255,.1);overflow:hidden;margin:0 auto 12px}
#loadingScreen .l-bar-inner{height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--c-cyan),var(--c-purple));transition:width .3s ease}
#loadingScreen .l-pct{font-family:var(--font-d);font-size:13px;color:rgba(0,240,255,.7);letter-spacing:1px}
</style>
</head>

<body>
<canvas id="game"></canvas>
<div id="scanlines"></div>
<div id="damageOverlay"></div>

<div id="hudDesktop">
  <div class="hud-line">积分：<span data-bind="score">0</span></div>
  <div class="hud-line">生命：<span data-bind="hp">50</span></div>
  <div class="hud-line">存活：<span data-bind="time">0.0</span>s</div>
  <div class="hud-line">水晶：<span data-bind="crystal">蓝色 +5</span></div>
  <div class="hud-line">敌人速度等级：<span data-bind="enemyLevel">1</span></div>
  <div class="hud-line">场上敌人：<span data-bind="enemyCount">0</span></div>
  <div class="hud-line">FPS：<span data-bind="fps">0</span></div>
  <div class="hud-line">紫色精英怪：<span data-bind="purpleCount">0</span>/3</div>
  <div class="hud-line">状态果实：<span data-bind="fruitInfo">25秒后加速果实</span></div>
  <div class="hud-line">加速剩余：<span data-bind="speedBuff">0.0</span>s</div>
  <div class="hud-line">无敌剩余：<span data-bind="invincibleBuff">0.0</span>s</div>
</div>

<div id="hudMobile">
  <div class="mobile-hud-panel">
    <div class="mobile-hud-item"><span class="mobile-hud-label">积分</span><span class="mobile-hud-value" data-bind="score">0</span></div>
    <div class="mobile-hud-item"><span class="mobile-hud-label">生命</span><span class="mobile-hud-value" data-bind="hp">50</span></div>
    <div class="mobile-hud-item"><span class="mobile-hud-label">时间</span><span class="mobile-hud-value"><span data-bind="time">0.0</span>s</span></div>
    <div class="mobile-hud-item"><span class="mobile-hud-label">敌人</span><span class="mobile-hud-value" data-bind="enemyCount">0</span></div>
    <div class="mobile-hud-item"><span class="mobile-hud-label">紫怪</span><span class="mobile-hud-value"><span data-bind="purpleCount">0</span>/3</span></div>
    <div class="mobile-hud-item"><span class="mobile-hud-label">FPS</span><span class="mobile-hud-value" data-bind="fps">0</span></div>
    <div class="mobile-hud-item"><span class="mobile-hud-label">加速</span><span class="mobile-hud-value"><span data-bind="speedBuff">0.0</span>s</span></div>
    <div class="mobile-hud-item"><span class="mobile-hud-label">无敌</span><span class="mobile-hud-value"><span data-bind="invincibleBuff">0.0</span>s</span></div>
    <div class="mobile-hud-item mobile-hud-wide"><span class="mobile-hud-label">水晶</span><span class="mobile-hud-value" data-bind="crystal">蓝色 +5</span></div>
    <div class="mobile-hud-item mobile-hud-wide"><span class="mobile-hud-label">果实</span><span class="mobile-hud-value" data-bind="fruitInfo">25秒后加速果实</span></div>
  </div>
</div>

<div id="warning">警告：生命值过低！</div>
<div id="tip"></div>
<div id="joystick"><div id="stick"></div></div>

<div id="startScreen">
  <div class="panel">
    <h1>星空水晶生存战</h1>
    <p>收集晶石、躲避怪物、刷新段位。挑战更高积分，解锁更多成就。</p>
    <div id="startAchievementPanel" class="achievement-panel"></div>
    <button id="startBtn">开始游戏</button>
  </div>
</div>

<div id="gameOverScreen" style="display:none;">
  <div class="panel">
    <h1>游戏结束</h1>
    <p>最终积分：<span id="finalScore">0</span></p>
    <p>存活时间：<span id="finalTime">0.0</span>s</p>
    <div id="gameoverAchievementPanel" class="achievement-panel"></div>
    <button id="restartBtn">重新开始</button>
  </div>
</div>

<div id="loadingScreen">
  <div class="l-bg"></div>
  <div class="l-wrap">
    <div class="l-title">LOADING...</div>
    <div class="l-spinner"></div>
    <div class="l-bar-outer"><div class="l-bar-inner" id="lBar"></div></div>
    <div class="l-pct" id="lPct">0％</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { FBXLoader } from "three/addons/loaders/FBXLoader.js";

let scene,camera,renderer,skyboxMesh=null;
let platformModel=null,platformMeshes=[],platformRaycaster=new THREE.Raycaster();
let platformWalkRadiusX=20,platformWalkRadiusZ=20,platformReady=false;
let decorationRockModel=null,decorationRockReady=false;
let collisionRockTemplate=null,collisionRockReady=false;

let player,playerFallbackBody=null,playerModel=null,playerMixer=null;
let playerActions={},currentPlayerAnim="",playerHitAnimTimer=0,playerIsDead=false;
let playerTintTargets=[],playerLocatorGroup=null;
let playerHeadUISprite=null,playerHeadUICanvas=null,playerHeadUIContext=null,playerHeadUITexture=null;
let playerHeadScoreSprite=null,playerHeadScoreCanvas=null,playerHeadScoreContext=null,playerHeadScoreTexture=null,lastHeadUIScore=-1,lastHeadUIHp=-1;
let playerSideEffects=[],crystalScorePopups=[],playerBaseColorTexture=null,playerNormalTexture=null;

let playerRadius=.65,clock=new THREE.Clock();
let gameRunning=false,gameOverPending=false,score=0,hp=50,aliveTime=0;
let crystals=[],enemies=[],rocks=[],fruits=[],enemySpawnQueue=[],crystalBursts=[];
let platformCloudTexture=null,airParticleTexture=null;
let platformAirPointSystem=null,platformAirParticleData=[];
let keys={},moveInput=new THREE.Vector2(0,0),playerMovingThisFrame=false;

let enemySpawnTimer=0,crystalSpawnTimer=0,fruitSpawnTimer=0,purpleEnemySpawnTimer=0,nextPurpleEnemySpawnTime=20;
let invincibleFruitSpawnTimer=0,nextInvincibleFruitSpawnTime=50,invincibleTimer=0,invincibleVisualActive=false,invincibleHue=0;
let speedBuffTimer=0,damageFlashTimer=0,lowHpWarningTimer=0,knockbackVelocity=new THREE.Vector3(0,0,0);

let audioCtx=null,audioUnlocked=false,bgmTimer=null,bgmStep=0;
let meta=null;
let newlyUnlockedAchievements=[];

let performanceLevel=1;
let frameTimeHistory=[];
const PERFORMANCE_CHECK_INTERVAL=60;
let performanceCheckCounter=0;

let fps=0,fpsFrameCount=0,fpsAccumTime=0;

let _isMobile=false;
let _cachedTier=null;
let _tierCacheScore=-1;
let _tierCacheFrame=0;
let _frameCount=0;
let _prevTierHex=-1;

let _totalLoads=0,_loadedCount=0,_loadPromises=[];
function _trackLoad(promise){_totalLoads++;const p=promise.then(()=>{_loadedCount++;_updateLoadingUI();if(_loadedCount>=_totalLoads)onAllLoaded()}).catch(()=>{_loadedCount++;_updateLoadingUI();if(_loadedCount>=_totalLoads)onAllLoaded()});_loadPromises.push(p);return p}
function _updateLoadingUI(){const pct=Math.floor(_loadedCount/_totalLoads*100);lBar.style.width=pct+"%";lPct.textContent=pct+"％"}
function _autoTrackFBX(url,cb){_trackLoad(new Promise(resolve=>{new FBXLoader().load(url,fbx=>{cb(fbx);resolve()},undefined,()=>resolve())}))}
function onAllLoaded(){
  document.getElementById("loadingScreen").style.display="none";
  startScreen.style.display="flex";

}

function disposeMaterial(material){if(!material)return;if(Array.isArray(material)){material.forEach(disposeMaterial);return}if(material.map)material.map.dispose();material.dispose()}
function disposeSpriteSafe(sprite){if(!sprite||!sprite.material)return;sprite.material.map=null;sprite.material.dispose()}

function getRankInfo(scoreValue){
  let current=RANKS[0],next=null;
  for(let i=0;i<RANKS.length;i++){
    if(scoreValue>=RANKS[i].score)current=RANKS[i];
    else{next=RANKS[i];break}
  }
  return {current,next};
}

function evaluateAchievements(){
  newlyUnlockedAchievements=[];
  for(const a of ACHIEVEMENTS){
    if(!meta.achievements[a.id]&&a.check(meta)){
      meta.achievements[a.id]=true;
      newlyUnlockedAchievements.push(a);
    }
  }
}

function renderAchievementPanel(id,isGameover=false,newList=[]){
  const el=document.getElementById(id);
  if(!el)return;

  const rank=getRankInfo(meta.bestScore);
  const next=rank.next;
  const progress=next?THREE.MathUtils.clamp((meta.bestScore-rank.current.score)/(next.score-rank.current.score),0,1):1;
  const unlockedCount=ACHIEVEMENTS.filter(a=>meta.achievements[a.id]).length;

  const achHtml=ACHIEVEMENTS.map(a=>{
    const on=!!meta.achievements[a.id];
    return `<div class="achievement ${on?"unlocked":""}">
      <span class="icon">${on?a.icon:"🔒"}</span>
      <b>${a.name}</b><br/><span>${a.desc}</span>
    </div>`;
  }).join("");

  const newHtml=newList.length?`<div class="new-achievement">🎉 新成就解锁：${newList.map(a=>a.icon+" "+a.name).join("、")}</div>`:"";

  el.innerHTML=`
    <div class="rank-row">
      <span class="rank-badge">${rank.current.icon} ${rank.current.name}</span>
      <span class="rank-stat">最高分 ${meta.bestScore}</span>
      <span class="rank-stat">最长存活 ${meta.bestTime.toFixed(1)}s</span>
      <span class="rank-stat">游玩 ${meta.gamesPlayed} 局</span>
    </div>
    <div class="progress-wrap"><div class="progress-bar" style="width:${progress*100}%"></div></div>
    <p style="margin:6px 0;color:#dff7ff">${next?`距离下一段位「${next.icon} ${next.name}」还差 ${Math.max(0,next.score-meta.bestScore)} 分`:"已达到最高段位，挑战更高纪录！"}</p>
    <p style="margin:6px 0;color:#fff3b0">成就 ${unlockedCount}/${ACHIEVEMENTS.length}。每局都有机会刷新段位、解锁新徽章。</p>
    ${newHtml}
    <div class="achievements">${achHtml}</div>
  `;
}

function loadTexture(url,options={}){
  let texture;
  if(_isMobile&&options.resizeHalf!==false){
    texture=new THREE.Texture();
    _trackLoad(new Promise(resolve=>{
      const img=new Image();
      img.crossOrigin="anonymous";
      img.onload=()=>{
        const w=img.naturalWidth,mw=Math.floor(w/2);
        const h=img.naturalHeight,mh=Math.floor(h/2);
        const c=document.createElement("canvas");
        c.width=mw;c.height=mh;
        const ctx=c.getContext("2d");
        ctx.drawImage(img,0,0,mw,mh);
        texture.image=c;
        texture.needsUpdate=true;
        texture.colorSpace=options.colorSpace||THREE.SRGBColorSpace;
        texture.wrapS=options.wrapS||THREE.RepeatWrapping;
        texture.wrapT=options.wrapT||THREE.RepeatWrapping;
        texture.repeat.set(options.repeatX??1,options.repeatY??1);
        texture.flipY=options.flipY??false;
        texture.anisotropy=options.anisotropy??4;
        resolve();
      };
      img.onerror=()=>{const t=new THREE.TextureLoader().load(url,()=>{},undefined,()=>{});texture=t;resolve()};
      img.src=url;
    }));
  }else{
    texture=new THREE.TextureLoader().load(url,()=>{},undefined,err=>console.warn("贴图加载失败：",url,err));
    texture.colorSpace=options.colorSpace||THREE.SRGBColorSpace;
    texture.wrapS=options.wrapS||THREE.RepeatWrapping;
    texture.wrapT=options.wrapT||THREE.RepeatWrapping;
    texture.repeat.set(options.repeatX??1,options.repeatY??1);
    texture.flipY=options.flipY??false;
    texture.anisotropy=options.anisotropy??4;
  }
  return texture;
}

function createPlatformMaterials(){
  const topTexture=loadTexture(PLATFORM_TOP_TEXTURE_URL,{colorSpace:THREE.SRGBColorSpace,repeatX:PLATFORM_TOP_TEXTURE_REPEAT_X,repeatY:PLATFORM_TOP_TEXTURE_REPEAT_Y,flipY:false,anisotropy:8});
  const sideTexture=loadTexture(PLATFORM_SIDE_TEXTURE_URL,{colorSpace:THREE.SRGBColorSpace,repeatX:PLATFORM_SIDE_TEXTURE_REPEAT_X,repeatY:PLATFORM_SIDE_TEXTURE_REPEAT_Y,flipY:false,anisotropy:8});
  const normalTexture=loadTexture(PLATFORM_NORMAL_TEXTURE_URL,{resizeHalf:false,colorSpace:THREE.NoColorSpace,repeatX:1,repeatY:1,flipY:false,anisotropy:8});
  return [
    new THREE.MeshStandardMaterial({map:topTexture,normalMap:normalTexture,normalScale:new THREE.Vector2(.35,.35),color:0xffffff,roughness:.88,metalness:.02}),
    new THREE.MeshStandardMaterial({map:sideTexture,normalMap:normalTexture,normalScale:new THREE.Vector2(.45,.45),color:0xffffff,roughness:.92,metalness:.01}),
    new THREE.MeshStandardMaterial({map:sideTexture,normalMap:normalTexture,normalScale:new THREE.Vector2(.45,.45),color:0xffffff,roughness:.96,metalness:0})

}

function createPlatformModel(){
  _autoTrackFBX(PLATFORM_MODEL_URL,fbx=>{
    platformModel=fbx;
    platformMeshes=[];
    scene.add(platformModel);
    fitPlatformToWorld(platformModel);
    const platformMaterials=createPlatformMaterials();
    platformModel.traverse(obj=>{
      if(obj.isMesh||obj.isSkinnedMesh){
        obj.castShadow=false;
        obj.receiveShadow=true;
        if(obj.geometry){obj.geometry.computeBoundingBox();obj.geometry.computeVertexNormals()}
        applyTopSideBottomMaterialsWorld(obj,platformMaterials);
        platformMeshes.push(obj);
      }
    });
    updatePlatformWalkBounds();
    platformReady=true;
    fitDecorationRockToPlatform();
  });
}

function fitPlatformToWorld(object3D){
  object3D.updateMatrixWorld(true);
  let box=new THREE.Box3().setFromObject(object3D);
  const size=new THREE.Vector3(),center=new THREE.Vector3();
  box.getSize(size);box.getCenter(center);
  const maxXZ=Math.max(size.x,size.z);
  if(maxXZ>.001)object3D.scale.multiplyScalar(worldSize/maxXZ*PLATFORM_EXTRA_SCALE);
  object3D.updateMatrixWorld(true);
  box=new THREE.Box3().setFromObject(object3D);box.getCenter(center);
  object3D.position.x-=center.x;object3D.position.z-=center.z;
  object3D.updateMatrixWorld(true);
  box=new THREE.Box3().setFromObject(object3D);
  object3D.position.y+=PLATFORM_TOP_Y-box.max.y;
  object3D.updateMatrixWorld(true);
}

function applyTopSideBottomMaterialsWorld(mesh,materials){
  const geometry=mesh.geometry;
  if(!geometry||!geometry.attributes||!geometry.attributes.position){mesh.material=materials[1];return}
  if(!geometry.attributes.normal)geometry.computeVertexNormals();
  geometry.clearGroups();
  const posAttr=geometry.attributes.position,index=geometry.index,triCount=index?index.count/3:posAttr.count/3;
  mesh.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(mesh),height=Math.max(.001,box.max.y-box.min.y),topY=box.max.y;
  const a=new THREE.Vector3(),b=new THREE.Vector3(),c=new THREE.Vector3(),ab=new THREE.Vector3(),ac=new THREE.Vector3(),normal=new THREE.Vector3(),center=new THREE.Vector3();
  for(let i=0;i<triCount;i++){
    let ia,ib,ic;
    if(index){ia=index.getX(i*3);ib=index.getX(i*3+1);ic=index.getX(i*3+2)}
    else{ia=i*3;ib=i*3+1;ic=i*3+2}
    a.fromBufferAttribute(posAttr,ia).applyMatrix4(mesh.matrixWorld);
    b.fromBufferAttribute(posAttr,ib).applyMatrix4(mesh.matrixWorld);
    c.fromBufferAttribute(posAttr,ic).applyMatrix4(mesh.matrixWorld);

function drawRoundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

function updatePlayerHeadUI(force=false){

    ctx.lineWidth=2;ctx.strokeStyle="rgba(0,240,255,.2)";

    if(hpRatio>.55){grad.addColorStop(0,"#39ff14");grad.addColorStop(1,"#00c853")}
    else if(hpRatio>.25){grad.addColorStop(0,"#ffd700");grad.addColorStop(1,"#ff8c00")}

    ctx.restore();
    playerHeadUITexture.needsUpdate=true;
    lastHeadUIHp=safeHp;

  }
}

function spawnCrystalBurst(){
  const t=getTier();
  ensurePlatformCloudTexture();
  const pos=_v3a.copy(player.position);pos.y+=.5;
  const count=isMobileLayout()?4:8;
  const particles=[];
  for(let i=0;i<count;i++){
    const size=.25+Math.random()*.35;
    const sprite=createCloudParticleMesh(size,platformCloudTexture);
    sprite.material.color.set(t.crystalColor);
    const angle=Math.random()*Math.PI*2;
    const upAngle=Math.random()*Math.PI*.45;
    const speed=.3+Math.random()*.6;
    sprite.position.copy(pos);
    sprite.position.x+=Math.cos(angle)*Math.sin(upAngle)*.4;
    sprite.position.z+=Math.sin(angle)*Math.sin(upAngle)*.4;
    sprite.position.y+=Math.cos(upAngle)*.4+.2;
    sprite.material.opacity=.65+Math.random()*.35;
    scene.add(sprite);
    particles.push({
      sprite,
      vel:new THREE.Vector3(Math.cos(angle)*speed,.2+Math.random()*.55,Math.sin(angle)*speed),
      baseY:sprite.position.y,
      phase:Math.random()*Math.PI*2,
      life:.6+Math.random()*.3,
      maxLife:.6+Math.random()*.3
    });
  }
  if(!isMobileLayout()){
    const ringCloud=createCloudParticleMesh(1.0,platformCloudTexture);
    ringCloud.material.color.set(t.crystalColor);
    ringCloud.position.copy(pos);
    scene.add(ringCloud);
    crystalBursts.push({ringCloud,ringLife:.7,ringMaxLife:.7,particles});
  } else {
    crystalBursts.push({ringCloud:null,ringLife:0,ringMaxLife:0,particles});
  }
}

function updateCrystalBursts(dt){
  for(let i=crystalBursts.length-1;i>=0;i--){
    const burst=crystalBursts[i];
    burst.ringLife-=dt;
    const ringT=1-burst.ringLife/burst.ringMaxLife;
    if(burst.ringCloud){
      burst.ringCloud.scale.setScalar((isMobileLayout()?.8:1.25)*(1+ringT*4.5));
      if(burst.ringCloud.material)burst.ringCloud.material.opacity=.85*(1-ringT);
      if(burst.ringLife<=0){scene.remove(burst.ringCloud);disposeSpriteSafe(burst.ringCloud);burst.ringCloud=null}
    }
    for(let j=burst.particles.length-1;j>=0;j--){
      const p=burst.particles[j];
      p.life-=dt;
      p.sprite.position.addScaledVector(p.vel,dt);
      p.vel.y-=.35*dt;
      p.sprite.position.y=p.baseY+Math.sin(aliveTime*3.5+p.phase)*.15;
      const fade=THREE.MathUtils.clamp(p.life/p.maxLife,0,1);
      if(p.sprite.material)p.sprite.material.opacity=fade*.65;
      p.sprite.scale.setScalar(p.sprite.scale.x*(1+dt*.35));
      if(p.life<=0){
        scene.remove(p.sprite);disposeSpriteSafe(p.sprite);
        burst.particles.splice(j,1);
      }
    }
    if(burst.ringLife<=0&&burst.particles.length===0)crystalBursts.splice(i,1);
  }
}

function clearCrystalBursts(){
  for(const burst of crystalBursts){
    if(burst.ringCloud){scene.remove(burst.ringCloud);disposeSpriteSafe(burst.ringCloud)}
    for(const p of burst.particles){scene.remove(p.sprite);disposeSpriteSafe(p.sprite)}
  }
  crystalBursts.length=0;
}

function updatePlatformAirParticles(dt){

  for(let i=platformAirParticleData.length-1;i>=0;i--){

    p.driftAngle+=p.driftSpeed*dt;
    let x=p.baseX+Math.cos(p.driftAngle)*p.driftAmp;
    let z=p.baseZ+Math.sin(p.driftAngle)*p.driftAmp;
    const rise=((aliveTime*p.riseSpeed+p.riseOffset)%1.4)-.7;
    let y=p.baseY+rise+Math.sin(aliveTime*p.wobbleSpeed+p.wobbleOffset)*p.wobbleAmp;
    if(y>PLATFORM_TOP_Y+1.2)y=PLATFORM_TOP_Y-.7;
    if(y<PLATFORM_TOP_Y-1.2)y=PLATFORM_TOP_Y+.7;
    const distFromCenter=Math.sqrt(x*x+z*z);
    const maxR=Math.max(platformWalkRadiusX,platformWalkRadiusZ)*1.25;
    if(distFromCenter>maxR){
      const ang=Math.atan2(z,x);
      p.baseX=Math.cos(ang)*maxR*.85;
      p.baseZ=Math.sin(ang)*maxR*.85;
      x=p.baseX;z=p.baseZ;
    }
    positions[i*3]=x;
    positions[i*3+1]=y;
    positions[i*3+2]=z;
  }
  platformAirPointSystem.geometry.attributes.position.needsUpdate=true;
}

function registerPlayerTintTarget(mesh){
  const mats=Array.isArray(mesh.material)?mesh.material:[mesh.material];
  for(const mat of mats){
    if(!mat)continue;
    if(mat.color)playerTintTargets.push({mat,color:mat.color.clone(),emissive:mat.emissive?mat.emissive.clone():null});
  }
}

function setPlayerTintDamaged(enabled){
  if(invincibleTimer>0&&enabled)return;
  for(const target of playerTintTargets){
    if(enabled){
      if(target.mat.color)target.mat.color.setHex(playerDamageColor);
      if(target.mat.emissive)target.mat.emissive.setHex(0x330000);
    }else{
      if(target.mat.color)target.mat.color.copy(target.color);
      if(target.mat.emissive&&target.emissive)target.mat.emissive.copy(target.emissive);
    }
  }
}

function sanitizeFBXNodeName(name){return name?name.replace(/[\s.:\/\\]/g,""):name}
function normalizeBoneNameForMatch(name){
  if(!name)return "";
  let result=name;
  if(result.includes("|"))result=result.split("|").pop();
  return result.replace(/[\s.:\/\\]/g,"").toLowerCase();
}
function buildModelNodeMap(root){
  const map=new Map();
  root.traverse(obj=>{
    if(!obj.name)return;
    map.set(obj.name,obj.name);
    map.set(normalizeBoneNameForMatch(obj.name),obj.name);
  });
  return map;
}
function retargetClipToModel(rawClip,modelRoot,clipName){
  const nodeMap=buildModelNodeMap(modelRoot),newTracks=[];
  for(const track of rawClip.tracks){
    const dotIndex=track.name.indexOf(".");
    if(dotIndex===-1){newTracks.push(track.clone());continue}
    const trackNodeName=track.name.substring(0,dotIndex),propertyName=track.name.substring(dotIndex),normalizedTrackName=normalizeBoneNameForMatch(trackNodeName);
    const matchedName=nodeMap.get(trackNodeName)||nodeMap.get(normalizedTrackName);
    if(matchedName){const newTrack=track.clone();newTrack.name=matchedName+propertyName;newTracks.push(newTrack)}
  }
  const newClip=rawClip.clone();
  newClip.name=clipName;
  newClip.tracks=newTracks;
  return newClip;
}

function loadPlayerFBX(resolve){
  new FBXLoader().load(
    PLAYER_MODEL_URL,
    fbx=>{
      playerModel=fbx;
      playerModel.scale.setScalar(PLAYER_MODEL_SCALE);
      playerModel.rotation.set(PLAYER_MODEL_X_ROTATION,PLAYER_MODEL_Y_ROTATION,PLAYER_MODEL_Z_ROTATION);
      playerModel.position.set(0,0,0);
      playerTintTargets=[];
      playerModel.traverse(obj=>{
        if(obj.name)obj.name=sanitizeFBXNodeName(obj.name);
        if(obj.isMesh||obj.isSkinnedMesh){
          obj.castShadow=true;
          obj.receiveShadow=true;
          obj.material=createPlayerMaterial();
          registerPlayerTintTarget(obj);
        }
      });
      if(playerFallbackBody)playerFallbackBody.visible=false;
      player.add(playerModel);
      playerMixer=new THREE.AnimationMixer(playerModel);
      loadPlayerAnimation("idle",PLAYER_IDLE_ANIM_URL,true);
      loadPlayerAnimation("run",PLAYER_RUN_ANIM_URL,true);
      loadPlayerAnimation("attacked",PLAYER_ATTACKED_ANIM_URL,false);
      resolve();
    },
    undefined,
    err=>{console.warn("玩家模型加载失败：",PLAYER_MODEL_URL,err);resolve();}
  );
}

function loadPlayerAnimation(name,url,loop){
  new FBXLoader().load(
    url,
    animFbx=>{
      if(!playerMixer||!playerModel)return;
      if(!animFbx.animations||animFbx.animations.length===0)return;
      const clip=retargetClipToModel(animFbx.animations[0],playerModel,name);
      if(!clip.tracks||clip.tracks.length===0)return;
      const action=playerMixer.clipAction(clip,playerModel);
      action.enabled=true;action.paused=false;action.setEffectiveWeight(1);action.setEffectiveTimeScale(1);
      if(loop){action.setLoop(THREE.LoopRepeat,Infinity);action.clampWhenFinished=false}
      else{action.setLoop(THREE.LoopOnce,1);action.clampWhenFinished=true}
      playerActions[name]=action;
      if(name==="idle"&&!gameRunning&&!playerIsDead)setTimeout(()=>playPlayerAnim("idle",.15,true),100);
    },
    undefined,
    err=>console.warn("玩家动画加载失败：",url,err)
  );
}

function stopAllPlayerActions(exceptName=""){
  for(const key in playerActions){
    const action=playerActions[key];
    if(!action)continue;
    if(key!==exceptName)action.fadeOut(.12);
  }
}
function playPlayerAnim(name,fade=.12,restart=false){
  const action=playerActions[name];
  if(!action)return;
  if(currentPlayerAnim===name&&!restart)return;
  stopAllPlayerActions(name);
  if(restart)action.reset();
  action.enabled=true;action.paused=false;action.setEffectiveWeight(1);action.setEffectiveTimeScale(1);action.fadeIn(fade);action.play();
  currentPlayerAnim=name;
}
function forcePlayPlayerAnim(name,fade=.05){
  const action=playerActions[name];
  if(!action)return;
  stopAllPlayerActions(name);
  action.reset();action.enabled=true;action.paused=false;action.setEffectiveWeight(1);action.setEffectiveTimeScale(1);action.fadeIn(fade);action.play();
  currentPlayerAnim=name;
}
function updatePlayerAnimation(dt){
  if(playerMixer)playerMixer.update(dt);
  if(playerIsDead)return;
  if(playerHitAnimTimer>0){
    playerHitAnimTimer-=dt;
    if(playerHitAnimTimer<=0){
      if(playerMovingThisFrame)playPlayerAnim("run",.12,false);
      else playPlayerAnim("idle",.12,false);

  }

  else playPlayerAnim("idle",.18,false);
}
function clearPlayerActions(){
  for(const key in playerActions){
    const action=playerActions[key];
    if(action){action.stop();action.reset();action.enabled=true;action.paused=false;action.setEffectiveWeight(1);action.setEffectiveTimeScale(1)}
  }
  currentPlayerAnim="";
}

function createRocks(){
  rocks.forEach(r=>scene.remove(r.mesh));
  rocks=[];
  if(!collisionRockReady){return}
  const rockCount=isMobileLayout()?5:8;
  for(let i=0;i<rockCount;i++){
    let pos=randomPosition();
    if(dist2DSq(pos.x,pos.z,player.position.x,player.position.z)<25){i--;continue}
    const radius=1.1+Math.random()*1.2;
    const group=cloneCollisionRock();
    group.position.set(pos.x,PLATFORM_TOP_Y-radius*.15,pos.z);
    group.rotation.set(0,Math.random()*Math.PI*2,0);
    group.scale.setScalar(radius*.85/3);
    const bb=new THREE.Box3().setFromObject(group);
    const sz=new THREE.Vector3();bb.getSize(sz);
    const modelRadius=Math.max(sz.x,sz.y,sz.z)*.45;
    group.traverse(obj=>{if(obj.isMesh||obj.isSkinnedMesh){obj.castShadow=!isMobileLayout();obj.receiveShadow=true}});
    scene.add(group);
    rocks.push({mesh:group,radius:modelRadius});
  }
}

function getTier(){
  if(_cachedTier&&_tierCacheScore===score&&_frameCount===_tierCacheFrame)return _cachedTier;
  let t;
  if(score>=520)t={crystalColor:0xffffff,crystalName:"星白色",crystalValue:80,enemyLevel:7,enemySpeed:7.0,enemyDamage:20};
  else if(score>=320)t={crystalColor:0xfff1a8,crystalName:"金色",crystalValue:50,enemyLevel:6,enemySpeed:6.4,enemyDamage:15};
  else if(score>=200)t={crystalColor:0xff8c00,crystalName:"橙色",crystalValue:30,enemyLevel:5,enemySpeed:5.8,enemyDamage:12};
  else if(score>=120)t={crystalColor:0x001f8f,crystalName:"深蓝色",crystalValue:20,enemyLevel:4,enemySpeed:5.2,enemyDamage:10};
  else if(score>=70)t={crystalColor:0xff3030,crystalName:"红色",crystalValue:10,enemyLevel:3,enemySpeed:4.5,enemyDamage:5};
  else if(score>=35)t={crystalColor:0xb14cff,crystalName:"紫色",crystalValue:8,enemyLevel:2,enemySpeed:3.8,enemyDamage:5};
  else if(score>=15)t={crystalColor:0x2ecc71,crystalName:"绿色",crystalValue:6,enemyLevel:1,enemySpeed:3.3,enemyDamage:5};
  else t={crystalColor:0x48a8ff,crystalName:"蓝色",crystalValue:5,enemyLevel:1,enemySpeed:3.0,enemyDamage:5};
  _cachedTier=t;_tierCacheScore=score;_tierCacheFrame=_frameCount;

function getEnemyDifficultyProgress(){return THREE.MathUtils.clamp(aliveTime/ENEMY_MAX_DIFFICULTY_TIME,0,1)}
function getMaxEnemies(){

  return Math.min(maxEnemies,Math.floor(THREE.MathUtils.lerp(initialCount,maxEnemies,p)));

function getEnemyGroupSize(){

  if(p>=.75)return randomInt(isMobileLayout()?2:3,isMobileLayout()?3:5);
  if(p>=.5)return randomInt(isMobileLayout()?2:3,isMobileLayout()?2:4);

function spawnCrystal(){

  const mesh=new THREE.Mesh(shared.geo.crystal,mat);

  scene.add(mesh);

function spawnEnemyGroup(count){
  const canSpawn=Math.max(0,getMaxEnemies()-enemies.length-enemySpawnQueue.length);
  const real=Math.min(count,canSpawn);
  if(real<=0)return;
  const base=randomEdgePosition();
  for(let i=0;i<real;i++){
    const pos=base.clone().add(new THREE.Vector3((Math.random()-.5)*4.5,0,(Math.random()-.5)*4.5));
    clampToWorld(pos);
    enemySpawnQueue.push(pos);
  }
}

function processEnemySpawnQueue(){
  const perFrame=isMobileLayout()?1:2;
  for(let i=0;i<perFrame&&enemySpawnQueue.length>0;i++){
    if(enemies.length>=getMaxEnemies()){enemySpawnQueue.length=0;return}
    spawnEnemyAt(enemySpawnQueue.shift());
  }
}

  group.position.set(pos.x,getPlatformHeightAt(pos.x,pos.z),pos.z);
  scene.add(group);
  fruits.push({mesh:group,radius:.82,type:"invincible",life:INVINCIBLE_FRUIT_LIFE});
}
function activateInvincible(){invincibleTimer=INVINCIBLE_DURATION;invincibleVisualActive=true;spawnPlayerSideEffect("invincible");playSfx("invincible")}

function updateInvincibleState(dt){
  if(invincibleTimer>0){invincibleTimer-=dt;if(invincibleTimer<0)invincibleTimer=0}
  if(invincibleTimer>0){
    invincibleHue=(invincibleHue+dt*.75)%1;
    const color=new THREE.Color().setHSL(invincibleHue,.95,.62);
    const emissive=new THREE.Color().setHSL((invincibleHue+.35)%1,.95,.45);
    const pulse=.45+Math.sin(aliveTime*18)*.25;
    for(const target of playerTintTargets){
      if(target.mat.color)target.mat.color.copy(color);
      if(target.mat.emissive){target.mat.emissive.copy(emissive);target.mat.emissiveIntensity=.35+pulse}
    }
  }else if(invincibleVisualActive){invincibleVisualActive=false;restorePlayerTint()}
}

function restorePlayerTint(){
  for(const target of playerTintTargets){
    if(target.mat.color)target.mat.color.copy(target.color);
    if(target.mat.emissive&&target.emissive){target.mat.emissive.copy(target.emissive);target.mat.emissiveIntensity=0}
  }
}

function updateFog(){
  if(!scene.fog)return;
  const h=Math.max(camera.position.y,.2);
  const heightFactor=Math.exp(-h*.04);
  scene.fog.density=(isMobileLayout()? .0006:.001)*(.45+.55*heightFactor);
}

function animate(){
  requestAnimationFrame(animate);
  _frameCount++;
  const dt=Math.min(clock.getDelta(),.033);
  fpsFrameCount++;
  fpsAccumTime+=dt;
  if(fpsAccumTime>=.5){
    fps=Math.round(fpsFrameCount/fpsAccumTime);
    fpsFrameCount=0;
    fpsAccumTime=0;
  }
  if(skyboxMesh&&camera)skyboxMesh.position.copy(camera.position);
  updateFog();
  processEnemySpawnQueue();
  if(renderer.shadowMap.enabled&&(gameRunning||player))renderer.shadowMap.needsUpdate=true;
  updatePerformance(dt);
  if(gameRunning)update(dt);
  else if(playerMixer)playerMixer.update(dt);
  renderer.render(scene,camera);
}

function updatePerformance(dt){
  frameTimeHistory.push(dt);
  performanceCheckCounter++;
  if(performanceCheckCounter>=PERFORMANCE_CHECK_INTERVAL){
    performanceCheckCounter=0;
    const avgFrameTime=frameTimeHistory.reduce((a,b)=>a+b,0)/frameTimeHistory.length;
    frameTimeHistory=[];
    if(avgFrameTime>.033&&performanceLevel<3){
      performanceLevel++;
      applyPerformanceLevel();
    } else if(avgFrameTime<.022&&performanceLevel>1){
      performanceLevel--;
      applyPerformanceLevel();
    }
  }
}

function applyPerformanceLevel(){
  if(performanceLevel===1){
    if(_isMobile)renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.25));
    if(_isMobile)renderer.shadowMap.enabled=false;
  } else if(performanceLevel===2){
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.0));
    renderer.shadowMap.enabled=false;
  } else {
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,0.75));
    renderer.shadowMap.enabled=false;
  }
}

function update(dt){
  aliveTime+=dt;
  if(speedBuffTimer>0)speedBuffTimer-=dt;
  if(lowHpWarningTimer>0){lowHpWarningTimer-=dt;warning.style.display="block"}else warning.style.display="none";
  updateInvincibleState(dt);
  updatePlayer(dt);
  updatePlayerHeadUI();
  updatePlayerLocatorHalo(dt);
  updatePlayerSideEffects(dt);
  updateCrystalScorePopups(dt);
  updateCrystalBursts(dt);
  updatePlatformAirParticles(dt);
  updateDamageFeedback(dt);
  updatePlayerAnimation(dt);
  updateCamera(dt);
  updateCrystals(dt);
  updateEnemies(dt);
  updateFruits(dt);
  updateSpawns(dt);
  updateHUD();
  if(hp<=0&&!gameOverPending)endGame();
}

function updatePlayer(dt){
  playerMovingThisFrame=false;
  if(playerIsDead)return;
  _v2a.set(0,0);
  if(keys["KeyW"]||keys["ArrowUp"])_v2a.y-=1;
  if(keys["KeyS"]||keys["ArrowDown"])_v2a.y+=1;
  if(keys["KeyA"]||keys["ArrowLeft"])_v2a.x-=1;
  if(keys["KeyD"]||keys["ArrowRight"])_v2a.x+=1;
  _v2a.x+=moveInput.x;_v2a.y+=moveInput.y;
  if(_v2a.length()>1)_v2a.normalize();
  const speed=basePlayerSpeed*(speedBuffTimer>0?1.65:1)*(invincibleTimer>0?INVINCIBLE_SPEED_MULTIPLIER:1);
  _v3a.set(_v2a.x,0,_v2a.y).multiplyScalar(speed*dt);
  if(_v3a.lengthSq()>0){
    playerMovingThisFrame=true;
    _v3b.copy(player.position);
    player.position.add(_v3a);
    clampToWorld(player.position);
    if(collidesWithRocks(player.position,playerRadius)){player.position.copy(_v3b);clampToWorld(player.position)}
    snapObjectToPlatform(player,0);
    player.rotation.y=Math.atan2(_v3a.x,_v3a.z);
  }else snapObjectToPlatform(player,0);
  if(knockbackVelocity.lengthSq()>.01){
    _v3b.copy(player.position);
    player.position.addScaledVector(knockbackVelocity,dt);
    clampToWorld(player.position);
    if(collidesWithRocks(player.position,playerRadius)){player.position.copy(_v3b);clampToWorld(player.position);knockbackVelocity.multiplyScalar(.25)}
    snapObjectToPlatform(player,0);
    knockbackVelocity.multiplyScalar(Math.pow(.04,dt));
  }else knockbackVelocity.set(0,0,0);
}

function updateDamageFeedback(dt){
  if(invincibleTimer>0){damageFlashTimer=0;setPlayerTintDamaged(false);damageOverlay.style.opacity=0;return}
  if(damageFlashTimer>0){damageFlashTimer-=dt;setPlayerTintDamaged(true);damageOverlay.style.opacity=1}
  else{setPlayerTintDamaged(false);damageOverlay.style.opacity=0}
}

function updateCamera(dt){
  const camYOff=isMobileLayout()?21:17;
  const camZOff=isMobileLayout()?22:18;
  _v3c.set(player.position.x,player.position.y+camYOff,player.position.z+camZOff);
  camera.position.lerp(_v3c,1-Math.pow(.001,dt));
  camera.lookAt(player.position.x,player.position.y,player.position.z);
}

function updateCrystals(dt){
  const t=getTier();
  const tierChanged=_prevTierHex!==t.crystalColor;
  if(tierChanged){
    _prevTierHex=t.crystalColor;
    for(const c of crystals){
      c.value=t.crystalValue;
      c.mat.color.setHex(t.crystalColor);
      c.mat.emissive.setHex(t.crystalColor);
    }
  }
  for(let i=crystals.length-1;i>=0;i--){
    const c=crystals[i];
    c.mesh.rotation.y+=dt*2.2;c.mesh.rotation.x+=dt*.8;
    c.mesh.position.y=PLATFORM_TOP_Y+.85+Math.sin(aliveTime*3+i)*.12;
    if(dist2DSq(player.position.x,player.position.z,c.mesh.position.x,c.mesh.position.z)<(playerRadius+c.radius)*(playerRadius+c.radius)){
      const addValue=c.value;
      score+=addValue;
      spawnCrystalScorePopup(addValue);
      playSfx("crystal");
      scene.remove(c.mesh);
      c.mat.dispose();
      crystals.splice(i,1);
      if(crystals.length<maxCrystals){
        setTimeout(()=>{if(gameRunning&&crystals.length<maxCrystals)spawnCrystal()},500);
      }
    }
  }
}

function updateEnemies(dt){
  const now=performance.now();
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(!e.active&&now-e.spawnTime>=300)e.active=true;
    if(!e.active){const s=1+Math.sin(now*.03)*.08;e.mesh.scale.setScalar(s);continue}
    const epx=e.mesh.position.x,epz=e.mesh.position.z;
    if(e.type==="purple"){
      const dSq=dist2DSq(player.position.x,player.position.z,e.mesh.position.x,e.mesh.position.z),detect=e.detectRange;
      if(dSq<=detect*detect)e.mode="chase";
      else if(dSq>detect*detect*1.35*1.35)e.mode="wander";
      e.mesh.scale.setScalar(1+Math.sin(aliveTime*6+i)*.035);
      for(const child of e.mesh.children){
        if(child.geometry&&child.geometry.type==="TorusGeometry")child.rotation.z+=dt*3.5;
      }
    }
    let dir=e.type==="purple"&&e.mode==="wander"?getPurpleWanderDirection(e,dt):getEnemySteeringDirection(e);
    if(dir.lengthSq()>.001){
      _v3a.copy(e.mesh.position);
      e.mesh.position.addScaledVector(dir,e.speed*dt);
      clampToWorld(e.mesh.position);
      snapObjectToPlatform(e.mesh,0);
      if(collidesWithRocks(e.mesh.position,e.radius)){
        e.mesh.position.copy(_v3a);
        snapObjectToPlatform(e.mesh,0);
        const escapeDir=getEnemyEscapeDirection(e);
        if(escapeDir.lengthSq()>.001){
          escapeDir.lerp(_v3h.set(Math.random()-.5,0,Math.random()-.5).normalize(),.13).normalize();
          e.mesh.position.addScaledVector(escapeDir,e.speed*dt*1.35);
          clampToWorld(e.mesh.position);
          snapObjectToPlatform(e.mesh,0);
          if(collidesWithRocks(e.mesh.position,e.radius)){
            e.mesh.position.copy(_v3a);
            const tangentDir=getEnemyTangentEscape(e);
            e.mesh.position.addScaledVector(tangentDir,e.speed*dt*1.8);
            clampToWorld(e.mesh.position);
            snapObjectToPlatform(e.mesh,0);
            if(collidesWithRocks(e.mesh.position,e.radius)){e.mesh.position.copy(_v3a);snapObjectToPlatform(e.mesh,0)}
          }
        }
        if(e.type==="purple"&&e.mode==="wander")resetPurpleWander(e);
      }
      e.mesh.rotation.y=Math.atan2(dir.x,dir.z);
    }else snapObjectToPlatform(e.mesh,0);
    updateEnemyStuckState(e,dt,epx,epz);
    if(e.stuckTimer>=ENEMY_STUCK_DESTROY_TIME){
      scene.remove(e.mesh);
      enemies.splice(i,1);
      continue;
    }
    if(dist2DSq(player.position.x,player.position.z,e.mesh.position.x,e.mesh.position.z)<(playerRadius+e.radius)*(playerRadius+e.radius)){
      if(e.type==="purple"&&e.mode!=="chase")continue;
      applyPlayerDamage(e.damage,e.mesh.position);
      scene.remove(e.mesh);
      enemies.splice(i,1);
    }
  }
}

function updateEnemyStuckState(enemy,dt,startX,startZ){
  const frameMoveSq=dist2DSq(enemy.mesh.position.x,enemy.mesh.position.z,startX,startZ);
  if(frameMoveSq>ENEMY_STUCK_MOVE_EPSILON*ENEMY_STUCK_MOVE_EPSILON){
    enemy.stuckTimer=0;enemy.lastCheckPos.copy(enemy.mesh.position);return;
  }
  const totalMoveSq=dist2DSq(enemy.mesh.position.x,enemy.mesh.position.z,enemy.lastCheckPos.x,enemy.lastCheckPos.z);
  if(totalMoveSq>ENEMY_STUCK_MOVE_EPSILON*ENEMY_STUCK_MOVE_EPSILON*4){
    enemy.stuckTimer=0;enemy.lastCheckPos.copy(enemy.mesh.position);
  }else enemy.stuckTimer+=dt;
}

function getEnemyEscapeDirection(enemy){
  const pos=enemy.mesh.position,away=_v3b.set(0,0,0);
  for(const rock of rocks){
    const d=distance2D(pos,rock.mesh.position),danger=rock.radius+enemy.radius+0.6;
    if(d<danger){
      _v3c.subVectors(pos,rock.mesh.position);
      _v3c.y=0;
      if(_v3c.lengthSq()>.001){_v3c.normalize();away.addScaledVector(_v3c,(danger-d)/danger+0.35)}
    }
  }
  for(const other of enemies){
    if(other===enemy)continue;
    const d=distance2D(pos,other.mesh.position);
    const sepDist=enemy.radius+other.radius+0.5;
    if(d<sepDist&&d>.001){
      _v3c.subVectors(pos,other.mesh.position);
      _v3c.y=0;
      _v3c.normalize();
      away.addScaledVector(_v3c,(sepDist-d)/sepDist+0.15);
    }
  }
  if(away.lengthSq()<.001)away.set(Math.random()-.5,0,Math.random()-.5);
  away.normalize();
  return away;
}

function getEnemySteeringDirection(enemy){
  const pos=enemy.mesh.position,toPlayer=_v3b.subVectors(player.position,pos);
  toPlayer.y=0;
  if(toPlayer.lengthSq()<.001)return toPlayer.set(0,0,0);
  toPlayer.normalize();
  const agility=enemy.agility||1;
  const speedRatio=(enemy.speed||3.0)/3.0;
  const lookAhead=2.5*agility*speedRatio;
  const avoidance=_v3c.set(0,0,0),future=_v3d.copy(pos).addScaledVector(toPlayer,lookAhead);
  for(const rock of rocks){
    const distNow=distance2D(pos,rock.mesh.position),distFuture=distance2D(future,rock.mesh.position),danger=rock.radius+enemy.radius+0.6*agility;
    if(distNow<danger||distFuture<danger){
      const away=_v3e.subVectors(pos,rock.mesh.position);away.y=0;
      if(away.lengthSq()>.001){
        away.normalize();
        const tangentA=_v3f.set(-away.z,0,away.x),tangentB=_v3g.set(away.z,0,-away.x),tangent=tangentA.dot(toPlayer)>tangentB.dot(toPlayer)?tangentA:tangentB;
        const strength=THREE.MathUtils.clamp((danger-Math.min(distNow,distFuture))/danger,0,1);
        avoidance.addScaledVector(away,strength*0.5*agility);
        avoidance.addScaledVector(tangent,strength*1.5*agility);
      }
    }
  }
  for(const other of enemies){
    if(other===enemy)continue;
    const d=distance2D(pos,other.mesh.position);
    const sepDist=enemy.radius+other.radius+0.5;
    if(d<sepDist&&d>.001){
      _v3e.subVectors(pos,other.mesh.position);
      _v3e.y=0;
      _v3e.normalize();
      avoidance.addScaledVector(_v3e,(sepDist-d)/sepDist*0.35);
    }
  }
  toPlayer.multiplyScalar(enemy.type==="purple"?1.2:1.0).add(avoidance);
  if(toPlayer.lengthSq()>.001)toPlayer.normalize();
  return toPlayer;
}

function getEnemyTangentEscape(enemy){
  const pos=enemy.mesh.position;
  let nearestRock=null,nearestDist=Infinity;
  for(const rock of rocks){
    const d=distance2D(pos,rock.mesh.position);
    if(d<nearestDist){nearestDist=d;nearestRock=rock;}
  }
  if(!nearestRock){_v3b.set(Math.random()-.5,0,Math.random()-.5).normalize();return _v3b}
  _v3b.subVectors(pos,nearestRock.mesh.position);
  _v3b.y=0;
  if(_v3b.lengthSq()<.001){_v3b.set(Math.random()-.5,0,Math.random()-.5).normalize();return _v3b}
  _v3b.normalize();
  _v3d.set(-_v3b.z,0,_v3b.x);
  _v3e.set(_v3b.z,0,-_v3b.x);
  _v3c.subVectors(player.position,pos);_v3c.y=0;
  const tangent=_v3c.dot(_v3d)>_v3c.dot(_v3e)?_v3d:_v3e;
  _v3b.copy(tangent).lerp(_v3c.set(Math.random()-.5,0,Math.random()-.5).normalize(),.15).normalize();
  return _v3b;
}

function getPurpleWanderDirection(enemy,dt){
  enemy.wanderTimer-=dt;
  if(enemy.wanderTimer<=0)resetPurpleWander(enemy);
  const dir=_v3b.copy(enemy.wanderDir),avoidance=_v3c.set(0,0,0),future=_v3d.copy(enemy.mesh.position).addScaledVector(dir,2.0);
  for(const rock of rocks){
    const d=distance2D(future,rock.mesh.position),danger=rock.radius+enemy.radius+0.6;
    if(d<danger){
      const away=_v3e.subVectors(enemy.mesh.position,rock.mesh.position);away.y=0;
      if(away.lengthSq()>.001){away.normalize();avoidance.addScaledVector(away,(danger-d)/danger*0.5)}
    }
  }
  dir.add(avoidance);
  if(dir.lengthSq()>.001)dir.normalize();
  return dir;
}

function resetPurpleWander(enemy){
  const a=Math.random()*Math.PI*2;
  enemy.wanderDir.set(Math.cos(a),0,Math.sin(a));
  enemy.wanderTimer=THREE.MathUtils.randFloat(1.5,3.8);
}

function applyPlayerDamage(damage,enemyPosition){
  if(playerIsDead)return;
  if(invincibleTimer>0){playSfx("invincibleHit");spawnPlayerSideEffect("shield");return}
  hp-=damage;
  playSfx("damage");
  damageFlashTimer=.18;
  playerHitAnimTimer=.45;
  forcePlayPlayerAnim("attacked",.05);
  if(hp<=15){lowHpWarningTimer=3.0;warning.style.display="block"}
  _v3h.subVectors(player.position,enemyPosition);
  _v3h.y=0;
  if(_v3h.lengthSq()<.001)_v3h.set(Math.random()-.5,0,Math.random()-.5);
  _v3h.normalize();
  knockbackVelocity.copy(_v3h.multiplyScalar(13.5));
}

function updateFruits(dt){
  for(let i=fruits.length-1;i>=0;i--){
    const f=fruits[i];
    f.life-=dt;
    f.mesh.rotation.y+=dt*2.5;
    for(const child of f.mesh.children){
      if(child.geometry&&child.geometry.type==="TorusGeometry")child.rotation.z+=dt*(f.type==="invincible"?5:2.5);
    }
    f.mesh.position.y=PLATFORM_TOP_Y+Math.sin(aliveTime*4+i)*.12;
    if(f.life<=0){scene.remove(f.mesh);fruits.splice(i,1);continue}
    if(dist2DSq(player.position.x,player.position.z,f.mesh.position.x,f.mesh.position.z)<(playerRadius+f.radius)*(playerRadius+f.radius)){
      if(f.type==="speed"){speedBuffTimer=Math.min(speedBuffTimer+2.5,8.0);spawnPlayerSideEffect("speed")}
      if(f.type==="heal"){hp=Math.min(maxHp,hp+HEAL_AMOUNT);spawnPlayerSideEffect("heal")}
      if(f.type==="invincible")activateInvincible();
      scene.remove(f.mesh);
      fruits.splice(i,1);
    }
  }
}

function updateSpawns(dt){
  crystalSpawnTimer+=dt;enemySpawnTimer+=dt;fruitSpawnTimer+=dt;purpleEnemySpawnTimer+=dt;invincibleFruitSpawnTimer+=dt;
  const maxCrystalCount=isMobileLayout()?MOBILE_MAX_CRYSTALS:maxCrystals;
  const maxFruitCount=isMobileLayout()?MOBILE_MAX_FRUITS:maxFruits;
  if(crystalSpawnTimer>CRYSTAL_SPAWN_INTERVAL&&crystals.length<maxCrystalCount){crystalSpawnTimer=0;spawnCrystal()}
  if(enemySpawnTimer>getEnemySpawnInterval()){enemySpawnTimer=0;spawnEnemyGroup(getEnemyGroupSize())}
  if(purpleEnemySpawnTimer>nextPurpleEnemySpawnTime){
    purpleEnemySpawnTimer=0;nextPurpleEnemySpawnTime=randomInt(15,35);
    if(getPurpleEnemyCount()<maxPurpleEnemies)spawnPurpleEnemy();
  }
  if(invincibleFruitSpawnTimer>nextInvincibleFruitSpawnTime){
    invincibleFruitSpawnTimer=0;nextInvincibleFruitSpawnTime=randomInt(40,70);spawnInvincibleFruitPair();
  }
  const fruitInterval=getFruitSpawnInterval();
  if(fruitSpawnTimer>fruitInterval&&fruits.length<maxFruitCount){
    fruitSpawnTimer=0;
    const count=aliveTime>=120?randomInt(1,2):1;
    for(let i=0;i<count;i++){if(fruits.length<maxFruitCount)spawnFruit()}
  }
}

function updateHUD(){
  const t=getTier();
  setBind("score",score);
  setBind("hp",Math.max(0,hp));
  setBind("time",aliveTime.toFixed(1));
  setBind("crystal",`${t.crystalName} +${t.crystalValue}`);
  setBind("enemyLevel",t.enemyLevel);
  setBind("enemyCount",enemies.length);
  setBind("purpleCount",getPurpleEnemyCount());
  setBind("speedBuff",Math.max(0,speedBuffTimer).toFixed(1));
  setBind("invincibleBuff",Math.max(0,invincibleTimer).toFixed(1));
  setBind("fps",fps);
  const invincibleNext=Math.max(0,Math.ceil(nextInvincibleFruitSpawnTime-invincibleFruitSpawnTimer));
  if(aliveTime<25)setBind("fruitInfo",`25秒后加速果实 / 无敌${invincibleNext}s`);
  else if(aliveTime<45)setBind("fruitInfo",`加速果实 / 无敌${invincibleNext}s`);
  else if(aliveTime<60)setBind("fruitInfo",`加速+加血 / 无敌${invincibleNext}s`);
  else if(aliveTime<120)setBind("fruitInfo",`果实加快 / 无敌${invincibleNext}s`);
  else setBind("fruitInfo",`MAX刷新 / 无敌${invincibleNext}s`);
}

function endGame(){
  if(gameOverPending)return;
  gameOverPending=true;
  gameRunning=false;
  document.getElementById("scanlines").style.display="none";

  stopBGM();
  playSfx("gameover");

  meta.gamesPlayed++;
  meta.bestScore=Math.max(meta.bestScore,score);
  meta.bestTime=Math.max(meta.bestTime,aliveTime);
  evaluateAchievements();
  saveMeta();

  playerIsDead=true;
  knockbackVelocity.set(0,0,0);
  moveInput.set(0,0);
  invincibleTimer=0;
  invincibleVisualActive=false;
  clearPlatformAirParticles();
  enemySpawnQueue.length=0;
  restorePlayerTint();

  clearPlayerActions();
  playPlayerAnim("idle",.15,true);

  setHUDVisible(false);
  warning.style.display="none";
  damageOverlay.style.opacity=0;

  finalScore.textContent=score;
  finalTime.textContent=aliveTime.toFixed(1);
  renderAchievementPanel("gameoverAchievementPanel",true,newlyUnlockedAchievements);
  renderAchievementPanel("startAchievementPanel",false,[]);

  setTimeout(()=>{if(gameOverPending)gameOverScreen.style.display="flex"},550);
}

function randomPosition(){
  const margin=2.2,rx=Math.max(2,platformWalkRadiusX-margin),rz=Math.max(2,platformWalkRadiusZ-margin);
  const angle=Math.random()*Math.PI*2,radius=Math.sqrt(Math.random());
  const x=Math.cos(angle)*rx*radius,z=Math.sin(angle)*rz*radius,y=getPlatformHeightAt(x,z);
  return new THREE.Vector3(x,y,z);
}
function randomEdgePosition(){
  const margin=1.8,rx=Math.max(3,platformWalkRadiusX-margin),rz=Math.max(3,platformWalkRadiusZ-margin);
  const angle=Math.random()*Math.PI*2,x=Math.cos(angle)*rx,z=Math.sin(angle)*rz,y=getPlatformHeightAt(x,z);
  return new THREE.Vector3(x,y,z);
}
function findSafePosition(radius){
  for(let i=0;i<90;i++){
    const pos=randomPosition();
    if(distance2D(pos,player.position)<4.5)continue;
    if(collidesWithRocks(pos,radius))continue;
    let tooClose=false;
    for(const c of crystals){if(distance2D(pos,c.mesh.position)<3){tooClose=true;break}}
    for(const f of fruits){if(distance2D(pos,f.mesh.position)<3){tooClose=true;break}}
    if(!tooClose)return pos;
  }
  return randomPosition();
}
function collidesWithRocks(pos,radius){for(const r of rocks){const limit=radius+r.radius;if(dist2DSq(pos.x,pos.z,r.mesh.position.x,r.mesh.position.z)<limit*limit)return true}return false}
function clampToWorld(pos){clampToPlatform(pos,.8)}
function distance2D(a,b){const dx=a.x-b.x,dz=a.z-b.z;return Math.sqrt(dx*dx+dz*dz)}
function randomInt(min,max){return Math.floor(Math.random()*(max-min+1))+min}

function setupControls(){
  window.addEventListener("keydown",e=>keys[e.code]=true);
  window.addEventListener("keyup",e=>keys[e.code]=false);
}

function setupJoystick(){
  const joystick=document.getElementById("joystick");
  const stick=document.getElementById("stick");
  let active=false,center={x:0,y:0},maxDist=42;

  joystick.addEventListener("pointerdown",e=>{
    active=true;
    unlockAudio();
    const rect=joystick.getBoundingClientRect();
    center.x=rect.left+rect.width/2;
    center.y=rect.top+rect.height/2;
    maxDist=rect.width*.35;
    joystick.setPointerCapture(e.pointerId);
    updateStick(e.clientX,e.clientY);
  });

  joystick.addEventListener("pointermove",e=>{if(active)updateStick(e.clientX,e.clientY)});
  joystick.addEventListener("pointerup",()=>{active=false;moveInput.set(0,0);resetStick()});
  joystick.addEventListener("pointercancel",()=>{active=false;moveInput.set(0,0);resetStick()});

  function updateStick(x,y){
    let dx=x-center.x,dy=y-center.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>maxDist){dx=dx/dist*maxDist;dy=dy/dist*maxDist}
    const base=joystick.getBoundingClientRect(),stickSize=stick.offsetWidth;
    stick.style.left=`${base.width/2-stickSize/2+dx}px`;
    stick.style.top=`${base.height/2-stickSize/2+dy}px`;
    moveInput.set(dx/maxDist,dy/maxDist);
  }

  function resetStick(){
    const base=joystick.getBoundingClientRect(),stickSize=stick.offsetWidth;
    stick.style.left=`${base.width/2-stickSize/2}px`;
    stick.style.top=`${base.height/2-stickSize/2}px`;
  }

  resetStick();
}

function onResize(){
  updateLayoutCache();
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,_isMobile?1.0:1.6));
  updatePlayerHeadUIScale();
  if(gameRunning)setHUDVisible(true);
}

function initAudio(){
  if(audioCtx)return;
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextClass){console.warn("当前浏览器不支持 WebAudio");return}
  audioCtx=new AudioContextClass();
}
function unlockAudio(){
  initAudio();
  if(!audioCtx)return;
  if(audioCtx.state==="suspended")audioCtx.resume();
  audioUnlocked=true;
}
function playTone(freq,duration,type="sine",volume=.06,delay=0){
  if(!audioCtx||!audioUnlocked)return;
  const now=audioCtx.currentTime+delay;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type=type;
  osc.frequency.setValueAtTime(freq,now);
  gain.gain.setValueAtTime(0,now);
  gain.gain.linearRampToValueAtTime(volume,now+.015);
  gain.gain.exponentialRampToValueAtTime(.0001,now+duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now+duration+.05);
}
function playNoise(duration=.12,volume=.04){
  if(!audioCtx||!audioUnlocked)return;
  if(isMobileLayout()){playTone(110,.16,"square",.045,0);return}
  const bufferSize=Math.floor(audioCtx.sampleRate*duration);
  const buffer=audioCtx.createBuffer(1,bufferSize,audioCtx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++)data[i]=(Math.random()*2-1)*(1-i/bufferSize);
  const source=audioCtx.createBufferSource();
  const gain=audioCtx.createGain();
  source.buffer=buffer;
  gain.gain.value=volume;
  source.connect(gain);
  gain.connect(audioCtx.destination);
  source.start();
}
function playSfx(type){
  if(!audioCtx||!audioUnlocked)return;
  if(isMobileLayout()){
    if(type==="crystal"){playTone(660,.06,"triangle",.07,0);playTone(1174.66,.08,"triangle",.055,.08)}
    else if(type==="damage")playTone(110,.16,"square",.045,0);
    else if(type==="start"){playTone(392,.12,"sine",.08,0);playTone(659.25,.18,"sine",.07,.22)}
    else if(type==="purple")playTone(196,.16,"triangle",.035,0);
    else if(type==="gameover"){playTone(329.63,.18,"sine",.06,0);playTone(164.81,.35,"sine",.05,.42)}
    else if(type==="heal")playTone(523.25,.14,"sine",.055,.11);
    else if(type==="speed")playTone(523.25,.08,"sawtooth",.045,0);
    else if(type==="invincible")playTone(523.25,.08,"triangle",.07,0);
    else if(type==="invincibleSpawn")playTone(311.13,.16,"sine",.035,0);
    else if(type==="invincibleHit")playTone(740,.08,"square",.035,0);
    return;
  }
  if(type==="start"){playTone(392,.12,"sine",.08,0);playTone(523.25,.14,"sine",.075,.1);playTone(659.25,.18,"sine",.07,.22)}
  if(type==="crystal"){playTone(660,.06,"triangle",.07,0);playTone(880,.06,"triangle",.065,.04);playTone(1174.66,.08,"triangle",.06,.08);playTone(1396.91,.12,"triangle",.055,.14);playTone(1760,.18,"sine",.05,.22)}
  if(type==="speed"){playTone(523.25,.08,"sawtooth",.045,0);playTone(659.25,.08,"sawtooth",.04,.07);playTone(783.99,.12,"sawtooth",.035,.14)}
  if(type==="heal"){playTone(392,.12,"sine",.06,0);playTone(523.25,.14,"sine",.055,.11);playTone(659.25,.18,"sine",.05,.22)}
  if(type==="invincible"){playTone(523.25,.08,"triangle",.07,0);playTone(659.25,.08,"triangle",.065,.06);playTone(783.99,.09,"triangle",.06,.12);playTone(1046.5,.16,"triangle",.055,.2)}
  if(type==="invincibleSpawn"){playTone(311.13,.16,"sine",.035,0);playTone(466.16,.18,"sine",.032,.12)}
  if(type==="invincibleHit"){playTone(740,.08,"square",.035,0);playTone(988,.08,"square",.028,.05)}
  if(type==="damage"){playNoise(.12,.055);playTone(110,.16,"square",.045,0)}
  if(type==="purple"){playTone(196,.16,"triangle",.035,0);playTone(246.94,.22,"triangle",.03,.12)}
  if(type==="gameover"){playTone(329.63,.18,"sine",.06,0);playTone(246.94,.22,"sine",.055,.18);playTone(164.81,.35,"sine",.05,.42)}
}
function startBGM(){
  if(!audioCtx||!audioUnlocked||bgmTimer||_isMobile)return;
  const melody=[196,246.94,293.66,369.99,329.63,293.66,246.94,220];
  bgmTimer=setInterval(()=>{
    if(!gameRunning||!audioCtx||!audioUnlocked)return;
    const note=melody[bgmStep%melody.length],bass=melody[(bgmStep+4)%melody.length]/2;
    playTone(note,.28,"sine",.028,0);
    playTone(bass,.52,"triangle",.018,0);
    if(invincibleTimer>0)playTone(note*2,.09,"triangle",.026,.02);
    else if(bgmStep%4===0)playTone(note*2,.08,"triangle",.018,.04);
    bgmStep++;
  },360);
}
function stopBGM(){if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null}}
</script>
