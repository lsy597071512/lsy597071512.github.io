﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOADING</title>
  <style>
    :root {
      --pixel-cyan: #8df6ff;
      --pixel-pink: #ff7ddd;
      --pixel-yellow: #fff0a8;
      --pixel-ink: rgba(7, 10, 28, 0.84);
      --pixel-line: rgba(110, 234, 255, 0.42);
      --pixel-shadow:
        0 0 0 2px rgba(10, 12, 28, 0.68),
        4px 4px 0 rgba(4, 7, 20, 0.46),
        0 0 0 3px rgba(255, 255, 255, 0.05),
        0 0 18px rgba(55, 242, 255, 0.18),
        0 0 26px rgba(255, 43, 214, 0.14);
      --pixel-surface:
        linear-gradient(180deg, rgba(34, 24, 88, 0.72), rgba(8, 11, 32, 0.82)),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.04) 0 2px, transparent 2px 6px),
        repeating-linear-gradient(90deg, rgba(141, 246, 255, 0.06) 0 2px, transparent 2px 6px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: clamp(1rem, 3vw, 1.5rem);
      color: #fff;
      font-family: "Trebuchet MS", "Microsoft YaHei", sans-serif;
      background:
        linear-gradient(180deg, rgba(4, 8, 24, 0.54), rgba(4, 8, 24, 0.6)),
        url("Tex/beijing01.png") center / cover no-repeat fixed;
      image-rendering: pixelated;
      overflow: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      background:
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.02) 0 2px, transparent 2px 6px),
        repeating-linear-gradient(90deg, rgba(141, 246, 255, 0.03) 0 2px, transparent 2px 6px);
      mix-blend-mode: screen;
      opacity: 0.46;
    }

    body::after {
      background:
        linear-gradient(90deg, rgba(255, 125, 221, 0.08), transparent 22%, transparent 78%, rgba(141, 246, 255, 0.08)),
        linear-gradient(180deg, rgba(255, 240, 168, 0.05), transparent 24%, transparent 76%, rgba(141, 246, 255, 0.04));
      opacity: 0.9;
    }

    .loading-shell {
      position: relative;
      width: min(34rem, 100%);
      padding: clamp(1.25rem, 4vw, 2rem);
      border: 2px solid var(--pixel-line);
      border-radius: 8px;
      background: var(--pixel-surface);
      box-shadow: var(--pixel-shadow);
      backdrop-filter: blur(8px);
      overflow: hidden;
    }

    .loading-shell::before,
    .loading-shell::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }

    .loading-shell::before {
      inset: 4px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background:
        linear-gradient(90deg, rgba(141, 246, 255, 0.05), transparent 24%, transparent 76%, rgba(255, 125, 221, 0.05));
    }

    .loading-shell::after {
      right: 6px;
      bottom: 6px;
      width: 14px;
      height: 14px;
      background: linear-gradient(135deg, transparent 0 50%, rgba(255, 240, 168, 0.82) 50% 100%);
      filter: drop-shadow(2px 2px 0 rgba(4, 7, 20, 0.5));
    }

    .loading-content {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 1rem;
    }

    .loading-title {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.4rem);
      line-height: 0.95;
      letter-spacing: 0.28rem;
      text-align: center;
      color: #fff;
      text-shadow: 2px 2px 0 rgba(4, 7, 20, 0.58), 0 0 16px rgba(141, 246, 255, 0.2);
    }

    .loading-subtitle {
      margin: 0;
      text-align: center;
      color: rgba(225, 239, 255, 0.9);
      font-size: clamp(0.92rem, 1.8vw, 1.1rem);
      line-height: 1.5;
    }

    .progress-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      font-weight: 900;
      letter-spacing: 0.08rem;
      font-size: clamp(0.82rem, 1.6vw, 1rem);
      color: var(--pixel-cyan);
      text-shadow: 1px 1px 0 rgba(4, 7, 20, 0.55), 0 0 10px rgba(141, 246, 255, 0.16);
    }

    .progress-track {
      position: relative;
      height: 1.4rem;
      border: 2px solid rgba(141, 246, 255, 0.42);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(4, 8, 24, 0.74), rgba(10, 12, 28, 0.9)),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.04) 0 4px, transparent 4px 12px);
      box-shadow: inset 0 0 12px rgba(141, 246, 255, 0.08);
      overflow: hidden;
    }

    .progress-fill {
      position: absolute;
      inset: 2px auto 2px 2px;
      width: 0%;
      border-radius: 4px;
      background:
        linear-gradient(90deg, #8df6ff 0%, #78bcff 38%, #ff7ddd 76%, #fff0a8 100%),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.16) 0 6px, transparent 6px 12px);
      box-shadow: 0 0 12px rgba(141, 246, 255, 0.34), 0 0 18px rgba(255, 125, 221, 0.18);
      transition: width 0.22s ease;
    }

    .progress-fill::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.42), transparent);
      transform: translateX(-100%);
      animation: shine 1.25s linear infinite;
    }

    .loading-status {
      margin: 0;
      min-height: 1.5em;
      text-align: center;
      color: rgba(223, 236, 255, 0.88);
      font-size: clamp(0.86rem, 1.7vw, 1rem);
      line-height: 1.5;
    }

    .asset-list {
      display: grid;
      gap: 0.5rem;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .asset-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.75rem;
      align-items: center;
      min-width: 0;
      padding: 0.65rem 0.75rem;
      border: 1px solid rgba(141, 246, 255, 0.2);
      border-radius: 6px;
      background: rgba(12, 16, 42, 0.54);
      color: rgba(233, 241, 255, 0.88);
      font-size: clamp(0.8rem, 1.5vw, 0.95rem);
    }

    .asset-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .asset-state {
      font-weight: 900;
      letter-spacing: 0.04rem;
      color: var(--pixel-yellow);
    }

    .asset-state.done {
      color: var(--pixel-cyan);
    }

    .asset-state.error {
      color: #ff9ea8;
    }

    .loading-actions {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .action-link,
    .retry-btn {
      appearance: none;
      border: 2px solid rgba(141, 246, 255, 0.42);
      border-radius: 6px;
      padding: 0.68rem 1rem;
      background: rgba(19, 23, 56, 0.72);
      color: #fff;
      text-decoration: none;
      font-weight: 900;
      letter-spacing: 0.05rem;
      cursor: pointer;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05), 3px 3px 0 rgba(4, 7, 20, 0.34);
    }

    .retry-btn[hidden] {
      display: none;
    }

    @keyframes shine {
      to {
        transform: translateX(100%);
      }
    }

    @media (max-width: 480px) {
      .progress-track {
        height: 1.2rem;
      }

      .asset-item {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="loading-shell" aria-live="polite">
    <div class="loading-content">
      <h1 class="loading-title">LOADING</h1>
      <p class="loading-subtitle">正在预加载主页、游戏脚本与核心美术音频资源，请稍候。</p>
      <div class="progress-meta">
        <span>资源加载中</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="加载进度">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <p id="loadingStatus" class="loading-status">准备启动资源队列...</p>
      <ul id="assetList" class="asset-list"></ul>
      <div class="loading-actions">
        <button id="retryBtn" class="retry-btn" type="button" hidden>重新加载</button>
        <a class="action-link" href="home.html">跳过等待进入主页</a>
      </div>
    </div>
  </main>

  <script>
    "use strict";

    const TARGET_PAGE = "home.html";
    const FAST_ENTRY_GATE_MS = 2200;
    const assetQueue = [
      { id: "home", label: "主页代码", type: "fetch", url: "home.html", priority: "critical", timeoutMs: 2200 },
      { id: "bg", label: "背景贴图", type: "image", url: "Tex/beijing01.png", priority: "critical", timeoutMs: 2200 },
      { id: "game", label: "游戏代码", type: "fetch", url: "game.html", priority: "optional", timeoutMs: 3000 },
      { id: "matter", label: "物理引擎", type: "fetch", url: "vendor/matter.min.js", priority: "optional", timeoutMs: 2600 }
    ];

    const progressFill = document.getElementById("progressFill");
    const progressPercent = document.getElementById("progressPercent");
    const loadingStatus = document.getElementById("loadingStatus");
    const assetList = document.getElementById("assetList");
    const retryBtn = document.getElementById("retryBtn");
    const progressTrack = document.querySelector(".progress-track");

    let finishedCount = 0;
    let redirectTimer = 0;
    let loadingStarted = false;
    let loadingRunToken = 0;
    let hasRedirected = false;

    // #region debug-point A:loading-bootstrap
    const DEBUG_URL = "http://127.0.0.1:7777/event";
    const DEBUG_SESSION_ID = "mobile-load-ui";
    const DEBUG_RUN_ID = "pre-fix";
    const loadingDebugClock = performance.now();

    function reportLoadingDebug(hypothesisId, location, msg, data = {}) {
      fetch(DEBUG_URL, {
        method: "POST",
        mode: "no-cors",
        keepalive: true,
        headers: { "Content-Type": "text/plain;charset=UTF-8" },
        body: JSON.stringify({
          sessionId: DEBUG_SESSION_ID,
          runId: DEBUG_RUN_ID,
          hypothesisId,
          location,
          msg: `[DEBUG] ${msg}`,
          data,
          ts: Date.now()
        })
      }).catch(() => {});
    }

    reportLoadingDebug("A", "index:init", "loading page bootstrapped", {
      assetCount: assetQueue.length,
      connection: navigator.connection ? {
        effectiveType: navigator.connection.effectiveType || "",
        downlink: navigator.connection.downlink || 0,
        rtt: navigator.connection.rtt || 0,
        saveData: Boolean(navigator.connection.saveData)
      } : null,
      userAgent: navigator.userAgent,
      screen: {
        width: window.innerWidth,
        height: window.innerHeight,
        dpr: window.devicePixelRatio || 1
      }
    });
    // #endregion

    renderAssetList();
    startLoading();

    retryBtn.addEventListener("click", () => {
      window.clearTimeout(redirectTimer);
      finishedCount = 0;
      loadingStarted = false;
      hasRedirected = false;
      loadingRunToken += 1;
      retryBtn.hidden = true;
      assetQueue.forEach((asset) => {
        asset.status = "pending";
      });
      renderAssetList();
      updateProgress();
      startLoading();
    });

    function renderAssetList() {
      assetList.innerHTML = assetQueue.map((asset) => `
        <li class="asset-item" data-asset-id="${asset.id}">
          <span class="asset-name">${asset.label}</span>
          <span class="asset-state ${asset.status === "done" ? "done" : asset.status === "error" ? "error" : ""}">
            ${getStatusText(asset.status)}
          </span>
        </li>
      `).join("");
    }

    function updateAssetState(asset, status, detail) {
      asset.status = status;
      const item = assetList.querySelector(`[data-asset-id="${asset.id}"] .asset-state`);
      if (item) {
        item.textContent = detail || getStatusText(status);
        item.className = `asset-state ${status === "done" ? "done" : status === "error" ? "error" : ""}`;
      }
    }

    function getStatusText(status) {
      if (status === "done") return "完成";
      if (status === "error") return "失败";
      if (status === "loading") return "加载中";
      return "等待中";
    }

    function updateProgress() {
      const percent = Math.round((finishedCount / assetQueue.length) * 100);
      progressFill.style.width = `${percent}%`;
      progressPercent.textContent = `${percent}%`;
      progressTrack.setAttribute("aria-valuenow", String(percent));
    }

    function getHypothesisId(asset) {
      if (asset.id === "matter") return "B";
      if (asset.id === "bgm") return "C";
      return "A";
    }

    function delay(ms) {
      return new Promise((resolve) => window.setTimeout(resolve, ms));
    }

    function enterTargetPage(reason, detail) {
      if (hasRedirected) return;
      hasRedirected = true;
      loadingStatus.textContent = reason;
      // #region debug-point A:redirect
      reportLoadingDebug("A", "index:redirect", "redirecting to target page", {
        targetPage: TARGET_PAGE,
        elapsedMs: Math.round(performance.now() - loadingDebugClock),
        detail
      });
      // #endregion
      redirectTimer = window.setTimeout(() => {
        window.location.replace(TARGET_PAGE);
      }, 140);
    }

    async function startLoading() {
      if (loadingStarted) return;
      loadingStarted = true;
      hasRedirected = false;
      finishedCount = 0;
      updateProgress();
      const runToken = ++loadingRunToken;
      loadingStatus.textContent = "正在并行预热主页与核心资源...";
      // #region debug-point A:queue-start
      reportLoadingDebug("A", "index:startLoading", "loading queue started", {
        assetOrder: assetQueue.map((asset) => asset.id),
        priorities: assetQueue.map((asset) => `${asset.id}:${asset.priority}`),
        elapsedMs: Math.round(performance.now() - loadingDebugClock)
      });
      // #endregion

      const tasks = assetQueue.map((asset, queueIndex) => {
        updateAssetState(asset, "loading");
        const assetStart = performance.now();
        // #region debug-point A:asset-start
        reportLoadingDebug(getHypothesisId(asset), "index:asset-start", "asset load started", {
          assetId: asset.id,
          url: asset.url,
          type: asset.type,
          queueIndex,
          priority: asset.priority,
          timeoutMs: asset.timeoutMs
        });
        // #endregion
        const promise = loadAsset(asset).then((result) => {
          if (runToken !== loadingRunToken) return { asset, ok: false, ignored: true };
          updateAssetState(asset, "done");
          // #region debug-point A:asset-success
          reportLoadingDebug(getHypothesisId(asset), "index:asset-success", "asset load finished", {
            assetId: asset.id,
            url: asset.url,
            durationMs: Math.round(performance.now() - assetStart),
            size: result && typeof result.size === "number" ? result.size : null,
            type: asset.type,
            priority: asset.priority
          });
          // #endregion
          return { asset, ok: true, result };
        }).catch((error) => {
          if (runToken !== loadingRunToken) return { asset, ok: false, ignored: true };
          console.warn(`资源加载失败: ${asset.url}`, error);
          updateAssetState(asset, "error");
          // #region debug-point B:asset-error
          reportLoadingDebug(getHypothesisId(asset), "index:asset-error", "asset load failed", {
            assetId: asset.id,
            url: asset.url,
            durationMs: Math.round(performance.now() - assetStart),
            priority: asset.priority,
            error: error && error.message ? error.message : String(error)
          });
          // #endregion
          return { asset, ok: false, error };
        }).finally(() => {
          if (runToken !== loadingRunToken) return;
          finishedCount += 1;
          updateProgress();
        });

        return { asset, promise };
      });

      const criticalTasks = tasks
        .filter((task) => task.asset.priority === "critical")
        .map((task) => task.promise);

      const gateResult = await Promise.race([
        Promise.allSettled(criticalTasks).then((results) => ({ type: "critical-ready", results })),
        delay(FAST_ENTRY_GATE_MS).then(() => ({ type: "gate-timeout" }))
      ]);

      if (runToken !== loadingRunToken) return;

      if (gateResult.type === "gate-timeout") {
        // #region debug-point A:fast-entry-gate
        reportLoadingDebug("A", "index:gate-timeout", "fast entry gate reached before all critical assets settled", {
          gateMs: FAST_ENTRY_GATE_MS,
          elapsedMs: Math.round(performance.now() - loadingDebugClock)
        });
        // #endregion
        enterTargetPage("主页预热已达到上限，正在直接进入...", { reason: "gate-timeout" });
      } else {
        const criticalFailures = gateResult.results
          .filter((item) => item.status === "fulfilled" && item.value && item.value.ok === false)
          .map((item) => item.value.asset.label);
        enterTargetPage(
          criticalFailures.length ? "关键资源预热未完成，已切换为按需加载进入主页..." : "主页资源就绪，正在进入主页...",
          { reason: "critical-ready", criticalFailures }
        );
      }

      Promise.all(tasks.map((task) => task.promise)).then((results) => {
        if (runToken !== loadingRunToken) return;
        const failed = results.filter((item) => item && !item.ok && !item.ignored);
        if (failed.length === 0) {
          // #region debug-point A:queue-success
          reportLoadingDebug("A", "index:queue-success", "loading queue completed", {
            elapsedMs: Math.round(performance.now() - loadingDebugClock),
            assetCount: results.length
          });
          // #endregion
          return;
        }

        // #region debug-point B:queue-failed
        reportLoadingDebug("B", "index:queue-failed", "loading queue finished with failures", {
          elapsedMs: Math.round(performance.now() - loadingDebugClock),
          failedAssets: failed.map((item) => ({
            id: item.asset.id,
            url: item.asset.url,
            error: item.error && item.error.message ? item.error.message : String(item.error)
          }))
        });
        // #endregion
      });
    }

    function loadAsset(asset) {
      if (asset.type === "image") {
        return withTimeout(loadImage(asset.url), asset.timeoutMs, asset.label);
      }
      return withTimeout(fetchResource(asset.url), asset.timeoutMs, asset.label);
    }

    function withTimeout(promise, timeoutMs, label) {
      if (!timeoutMs) return promise;
      return Promise.race([
        promise,
        delay(timeoutMs).then(() => {
          throw new Error(`${label} timeout`);
        })
      ]);
    }

    function fetchResource(url) {
      return fetch(url, { cache: "force-cache" }).then((response) => {
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        return response.blob().then((blob) => ({
          size: blob.size,
          type: blob.type || response.headers.get("content-type") || "",
          status: response.status,
          url
        }));
      });
    }

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve({
          size: (img.naturalWidth || 0) * (img.naturalHeight || 0),
          width: img.naturalWidth || 0,
          height: img.naturalHeight || 0,
          url
        });
        img.onerror = () => reject(new Error("Image load failed"));
        img.src = url;
      });
    }
  </script>
</body>
</html>
