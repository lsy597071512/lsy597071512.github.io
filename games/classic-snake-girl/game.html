<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>霓虹核心竞技场</title>
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <style>
    :root {
      --cyan: #37f2ff;
      --blue: #4b88ff;
      --pink: #ff2bd6;
      --violet: #8c47ff;
      --yellow: #ffe76e;
      --bg: #06041b;
      --panel-bg: linear-gradient(180deg, rgba(21, 10, 62, .5), rgba(11, 8, 38, .36));
      --panel-border: rgba(95, 209, 255, .66);
      --panel-glow: 0 0 1.5rem rgba(55, 242, 255, .22), 0 0 2.75rem rgba(255, 43, 214, .18), inset 0 0 1rem rgba(130, 78, 255, .26);
      --space-1: clamp(0.5rem, 0.8vw, 0.75rem);
      --space-2: clamp(0.75rem, 1.2vw, 1rem);
      --space-3: clamp(1rem, 1.8vw, 1.375rem);
      --space-4: clamp(1.25rem, 2.4vw, 1.875rem);
      --panel-notch: clamp(0.75rem, 1.6vw, 1.125rem);
      --pixel-radius-sm: 4px;
      --pixel-radius-md: 8px;
      --pixel-border-soft: 1px;
      --pixel-border-strong: 2px;
      --pixel-shadow-hard:
        0 0 0 2px rgba(6, 8, 24, .58),
        4px 4px 0 rgba(4, 7, 20, .34),
        0 0 0 3px rgba(255, 255, 255, .05),
        0 0 1.35rem rgba(55, 242, 255, .18),
        0 0 2rem rgba(255, 43, 214, .14);
      --pixel-shadow-soft:
        0 0 0 1px rgba(255, 255, 255, .05),
        3px 3px 0 rgba(4, 7, 20, .28),
        0 0 1rem rgba(55, 242, 255, .12);
      --pixel-surface-main:
        linear-gradient(180deg, rgba(24, 15, 78, .72), rgba(10, 10, 34, .76)),
        repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 2px, transparent 2px 6px),
        repeating-linear-gradient(90deg, rgba(55, 242, 255, .05) 0 2px, transparent 2px 6px);
      --pixel-surface-soft:
        linear-gradient(180deg, rgba(19, 16, 66, .6), rgba(11, 11, 37, .56)),
        repeating-linear-gradient(0deg, rgba(255,255,255,.028) 0 2px, transparent 2px 5px),
        repeating-linear-gradient(90deg, rgba(255, 43, 214, .04) 0 2px, transparent 2px 5px);
      --pixel-surface-accent:
        linear-gradient(180deg, rgba(38, 18, 94, .78), rgba(15, 11, 46, .72)),
        repeating-linear-gradient(90deg, rgba(255, 231, 110, .06) 0 2px, transparent 2px 6px);
      --dock-height: clamp(6rem, 14vh, 8.5rem);
      --page-pad: 1.25rem;
      --playfield-left: calc((100vw - 512px) / 2);
      --playfield-top: 112px;
      --playfield-right: calc(var(--playfield-left) + 512px);
      --playfield-bottom: calc(var(--playfield-top) + 416px);
      --playfield-width: 512px;
      --playfield-height: 416px;
      --hud-side-width: 17rem;
      --hud-left-width: var(--hud-side-width);
      --hud-right-width: var(--hud-side-width);
      --hud-logo-width: min(22rem, calc(var(--playfield-width) * 0.92));
      --hud-progress-width: min(30rem, calc(var(--playfield-width) * 0.98));
      --bottom-dock-width: min(44rem, calc(100vw - 2rem));
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      user-select: none;
    }

    html {
      font-size: clamp(14px, 0.45vw + 11px, 18px);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #040714;
      font-family: "Trebuchet MS", "Microsoft YaHei", sans-serif;
      color: #fff;
    }

    body.theme-sunset {
      --cyan: #ffd59c;
      --blue: #ffb166;
      --pink: #ff8d5d;
      --violet: #822f1d;
      --yellow: #fff0ac;
      --panel-border: rgba(255, 183, 108, .62);
      --pixel-surface-main:
        linear-gradient(180deg, rgba(72, 31, 20, .76), rgba(28, 14, 18, .78)),
        repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 2px, transparent 2px 6px),
        repeating-linear-gradient(90deg, rgba(255, 183, 108, .05) 0 2px, transparent 2px 6px);
      --pixel-surface-soft:
        linear-gradient(180deg, rgba(83, 34, 21, .6), rgba(46, 18, 18, .56)),
        repeating-linear-gradient(0deg, rgba(255,255,255,.028) 0 2px, transparent 2px 5px),
        repeating-linear-gradient(90deg, rgba(255, 128, 78, .04) 0 2px, transparent 2px 5px);
      --pixel-surface-accent:
        linear-gradient(180deg, rgba(110, 48, 24, .78), rgba(54, 21, 15, .72)),
        repeating-linear-gradient(90deg, rgba(255, 222, 142, .06) 0 2px, transparent 2px 6px);
    }

    body.theme-ice {
      --cyan: #9cf6ff;
      --blue: #73c7ff;
      --pink: #63b0ff;
      --violet: #2f6ca8;
      --yellow: #d7f7ff;
      --panel-border: rgba(135, 232, 255, .6);
      --pixel-surface-main:
        linear-gradient(180deg, rgba(22, 45, 84, .74), rgba(7, 20, 42, .76)),
        repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 2px, transparent 2px 6px),
        repeating-linear-gradient(90deg, rgba(156, 246, 255, .05) 0 2px, transparent 2px 6px);
      --pixel-surface-soft:
        linear-gradient(180deg, rgba(24, 58, 92, .6), rgba(10, 25, 46, .56)),
        repeating-linear-gradient(0deg, rgba(255,255,255,.028) 0 2px, transparent 2px 5px),
        repeating-linear-gradient(90deg, rgba(115, 199, 255, .04) 0 2px, transparent 2px 5px);
      --pixel-surface-accent:
        linear-gradient(180deg, rgba(32, 76, 120, .78), rgba(12, 33, 60, .72)),
        repeating-linear-gradient(90deg, rgba(215, 247, 255, .06) 0 2px, transparent 2px 6px);
    }

    body.theme-aurora {
      --cyan: #9dffe6;
      --blue: #69f5cf;
      --pink: #66f3a9;
      --violet: #1f8c66;
      --yellow: #f8ffb1;
      --panel-border: rgba(162, 255, 204, .62);
      --pixel-surface-main:
        linear-gradient(180deg, rgba(17, 67, 52, .74), rgba(8, 33, 27, .76)),
        repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 2px, transparent 2px 6px),
        repeating-linear-gradient(90deg, rgba(157, 255, 230, .05) 0 2px, transparent 2px 6px);
      --pixel-surface-soft:
        linear-gradient(180deg, rgba(16, 78, 58, .6), rgba(8, 40, 30, .56)),
        repeating-linear-gradient(0deg, rgba(255,255,255,.028) 0 2px, transparent 2px 5px),
        repeating-linear-gradient(90deg, rgba(102, 243, 169, .04) 0 2px, transparent 2px 5px);
      --pixel-surface-accent:
        linear-gradient(180deg, rgba(22, 104, 76, .78), rgba(9, 51, 37, .72)),
        repeating-linear-gradient(90deg, rgba(248, 255, 177, .06) 0 2px, transparent 2px 6px);
    }

    .bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
      background: #040714;
      opacity: 0;
      transition: opacity .28s ease;
    }

    body.bg-video-ready .bg-video {
      opacity: 1;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    body::before {
      background:
        linear-gradient(90deg, transparent 0 7%, rgba(71, 111, 255, .08) 7% 8%, transparent 8% 18%, rgba(255, 43, 214, .07) 18% 19%, transparent 19% 100%),
        linear-gradient(180deg, transparent 0 70%, rgba(72, 14, 111, .2) 70% 100%);
      mix-blend-mode: screen;
      opacity: .7;
    }

    body::after {
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,.015) 0 1px, transparent 1px 4px),
        repeating-linear-gradient(180deg, rgba(255,255,255,.01) 0 1px, transparent 1px 4px);
      opacity: .15;
    }

    #gameCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      cursor: crosshair;
      z-index: 1;
      image-rendering: pixelated;
    }

    .hud {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }

    .hud-col {
      position: fixed;
      top: max(var(--space-3), env(safe-area-inset-top));
      bottom: calc(var(--dock-height) + max(var(--space-3), env(safe-area-inset-bottom)));
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      width: min(var(--hud-side-width), calc((100vw - 2 * var(--page-pad)) / 2));
      max-height: calc(100vh - var(--dock-height) - max(var(--space-3), env(safe-area-inset-top)) - max(var(--space-3), env(safe-area-inset-bottom)));
      overflow: auto;
      scrollbar-width: none;
      pointer-events: none;
    }

    .hud-col::-webkit-scrollbar {
      display: none;
    }

    .hud-col > * {
      width: 100%;
      flex: 0 0 auto;
    }

    .hud-col.left {
      left: max(var(--page-pad), env(safe-area-inset-left));
      width: min(var(--hud-left-width), calc(max(0px, var(--playfield-left) - var(--page-pad) - 0.5rem)));
    }

    .hud-col.right {
      right: max(var(--page-pad), env(safe-area-inset-right));
      align-items: stretch;
      width: min(var(--hud-right-width), calc(max(0px, 100vw - var(--playfield-right) - var(--page-pad) - 0.5rem)));
    }

    .ui-panel {
      position: relative;
      pointer-events: auto;
      border: var(--pixel-border-strong) solid var(--panel-border);
      background: var(--pixel-surface-main);
      border-radius: var(--pixel-radius-md);
      box-shadow: var(--pixel-shadow-hard);
      backdrop-filter: blur(10px);
      overflow: hidden;
    }

    .ui-panel::before {
      content: "";
      position: absolute;
      inset: 3px;
      border: 1px solid rgba(255, 58, 210, .22);
      border-radius: inherit;
      background:
        linear-gradient(90deg, rgba(55, 242, 255, .05), transparent 22%, transparent 78%, rgba(255, 43, 214, .06)),
        linear-gradient(180deg, rgba(255,255,255,.03), transparent 18%, transparent 82%, rgba(255, 231, 110, .03));
      opacity: .9;
      pointer-events: none;
    }

    .ui-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(255,255,255,.08), transparent 24%),
        linear-gradient(180deg, rgba(80, 214, 255, .04), transparent 34%),
        linear-gradient(90deg, transparent, rgba(255, 53, 206, .03), transparent),
        linear-gradient(135deg, transparent calc(100% - 14px), rgba(255, 231, 110, .86) calc(100% - 14px));
      pointer-events: none;
    }

    .game-stage {
      position: relative;
      z-index: 2;
    }

    .orientation-guard {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      place-items: center;
      padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      background:
        linear-gradient(180deg, rgba(4, 7, 20, .88), rgba(4, 7, 20, .94)),
        url("Tex/beijing01.png") center / cover no-repeat fixed;
      text-align: center;
      touch-action: auto;
      user-select: none;
    }

    .orientation-guard::before,
    .orientation-guard::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .orientation-guard::before {
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0 1px, transparent 1px 40px),
        repeating-linear-gradient(180deg, rgba(255,255,255,.014) 0 1px, transparent 1px 40px);
      opacity: .32;
    }

    .orientation-guard::after {
      background: linear-gradient(180deg, rgba(255,255,255,.05), transparent 14%, transparent 86%, rgba(255,255,255,.03));
      mix-blend-mode: screen;
      opacity: .52;
    }

    .orientation-panel {
      position: relative;
      z-index: 1;
      width: min(30rem, 100%);
      padding: clamp(1.25rem, 4vw, 2rem);
      border: var(--pixel-border-strong) solid rgba(109, 232, 255, .58);
      border-radius: var(--pixel-radius-md);
      background: var(--pixel-surface-main);
      box-shadow: var(--pixel-shadow-hard);
      backdrop-filter: blur(12px);
    }

    .orientation-panel::before {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: inherit;
      border: 1px solid rgba(255,255,255,.08);
      background:
        linear-gradient(90deg, rgba(55, 242, 255, .05), transparent 24%, transparent 76%, rgba(255, 43, 214, .05)),
        linear-gradient(180deg, rgba(255,255,255,.03), transparent 18%, transparent 82%, rgba(255, 231, 110, .03));
      pointer-events: none;
    }

    .orientation-panel > * {
      position: relative;
      z-index: 1;
    }

    .orientation-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 4.2rem;
      height: 4.2rem;
      margin-bottom: .85rem;
      border-radius: 1rem;
      border: 1px solid rgba(255,255,255,.12);
      background: var(--pixel-surface-soft);
      font-size: 2rem;
      box-shadow: var(--pixel-shadow-soft);
    }

    .orientation-title {
      margin: 0;
      font-size: clamp(1.6rem, 5vw, 2.25rem);
      font-weight: 900;
      letter-spacing: .12rem;
      text-shadow: 2px 2px 0 rgba(4, 7, 20, .54), 0 0 16px rgba(55, 242, 255, .24);
    }

    .orientation-copy {
      margin: .9rem 0 0;
      color: rgba(223, 236, 255, .86);
      line-height: 1.7;
      font-size: clamp(.92rem, 2vw, 1.02rem);
    }

    .orientation-hint {
      margin: 1rem 0 0;
      color: rgba(255, 231, 110, .92);
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .08rem;
      text-transform: uppercase;
    }

    body.landscape-required .game-stage {
      visibility: hidden;
      pointer-events: none;
    }

    body.landscape-required .orientation-guard {
      display: grid;
    }

    body.landscape-required {
      overflow: hidden;
    }

    .home-link {
      position: fixed;
      top: max(var(--space-2), calc(env(safe-area-inset-top) + 0.25rem));
      right: max(var(--page-pad), calc(env(safe-area-inset-right) + 0.25rem));
      z-index: 12;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: clamp(6.75rem, 12vw, 8.5rem);
      min-height: 3.25rem;
      padding: 0.7rem 1rem;
      border: var(--pixel-border-strong) solid rgba(107, 230, 255, .72);
      color: #fff;
      text-decoration: none;
      font-weight: 900;
      letter-spacing: 0.08rem;
      background: var(--pixel-surface-accent);
      box-shadow: var(--pixel-shadow-hard);
      backdrop-filter: blur(12px);
      border-radius: var(--pixel-radius-md);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      text-shadow: 2px 2px 0 rgba(4, 7, 20, .48);
    }

    .home-link:hover,
    .home-link:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, .9);
      box-shadow: 0 0 1.8rem rgba(55, 242, 255, .34), 0 0 2.8rem rgba(255, 43, 214, .26);
      outline: none;
    }

    .home-link:active {
      transform: translateY(0);
    }

    .hud-col.right {
      right: max(var(--page-pad), env(safe-area-inset-right));
      align-items: stretch;
      top: calc(max(var(--space-3), env(safe-area-inset-top)) + 4.5rem);
      max-height: calc(100vh - var(--dock-height) - max(var(--space-3), env(safe-area-inset-top)) - max(var(--space-3), env(safe-area-inset-bottom)) - 4.5rem);
    }

    .scoreBox {
      position: relative;
      padding: 0.875rem 1rem 1rem;
    }

    .scoreLabel,
    .panel-title,
    .widget-title,
    .tiny-label {
      position: relative;
      z-index: 1;
      font-weight: 900;
      letter-spacing: 1px;
      color: #fff;
      text-shadow: 2px 2px 0 rgba(4, 7, 20, .5), 0 0 12px rgba(55, 242, 255, .45);
    }

    .scoreValue {
      position: relative;
      z-index: 1;
      margin-top: 0.25rem;
      font-size: clamp(2.75rem, 5.2vw, 5.75rem);
      line-height: .9;
      font-weight: 900;
      color: #ff66d9;
      text-shadow: 0 0 18px rgba(255, 43, 214, .85), 0 0 34px rgba(55, 242, 255, .28);
    }

    .scoreBest {
      position: relative;
      z-index: 1;
      margin-top: 0.5rem;
      font-size: clamp(1rem, 1.4vw, 1.35rem);
      font-weight: 900;
      letter-spacing: 0.12rem;
      color: #67f8ff;
      text-shadow: 0 0 12px rgba(55, 242, 255, .5);
    }

    .rankBox {
      position: relative;
      min-height: 15rem;
      max-height: min(23rem, calc(100vh - var(--dock-height) - 12rem));
      margin-top: auto;
      padding: 0.875rem;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-title {
      margin: 0 0 0.625rem;
      font-size: clamp(1.1rem, 1.8vw, 1.875rem);
    }

    .rankList {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 0.5rem;
      overflow: auto;
      padding-right: 0.2rem;
    }

    .rank-row {
      display: grid;
      grid-template-columns: 2rem 1fr minmax(3.5rem, 4.5rem);
      align-items: center;
      gap: 0.625rem;
      min-height: 2.375rem;
      padding: 0.45rem 0.625rem;
      border: var(--pixel-border-soft) solid rgba(89, 215, 255, .24);
      background: var(--pixel-surface-soft);
      color: #e7f6ff;
      border-radius: var(--pixel-radius-sm);
      box-shadow: var(--pixel-shadow-soft);
    }

    .rank-medal {
      display: grid;
      place-items: center;
      width: 1.75rem;
      height: 1.75rem;
      font-weight: 900;
      color: #250426;
      background: linear-gradient(180deg, #ffe76e, #ff7b21);
      box-shadow: 2px 2px 0 rgba(4, 7, 20, .36), 0 0 12px rgba(255, 231, 110, .42);
      clip-path: polygon(50% 0, 84% 16%, 100% 50%, 84% 84%, 50% 100%, 16% 84%, 0 50%, 16% 16%);
    }

    .rank-row:nth-child(2) .rank-medal {
      background: linear-gradient(180deg, #9ef2ff, #4f8fff);
    }

    .rank-row:nth-child(3) .rank-medal {
      background: linear-gradient(180deg, #ffbb8c, #ff6e6e);
    }

    .rank-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 700;
    }

    .rank-score {
      text-align: right;
      font-weight: 900;
      color: #ffe76e;
    }

    .rank-now {
      border-color: rgba(255, 102, 217, .55);
      box-shadow: inset 0 0 18px rgba(255, 43, 214, .16);
    }

    .dock-btn {
      appearance: none;
      border: var(--pixel-border-strong) solid rgba(107, 230, 255, .66);
      border-radius: var(--pixel-radius-md);
      color: #fff;
      cursor: pointer;
      background: var(--pixel-surface-soft);
      box-shadow: var(--pixel-shadow-hard);
      text-shadow: 2px 2px 0 rgba(4, 7, 20, .46);
    }

    .nextBox {
      padding: 0.875rem 1rem 1rem;
      min-height: 12.5rem;
    }

    #nextCanvas {
      position: relative;
      z-index: 1;
      display: block;
      width: min(11rem, 100%);
      height: auto;
      aspect-ratio: 1;
      margin: 0.375rem auto 0;
      filter: drop-shadow(0 0 18px rgba(55, 242, 255, .55));
      image-rendering: pixelated;
    }

    .timerBox {
      padding: 1rem;
      display: grid;
      justify-items: center;
      gap: 0.5rem;
    }

    .timerRing {
      position: relative;
      width: min(11rem, 100%);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, rgba(5, 13, 39, .96) 0 46%, transparent 47%),
        conic-gradient(from -90deg, rgba(55, 242, 255, .96) 0turn, rgba(255, 43, 214, .96) var(--cooldown-progress, 1turn), rgba(255,255,255,.08) var(--cooldown-progress, 1turn)),
        repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 2px, transparent 2px 6px);
      box-shadow: inset 0 0 30px rgba(95, 209, 255, .16), 3px 3px 0 rgba(4, 7, 20, .28), 0 0 26px rgba(55, 242, 255, .22);
    }

    .timerRing::before {
      content: "";
      position: absolute;
      inset: 0.95rem;
      border-radius: 50%;
      border: 0.625rem solid rgba(153, 214, 255, .18);
      box-shadow: inset 0 0 24px rgba(255, 43, 214, .18);
    }

    .timerValue {
      position: relative;
      z-index: 1;
      font-size: clamp(2rem, 4vw, 3.6rem);
      line-height: .9;
      font-weight: 900;
      color: #7df8ff;
      text-shadow: 2px 2px 0 rgba(4, 7, 20, .46), 0 0 14px rgba(55, 242, 255, .7);
    }

    .timerValue small {
      font-size: clamp(1rem, 1.8vw, 1.75rem);
      color: #d3dfff;
    }

    .timerLabel {
      position: relative;
      z-index: 1;
      margin-top: 0.25rem;
      font-size: clamp(1rem, 1.6vw, 1.5rem);
      font-weight: 800;
      color: #d9ccff;
    }

    .drawer {
      position: fixed;
      bottom: calc(var(--dock-height) + max(var(--space-3), env(safe-area-inset-bottom)));
      width: min(24rem, calc(100vw - 2 * var(--page-pad)));
      max-height: min(28rem, calc(100vh - var(--dock-height) - 8rem));
      padding: 1.1rem;
      z-index: 8;
      opacity: 0;
      transform: translateY(16px);
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
      overflow-x: hidden;
