  <script>
    "use strict";

    /**********************************************************************
     * 霓虹机械核心合成
     * 技术栈：HTML5 Canvas + Matter.js
     * 说明：本文件为完整单文件游戏，所有视觉元素均由 Canvas 绘制，无外部图片。
     **********************************************************************/

    // ------------------------- 广告预留钩子 -------------------------
    // 激励视频广告：真实接入广告 SDK 时，将这里替换为广告平台调用。
    // 返回 Promise 是为了方便在广告播放完成后执行复活逻辑。
    function triggerRewardedAd() {
      console.log("triggerRewardedAd：此处接入激励视频广告 SDK");
      return Promise.resolve(true);
    }

    // 插屏广告：每局重新开始前调用，真实上线时替换为广告平台 SDK。
    function triggerInterstitialAd() {
      console.log("triggerInterstitialAd：此处接入插屏广告 SDK");
    }

    // ===================== 合成音效引擎 (Web Audio API，零外部文件) =====================
    const SFX = (() => {
      let ctx = null, unlocked = false;

      function ac() {
        if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === "suspended") ctx.resume();
        return ctx;
      }

      // 首次用户交互时解锁 AudioContext
      function unlock() {
        if (unlocked) return;
        unlocked = true;
        ac().resume();
        if (bgmPending) { bgmPending = false; bgmStart(); }
      }
      ["click", "touchstart", "pointerdown", "keydown"].forEach(ev =>
        document.addEventListener(ev, unlock, { once: true })
      );

      // --- 底鼓 (Kick) ---
      function kick(volume = 0.55, pitch = 140) {
        const a = ac(), now = a.currentTime;
        const osc = a.createOscillator();
        const gain = a.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(pitch, now);
        osc.frequency.exponentialRampToValueAtTime(35, now + 0.08);
        gain.gain.setValueAtTime(volume, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        osc.connect(gain).connect(a.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      }

      // --- 军鼓 (Snare) ---
      function snare(volume = 0.35) {
        const a = ac(), now = a.currentTime;
        // 噪声层
        const len = a.sampleRate * 0.06;
        const buf = a.createBuffer(1, len, a.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.2);
        const noise = a.createBufferSource();
        noise.buffer = buf;
        const nGain = a.createGain();
        nGain.gain.setValueAtTime(volume * 0.7, now);
        nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        noise.connect(nGain).connect(a.destination);
        noise.start(now);
        // 音调层
        const osc = a.createOscillator();
        const gGain = a.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.06);
        gGain.gain.setValueAtTime(volume * 0.5, now);
        gGain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.connect(gGain).connect(a.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      }

      // --- 合成升调 (用于合成升级) ---
      function synthRise(volume = 0.5, baseFreq = 300, duration = 0.3) {
        const a = ac(), now = a.currentTime;
        const osc = a.createOscillator();
        const gain = a.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(baseFreq, now);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 2.8, now + duration);
        gain.gain.setValueAtTime(volume, now);
        gain.gain.linearRampToValueAtTime(volume * 0.6, now + duration * 0.4);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        const filter = a.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(baseFreq * 1.6, now);
        filter.frequency.exponentialRampToValueAtTime(baseFreq * 4, now + duration);
        osc.connect(filter).connect(gain).connect(a.destination);
        osc.start(now);
        osc.stop(now + duration + 0.05);
      }

      // --- 高音叮当 (用于投放 / 复活) ---
      function ding(volume = 0.4, freq = 880, duration = 0.12) {
        const a = ac(), now = a.currentTime;
        const osc = a.createOscillator();
        const gain = a.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(volume, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc.connect(gain).connect(a.destination);
        osc.start(now);
        osc.stop(now + duration + 0.02);
      }

      // --- 警告蜂鸣 (警戒线) ---
      function warn(volume = 0.3) {
        const a = ac(), now = a.currentTime;
        for (let i = 0; i < 3; i++) {
          const osc = a.createOscillator();
          const gain = a.createGain();
          osc.type = "square";
          osc.frequency.setValueAtTime(220 + i * 30, now + i * 0.15);
          gain.gain.setValueAtTime(volume * (1 - i * 0.2), now + i * 0.15);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.15 + 0.08);
          osc.connect(gain).connect(a.destination);
          osc.start(now + i * 0.15);
          osc.stop(now + i * 0.15 + 0.1);
        }
      }

      // --- Game Over 低沉下降 ---
      function gameOverSound() {
        const a = ac(), now = a.currentTime;
        const osc = a.createOscillator();
        const gain = a.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.8);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.linearRampToValueAtTime(0.2, now + 0.3);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
        const filter = a.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(800, now);
        filter.frequency.exponentialRampToValueAtTime(120, now + 0.7);
        osc.connect(filter).connect(gain).connect(a.destination);
        osc.start(now);
        osc.stop(now + 1.2);
      }

      // --- 碰撞合成爆炸音 (粒子爆发时的音效) ---
      function explosion(volume = 0.5, pitch = 200) {
        const a = ac(), now = a.currentTime;
        // 白噪声瞬间爆发
        const len = a.sampleRate * 0.12;
        const buf = a.createBuffer(1, len, a.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 0.7);
        const noise = a.createBufferSource();
        noise.buffer = buf;
        const nGain = a.createGain();
        nGain.gain.setValueAtTime(volume * 0.8, now);
        nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        noise.connect(nGain).connect(a.destination);
        noise.start(now);
        // 低频底鼓叠加
        const osc = a.createOscillator();
        const gGain = a.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(pitch, now);
        osc.frequency.exponentialRampToValueAtTime(45, now + 0.15);
        gGain.gain.setValueAtTime(volume * 0.6, now);
        gGain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.connect(gGain).connect(a.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      }

      // --- UI 点击声 ---
      function uiClick() {
        ding(0.25, 1200, 0.06);
      }

      let bgmSource = null;
      let bgmGain = null;

      // --- BGM 循环播放 ---
      let bgmPending = false;
      function bgmStart() {
        if (!ctx || ctx.state !== "running") { bgmPending = true; return; }
        try {
          bgmStop();
          if (!bgmGain) { bgmGain = ac().createGain(); bgmGain.gain.value = 0.42; bgmGain.connect(ac().destination); SFX.bgmGain = bgmGain; }
          const audio = new Audio("music/bgm01.mp3");
          audio.loop = true;
          audio.crossOrigin = "anonymous";
          const source = ac().createMediaElementSource(audio);
          source.connect(bgmGain);
          bgmSource = { audio, source };
          audio.play().catch(() => {});
        } catch (e) { console.warn("BGM 加载失败", e); }
      }

      function bgmStop() {
        if (bgmSource) {
          try { bgmSource.audio.pause(); bgmSource.audio.currentTime = 0; } catch (e) {}
          try { bgmSource.source.disconnect(); } catch (e) {}
          bgmSource = null;
        }
      }

      // --- 对外接口 ---
      return {
        init() { unlock(); },
        drop() { kick(0.5, 130); ding(0.3, 660, 0.08); },
        merge(level) {
          const p = 280 + level * 40;
          explosion(0.55, p);
          synthRise(0.45, p * 0.8, 0.25);
        },
        wallHit() { snare(0.25); },
        warn() { warn(); },
        gameOver() { bgmStop(); gameOverSound(); },
        revive() { synthRise(0.55, 350, 0.45); ding(0.5, 1200, 0.15); },
        restart() { ding(0.3, 990, 0.1); bgmStart(); },
        uiClick,
        bgmGain: null
      };
    })();

    // ------------------------- Matter.js 模块别名 -------------------------
    const { Engine, World, Bodies, Body, Events, Composite } = Matter;
    const PROFILE_KEY = "classic-snake-girl-profile-v1";
    const GAME_THEME_CLASS_MAP = Object.freeze({
      "theme-neon": "",
      "theme-sunset": "theme-sunset",
      "theme-ice": "theme-ice",
      "theme-aurora": "theme-aurora"
    });

    const bgVideo = document.querySelector(".bg-video");
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const bestScoreEl = document.getElementById("bestScore");
    const rankListEl = document.getElementById("rankList");
    const nextCanvas = document.getElementById("nextCanvas");
    const nextCtx = nextCanvas.getContext("2d");
    const coreGalleryEl = document.getElementById("coreGallery");
    const coreNameEl = document.getElementById("coreName");
    const coreValueEl = document.getElementById("coreValue");
    const filterBtns = document.querySelectorAll(".filter-tabs button");
    const modal = document.getElementById("gameOverModal");
    const finalText = document.getElementById("finalText");
    const reviveBtn = document.getElementById("reviveBtn");
    const restartBtn = document.getElementById("restartBtn");
    const bgmSlider = document.getElementById("bgmSlider");
    const cooldownRingEl = document.getElementById("cooldownRing");
    const cooldownValueEl = document.getElementById("cooldownValue");
    const orientationGuard = document.getElementById("orientationGuard");
    const homeLink = document.querySelector(".home-link");
    const settingsBtn = document.getElementById("settingsBtn");
    const galleryBtn = document.getElementById("galleryBtn");
    const settingsDrawer = document.getElementById("settingsDrawer");
    const galleryDrawer = document.getElementById("galleryDrawer");
    const drawerRestartBtn = document.getElementById("drawerRestartBtn");

    let W = 0;
    let H = 0;
    let DPR = 1;
    let engine;
    let world;
    let walls = [];
    let cores = [];
    let particles = [];
    let score = 0;
    let gameOver = false;
    let dangerStart = 0;
    let dangerPlayed = false;
    let lastTime = 0;
    let dropX = 0;
    let currentLevel = 0;
    let nextLevel = 0;
    let canDrop = true;
    let mergeLock = new Set();
    let physicsAccumulator = 0;
    let selectedCoreLevel = 0;
    let galleryFilter = "all";
    let scaledTypes = [];
    let coreSpriteCache = new Map();
    let profile = loadProfile();
    let bestScore = Number(localStorage.getItem("neonCoreBest") || 0);
    let scoreUIScheduled = false;
    let rankUIScheduled = false;
    let pendingPointerX = null;
    let pointerMoveScheduled = false;
    let dropInterval = 460;
    let dropsThisRun = 0;
    let settledScoreThisRun = 0;
    let runCountedThisRun = false;

    // 性能关键参数：限制单帧物理步数、粒子数量和场上刚体数量，避免连续点击造成 CPU 峰值。
    const FIXED_STEP = 1000 / 60;
    const MAX_PHYSICS_STEPS = 2;
    const BASE_DROP_INTERVAL = 460;
    const STARTER_BAG_PROTECTED_DROPS = 6;
    const BASE_DANGER_DURATION = 3000;
    const WARNING_BUFFER_DURATION = 3800;
    const CREDIT_BOOST_MULTIPLIER = 1.15;
    const MERGE_BONUS_MULTIPLIER = 1.2;
    const MAX_PARTICLES = 150;
    const MAX_CORES = 90;
    const PLAYFIELD_DESIGN_WIDTH = 512;
    const PLAYFIELD_DESIGN_HEIGHT = 416;
    let lastDropTime = 0;

    const coreNames = ["起始核心", "棱镜核心", "脉冲核心", "裂变核心", "星环核心", "光锥核心", "量子核心", "超导核心", "星耀核心", "终极核心"];
    const rankBase = [
      { name: "星影", score: 2128 },
      { name: "赛博玩家", score: 2050 },
      { name: "未来果王", score: 1974 },
      { name: "终极玩家", score: 1860 }
    ];

    // 游戏主容器优先保持固定设计尺寸，仅在极小屏幕下做安全兜底。
    const layout = {
      left: 0,
      right: 0,
      top: 0,
      bottom: 0,
      width: 0,
      height: 0,
      warningY: 0,
      spawnY: 0
    };

    // 不同等级“机械核心”的配置：半径、边数、颜色、得分。
    const coreTypes = [
      { r: 18, sides: 32, c1: "#00f6ff", c2: "#176bff", glow: "#00f6ff", score: 1 },
      { r: 24, sides: 5,  c1: "#7cff6b", c2: "#00b86b", glow: "#7cff6b", score: 3 },
      { r: 30, sides: 6,  c1: "#fff45f", c2: "#ff9d00", glow: "#fff45f", score: 6 },
      { r: 38, sides: 7,  c1: "#ff7a2b", c2: "#ff234f", glow: "#ff552f", score: 10 },
      { r: 47, sides: 8,  c1: "#ff2bd6", c2: "#7d2bff", glow: "#ff2bd6", score: 15 },
      { r: 58, sides: 9,  c1: "#b387ff", c2: "#311cff", glow: "#9c7cff", score: 21 },
      { r: 70, sides: 10, c1: "#5bffea", c2: "#0077ff", glow: "#5bffea", score: 28 },
      { r: 84, sides: 11, c1: "#ff9df2", c2: "#ff2b60", glow: "#ff9df2", score: 36 },
      { r: 100, sides: 12, c1: "#ffffff", c2: "#00f6ff", glow: "#ffffff", score: 45 },
      { r: 118, sides: 14, c1: "#fff45f", c2: "#ff2bd6", glow: "#fff45f", score: 66 }
    ];

    function createDefaultProfile() {
      const stamp = getTodayStamp();
      return {
        credits: 0,
        lifetimeScore: 0,
        lastRunScore: 0,
        bestScore: 0,
        totalRuns: 0,
        totalPurchases: 0,
        activeThemeId: "theme-neon",
        ownedThemes: { "theme-neon": true },
        upgrades: { cooling: false, mergeBonus: false, creditBoost: false, warningBuffer: false, starterBag: false },
        inventory: { reviveChip: 0 },
        daily: {
          stamp,
          rewards: {},
          tasks: {},
          rewardClaims: 0,
          taskClaims: 0,
          runs: 0,
          totalScore: 0,
          bestScore: 0,
          purchases: 0
        }
      };
    }

    function getTodayStamp() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, "0");
      const dd = String(now.getDate()).padStart(2, "0");
      return `${yyyy}-${mm}-${dd}`;
    }

    function loadProfile() {
      const fallback = createDefaultProfile();
      try {
        const raw = localStorage.getItem(PROFILE_KEY);
        const parsed = raw ? JSON.parse(raw) : {};
        const next = {
          ...fallback,
          ...parsed,
          ownedThemes: { ...fallback.ownedThemes, ...(parsed.ownedThemes || {}) },
          upgrades: { ...fallback.upgrades, ...(parsed.upgrades || {}) },
          inventory: { ...fallback.inventory, ...(parsed.inventory || {}) },
          daily: {
            ...fallback.daily,
            ...(parsed.daily || {}),
            rewards: { ...fallback.daily.rewards, ...((parsed.daily && parsed.daily.rewards) || {}) },
            tasks: { ...fallback.daily.tasks, ...((parsed.daily && parsed.daily.tasks) || {}) }
          }
        };

        if (!next.ownedThemes[next.activeThemeId]) next.activeThemeId = "theme-neon";

        const today = getTodayStamp();
        if (next.daily.stamp !== today) {
          next.daily = { ...fallback.daily, stamp: today };
        }

        return next;
      } catch (error) {
        console.warn("成长档案读取失败，将使用默认配置。", error);
        return fallback;
      }
    }

    function saveProfile() {
      localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
    }

    function getThemeLogStore() {
      if (!window.__classicSnakeGirlThemeLogs) window.__classicSnakeGirlThemeLogs = [];
      return window.__classicSnakeGirlThemeLogs;
    }

    function logThemeEvent(level, message, detail = {}) {
      const entry = {
        time: new Date().toISOString(),
        level,
        message,
        detail,
        source: "game"
      };
      getThemeLogStore().push(entry);
      const logger = typeof console[level] === "function" ? console[level] : console.log;
      logger(`[Theme][Game] ${message}`, detail);
    }

    function applyGameplayTheme(reason = "runtime") {
      try {
        const themeId = GAME_THEME_CLASS_MAP[profile.activeThemeId] !== undefined ? profile.activeThemeId : "theme-neon";
        document.body.classList.remove("theme-sunset", "theme-ice", "theme-aurora");
        const themeClass = GAME_THEME_CLASS_MAP[themeId];
        if (themeClass) document.body.classList.add(themeClass);
        document.body.dataset.activeTheme = themeId;
        logThemeEvent("info", "游戏页主题应用完成。", { themeId, reason });
      } catch (error) {
        document.body.classList.remove("theme-sunset", "theme-ice", "theme-aurora");
        document.body.dataset.activeTheme = "theme-neon";
        logThemeEvent("error", "游戏页主题应用失败，已回退默认主题。", {
          reason,
          error: error && error.message ? error.message : String(error)
        });
      }
    }

    function refreshGameplayProfile() {
      profile = loadProfile();
      dropInterval = profile.upgrades.cooling ? 420 : BASE_DROP_INTERVAL;
      applyGameplayTheme("refresh-profile");
      bestScore = Math.max(Number(profile.bestScore || 0), Number(localStorage.getItem("neonCoreBest") || 0));
      bestScoreEl.textContent = String(bestScore);
      updateReviveButton();
    }

    function updateReviveButton() {
      if (!reviveBtn) return;
      const chipCount = Number(profile.inventory.reviveChip || 0);
      reviveBtn.textContent = chipCount > 0
        ? `消耗复活芯片复活（库存 ${chipCount}）`
        : "观看广告复活：清除顶部 3 个障碍物";
    }

    function calculateRunCredits(finalScore) {
      const baseCredits = Math.max(0, Math.round(finalScore));
      return profile.upgrades.creditBoost
        ? Math.round(baseCredits * CREDIT_BOOST_MULTIPLIER)
        : baseCredits;
    }

    function getDangerDuration() {
      return profile.upgrades.warningBuffer ? WARNING_BUFFER_DURATION : BASE_DANGER_DURATION;
    }

    function getUnlockedTaskHints(finalScore) {
      const unlocked = [];
      if (finalScore >= 3000) unlocked.push("3000 分任务");
      if (finalScore >= 5000) unlocked.push("5000 分任务");
      if (finalScore >= 8000) unlocked.push("8000 分任务");
      return unlocked;
    }

    function settleRunIfNeeded() {
      if (runCountedThisRun) return settledScoreThisRun;
      profile = loadProfile();
      const finalScore = Math.max(0, Math.round(score));
      const earnedCredits = calculateRunCredits(finalScore);

      settledScoreThisRun = earnedCredits;
      runCountedThisRun = true;
      profile.credits += earnedCredits;
      profile.lastRunScore = finalScore;
      profile.lifetimeScore += finalScore;
      profile.bestScore = Math.max(Number(profile.bestScore || 0), finalScore);
      profile.totalRuns = Number(profile.totalRuns || 0) + 1;
      profile.daily.runs = Number(profile.daily.runs || 0) + 1;
      profile.daily.totalScore = Number(profile.daily.totalScore || 0) + finalScore;
      profile.daily.bestScore = Math.max(Number(profile.daily.bestScore || 0), finalScore);

      bestScore = Math.max(bestScore, profile.bestScore);
      bestScoreEl.textContent = String(bestScore);
      localStorage.setItem("neonCoreBest", String(bestScore));
      saveProfile();
      updateReviveButton();
      return earnedCredits;
    }

    function clearTopObstacles() {
      const topBodies = [...cores].sort((a, b) => a.position.y - b.position.y).slice(0, 3);
      for (const body of topBodies) {
        spawnParticles(body.position.x, body.position.y, scaledType(body.plugin.level).glow, 18);
        removeCore(body);
      }
    }

    // ------------------------- 初始化与自适应 -------------------------
    init();

    function init() {
      setupBackgroundVideo();
      applyLandscapeGuard();
      preventMobileGestures();
      setupInput();
      setupGalleryUI();
      setupChromeUI();
      refreshGameplayProfile();
      restartGame(false);
      // BGM 音量滑块
      bgmSlider.addEventListener("input", () => {
        const v = bgmSlider.value / 100;
        if (SFX.bgmGain) SFX.bgmGain.gain.value = v;
      });
      requestAnimationFrame(loop);
    }

    function markBackgroundVideoReady() {
      document.body.classList.add("bg-video-ready");
    }

    function ensureBackgroundVideoPlayback() {
      if (!bgVideo) return;
      bgVideo.muted = true;
      bgVideo.defaultMuted = true;
      bgVideo.autoplay = true;
      bgVideo.loop = true;
      bgVideo.playsInline = true;
      const playAttempt = bgVideo.play();
      if (playAttempt && typeof playAttempt.catch === "function") {
        playAttempt.catch(() => {
          // Keep fallback background when autoplay is blocked by the environment.
        });
      }
    }

    function setupBackgroundVideo() {
      if (!bgVideo) return;

      bgVideo.addEventListener("loadeddata", markBackgroundVideoReady);
      bgVideo.addEventListener("canplay", markBackgroundVideoReady);
      bgVideo.addEventListener("playing", markBackgroundVideoReady);
      bgVideo.addEventListener("error", () => {
        document.body.classList.remove("bg-video-ready");
      });

      bgVideo.load();
      ensureBackgroundVideoPlayback();

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) ensureBackgroundVideoPlayback();
      });
      window.addEventListener("pageshow", ensureBackgroundVideoPlayback);
    }

    function resizeCanvas() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = Math.floor(W * DPR);
      canvas.height = Math.floor(H * DPR);
      canvas.style.width = W + "px";
      canvas.style.height = H + "px";
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

      const root = document.documentElement;
      const isMobile = W < 768;
      const isTablet = W >= 768 && W < 1200;
      const isCompactMobile = isMobile && (W > H || H < 500);
      const pagePad = isCompactMobile ? 8 : (isMobile ? 12 : isTablet ? 16 : 20);
      const sideTarget = isCompactMobile
        ? clamp(W * 0.11, 72, 104)
        : (isMobile ? 0 : (isTablet ? clamp(W * 0.16, 132, 190) : clamp(W * 0.16, 220, 304)));
      const gapAllowance = isCompactMobile ? 12 : ((isMobile && !isCompactMobile) ? 0 : 24);
      const maxContainerWidth = Math.max(isMobile ? 280 : 320, W - pagePad * 2 - sideTarget * 2 - gapAllowance);
      const minContainerWidth = Math.min(maxContainerWidth, isMobile ? 280 : (isTablet ? 340 : 420));
      const containerWidth = clamp(
        PLAYFIELD_DESIGN_WIDTH,
        minContainerWidth,
        Math.min(PLAYFIELD_DESIGN_WIDTH, maxContainerWidth)
      );

      layout.left = (W - containerWidth) / 2;
      layout.right = layout.left + containerWidth;

      const topReserve = isCompactMobile
        ? clamp(H * 0.16, 58, 74)
        : (isMobile
          ? clamp(H * 0.28, 168, 220)
          : (isTablet ? clamp(H * 0.18, 112, 160) : clamp(H * 0.14, 104, 148)));
      const bottomReserve = isCompactMobile
        ? clamp(H * 0.19, 68, 88)
        : (isMobile
          ? clamp(H * 0.31, 208, 286)
          : (isTablet ? clamp(H * 0.22, 168, 220) : clamp(H * 0.24, 190, 260)));
      const minTop = isCompactMobile ? 58 : (isMobile ? 104 : 88);
      const maxArenaSpace = Math.max(isCompactMobile ? 170 : 220, H - bottomReserve - minTop);
      const minArenaHeight = isCompactMobile ? 170 : (isMobile ? 220 : (isTablet ? 300 : 360));
      const arenaHeight = clamp(
        PLAYFIELD_DESIGN_HEIGHT,
        Math.min(minArenaHeight, maxArenaSpace),
        Math.min(PLAYFIELD_DESIGN_HEIGHT, maxArenaSpace)
      );

      layout.top = Math.max(minTop, Math.min(topReserve, H - bottomReserve - arenaHeight));
      layout.bottom = layout.top + arenaHeight;
      layout.width = layout.right - layout.left;
      layout.height = layout.bottom - layout.top;
      layout.warningY = Math.max(72, layout.top - (isMobile ? 24 : 34));
      layout.spawnY = Math.max(56, layout.top - (isCompactMobile ? 34 : (isMobile ? 42 : 58)));
      dropX = clamp(dropX || W / 2, layout.left + 25, layout.right - 25);

      const leftSpace = Math.max(0, layout.left - pagePad);
      const rightSpace = Math.max(0, W - layout.right - pagePad);
      const leftSideWidth = isCompactMobile
        ? clamp(leftSpace, 72, 104)
        : (isMobile ? W - pagePad * 2 : clamp(leftSpace, isTablet ? 132 : 220, isTablet ? 190 : 304));
      const rightSideWidth = isCompactMobile
        ? clamp(rightSpace, 72, 104)
        : (isMobile ? W - pagePad * 2 : clamp(rightSpace, isTablet ? 132 : 220, isTablet ? 190 : 304));
      const sideWidth = Math.min(leftSideWidth, rightSideWidth);
      const landscapeTight = isCompactMobile && (H <= 430 || W <= 740 || Math.min(leftSpace, rightSpace) <= 104);
      const logoWidth = isMobile ? Math.min(containerWidth * 0.92, W - pagePad * 2) : Math.min(containerWidth * 0.9, 416);
      const progressWidth = Math.min(containerWidth + ((isMobile && !isCompactMobile) ? 0 : 72), W - pagePad * 2);
      const bottomDockWidth = landscapeTight
        ? Math.min(containerWidth + 16, W - pagePad * 2)
        : ((isMobile && !isCompactMobile)
          ? W - pagePad * 2
          : Math.min(containerWidth + sideWidth * 1.65, W - pagePad * 2));

      root.style.setProperty("--page-pad", `${pagePad}px`);
      root.style.setProperty("--playfield-left", `${layout.left}px`);
      root.style.setProperty("--playfield-right", `${layout.right}px`);
      root.style.setProperty("--playfield-top", `${layout.top}px`);
      root.style.setProperty("--playfield-bottom", `${layout.bottom}px`);
      root.style.setProperty("--playfield-width", `${layout.width}px`);
      root.style.setProperty("--playfield-height", `${layout.height}px`);
      root.style.setProperty("--hud-side-width", `${sideWidth}px`);
      root.style.setProperty("--hud-left-width", `${leftSideWidth}px`);
      root.style.setProperty("--hud-right-width", `${rightSideWidth}px`);
      root.style.setProperty("--hud-logo-width", `${logoWidth}px`);
      root.style.setProperty("--hud-progress-width", `${progressWidth}px`);
      root.style.setProperty("--bottom-dock-width", `${bottomDockWidth}px`);
      document.body.classList.toggle("landscape-tight", landscapeTight);
      rebuildScaledTypes();
      rebuildBackgroundCache();
    }

    window.addEventListener("resize", () => {
      applyLandscapeGuard();
      resizeCanvas();
      rebuildWalls();
    }, { passive: false });

    window.addEventListener("orientationchange", applyLandscapeGuard);

    function getViewportSize() {
      const viewport = window.visualViewport;
      return {
        width: viewport ? viewport.width : window.innerWidth,
        height: viewport ? viewport.height : window.innerHeight
      };
    }

    function shouldRequireLandscape() {
      const { width, height } = getViewportSize();
      const coarsePointer = window.matchMedia("(pointer: coarse)").matches || ("ontouchstart" in window);
      const mobileViewport = Math.min(width, height) <= 1024;
      return coarsePointer && mobileViewport && height > width;
    }

    function applyLandscapeGuard() {
      const required = shouldRequireLandscape();
      document.body.classList.toggle("landscape-required", required);
      if (orientationGuard) {
        orientationGuard.setAttribute("aria-hidden", required ? "false" : "true");
      }
    }

    function restartGame(withAd = true) {
      if (gameOver && !runCountedThisRun) settleRunIfNeeded();
      refreshGameplayProfile();
      localStorage.setItem("neonCoreBest", String(bestScore));
      if (withAd) triggerInterstitialAd();

      resizeCanvas();
      engine = Engine.create({ enableSleeping: true });
      world = engine.world;
      world.gravity.y = 1.15;
      world.gravity.scale = 0.001;

      cores = [];
      particles = [];
      walls = [];
      score = 0;
      gameOver = false;
      dangerStart = 0;
      dangerPlayed = false;
      canDrop = true;
      physicsAccumulator = 0;
      lastDropTime = 0;
      dropsThisRun = 0;
      settledScoreThisRun = 0;
      runCountedThisRun = false;
      mergeLock.clear();
      currentLevel = randomNextLevel(0);
      nextLevel = randomNextLevel(1);
      dropX = W / 2;
      scoreEl.textContent = "0";
      updateRankUI();
      updateNextPreview();
      renderGallery();
      updateCooldownUI();
      modal.classList.remove("show");
      closeDrawers();

      rebuildWalls();
      bindCollision();
      SFX.restart();
    }

    function leaveToHome() {
      if (gameOver && !runCountedThisRun) settleRunIfNeeded();
      window.location.href = homeLink.getAttribute("href") || "home.html";
    }

    function setupChromeUI() {
      if (homeLink) {
        homeLink.addEventListener("click", (e) => {
          e.preventDefault();
          SFX.uiClick();
          leaveToHome();
        });

        homeLink.addEventListener("pointerup", (e) => {
          if (e.pointerType === "mouse") return;
          e.preventDefault();
          SFX.uiClick();
          leaveToHome();
        });
      }

      if (drawerRestartBtn) {
        drawerRestartBtn.addEventListener("click", () => {
          SFX.uiClick();
          closeDrawers();
          restartGame(true);
        });
      }

      if (settingsBtn) {
        settingsBtn.addEventListener("click", () => {
          SFX.uiClick();
          toggleDrawer(settingsDrawer);
        });
      }

      if (galleryBtn) {
        galleryBtn.addEventListener("click", () => {
          SFX.uiClick();
          toggleDrawer(galleryDrawer);
        });
      }
    }

    function toggleDrawer(target) {
      const drawers = [settingsDrawer, galleryDrawer];
      drawers.forEach((drawer) => {
        if (!drawer) return;
        const shouldShow = drawer === target && !drawer.classList.contains("show");
        drawer.classList.toggle("show", shouldShow);
      });
    }

    function closeDrawers() {
      [settingsDrawer, galleryDrawer].forEach((drawer) => {
        if (drawer) drawer.classList.remove("show");
      });
    }

    function updateCooldownUI(now = performance.now()) {
      if (!cooldownRingEl || !cooldownValueEl) return;
      const remain = Math.max(0, dropInterval - (now - lastDropTime));
      const ratio = canDrop ? 1 : clamp(1 - remain / dropInterval, 0, 1);
      cooldownRingEl.style.setProperty("--cooldown-progress", `${Math.max(0.05, ratio)}turn`);
      cooldownValueEl.innerHTML = `${(remain / 1000).toFixed(1)}<small>s</small>`;
    }

    function rebuildWalls() {
      if (!world) return;
      for (const wall of walls) World.remove(world, wall);
      walls = [];

      const t = 60;
      const floor = Bodies.rectangle(W / 2, layout.bottom + t / 2, layout.width, t, { isStatic: true, label: "wall" });
      const left = Bodies.rectangle(layout.left - t / 2, H / 2, t, H * 2, { isStatic: true, label: "wall" });
      const right = Bodies.rectangle(layout.right + t / 2, H / 2, t, H * 2, { isStatic: true, label: "wall" });
      walls = [floor, left, right];
      World.add(world, walls);
    }

    // ------------------------- 输入控制：鼠标 + 触摸 -------------------------
    function setupInput() {
      const move = (clientX) => {
        if (gameOver) return;
        dropX = clamp(clientX, layout.left + 24, layout.right - 24);
      };

      const release = () => {
        if (!gameOver) dropCore();
      };

      canvas.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        closeDrawers();
        move(e.clientX);
      }, { passive: false });

      canvas.addEventListener("pointermove", (e) => {
        pendingPointerX = e.clientX;
        if (!pointerMoveScheduled) {
          pointerMoveScheduled = true;
          requestAnimationFrame(() => {
            pointerMoveScheduled = false;
            if (pendingPointerX !== null) move(pendingPointerX);
          });
        }
      }, { passive: true });

      canvas.addEventListener("pointerup", (e) => {
        e.preventDefault();
        move(e.clientX);
        release();
      }, { passive: false });

      canvas.addEventListener("pointercancel", (e) => e.preventDefault(), { passive: false });
    }

    function preventMobileGestures() {
      const allowNativeTouch = (target) => target instanceof Element && !!target.closest("a, button, input, label");

      // 阻止移动端滚动、橡皮筋、双击缩放等默认行为。
      document.addEventListener("touchstart", (e) => {
        if (allowNativeTouch(e.target)) return;
        e.preventDefault();
      }, { passive: false });
      document.addEventListener("touchmove", (e) => {
        if (allowNativeTouch(e.target)) return;
        e.preventDefault();
      }, { passive: false });
      document.addEventListener("gesturestart", (e) => e.preventDefault(), { passive: false });

      let lastTouchEnd = 0;
      document.addEventListener("touchend", (e) => {
        if (allowNativeTouch(e.target)) return;
        const now = Date.now();
        if (now - lastTouchEnd <= 320) e.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });
    }

    // ------------------------- 核心生成、碰撞、合成 -------------------------
    function dropCore() {
      const now = performance.now();
      if (!canDrop || cores.length >= MAX_CORES || now - lastDropTime < dropInterval) return;

      canDrop = false;
      lastDropTime = now;
      updateCooldownUI(now);
      SFX.drop();
      createCore(currentLevel, dropX, layout.spawnY, false);
      dropsThisRun += 1;
      currentLevel = nextLevel;
      nextLevel = randomNextLevel(1);
      updateNextPreview();
      setTimeout(() => {
        canDrop = true;
        updateCooldownUI();
      }, dropInterval);
    }

    function createCore(level, x, y, isMerged) {
      const cfg = scaledType(level);
      const body = Bodies.circle(x, y, cfg.r, {
        restitution: 0.18,
        friction: 0.45,
        frictionAir: 0.012,
        density: 0.0016 + level * 0.00018,
        sleepThreshold: 45,
        label: "core"
      }, 16);

      body.plugin.level = level;
      body.plugin.radius = cfg.r;
      body.plugin.birth = performance.now();
      body.plugin.mergedFlash = isMerged ? 1 : 0;
      cores.push(body);
      World.add(world, body);
      return body;
    }

    function bindCollision() {
      Events.on(engine, "collisionStart", (event) => {
        if (gameOver) return;

        for (const pair of event.pairs) {
          const a = pair.bodyA;
          const b = pair.bodyB;

          // 碰撞墙壁音效
          if ((a.label === "wall" && b.label === "core") || (a.label === "core" && b.label === "wall")) {
            SFX.wallHit();
            continue;
          }

          if (a.label !== "core" || b.label !== "core") continue;
          if (a.plugin.level !== b.plugin.level) continue;
          if (a.plugin.level >= coreTypes.length - 1) continue;
          if (mergeLock.has(a.id) || mergeLock.has(b.id)) continue;

          mergeLock.add(a.id);
          mergeLock.add(b.id);
          mergeCores(a, b);
        }
      });
    }

    function mergeCores(a, b) {
      const level = a.plugin.level;
      const x = (a.position.x + b.position.x) / 2;
      const y = (a.position.y + b.position.y) / 2;
      const vx = (a.velocity.x + b.velocity.x) / 2;
      const vy = (a.velocity.y + b.velocity.y) / 2;

      removeCore(a);
      removeCore(b);
      spawnParticles(x, y, scaledType(level).glow, 26 + level * 4);

      const next = createCore(level + 1, x, y, true);
      Body.setVelocity(next, { x: vx * 0.55, y: vy * 0.55 - 1.4 });

      const baseMergeScore = scaledType(level + 1).score * 10;
      score += profile.upgrades.mergeBonus
        ? Math.round(baseMergeScore * MERGE_BONUS_MULTIPLIER)
        : baseMergeScore;
      SFX.merge(level);
      updateScoreUI();
    }

    function removeCore(body) {
      const index = cores.indexOf(body);
      if (index !== -1) {
        const last = cores.pop();
        if (index < cores.length) cores[index] = last;
      }
      World.remove(world, body);
      mergeLock.delete(body.id);
    }

    function randomNextLevel(previewOffset = 0) {
      if (profile.upgrades.starterBag && dropsThisRun + previewOffset < STARTER_BAG_PROTECTED_DROPS) {
        const safeBag = [0, 0, 0, 1, 1, 1, 0, 1];
        return safeBag[Math.floor(Math.random() * safeBag.length)];
      }

      // 常规投放池保留少量中阶核心，避免节奏过慢，同时不直接跳到高阶。
      const bag = [0, 0, 0, 0, 1, 1, 1, 2, 2, 3];
      return bag[Math.floor(Math.random() * bag.length)];
    }

    function scaledType(level) {
      return scaledTypes[level] || coreTypes[level];
    }

    function rebuildScaledTypes() {
      const areaShrinkScale = Math.sqrt(2 / 3);
      const scale = clamp(W / 430, 0.78, 1.08) * Math.sqrt(1.5) * areaShrinkScale;
      scaledTypes = coreTypes.map((base) => ({ ...base, r: base.r * scale }));
      coreSpriteCache.clear();
    }

    // ------------------------- Game Over 与复活 -------------------------
    function checkGameOver(now) {
      if (gameOver) return;

      let overLine = false;
      for (const body of cores) {
        const age = now - body.plugin.birth;
        const slow = Math.abs(body.velocity.y) < 0.45 && Math.abs(body.velocity.x) < 0.55;
        if (age > 900 && slow && body.position.y - body.plugin.radius < layout.warningY) {
          overLine = true;
          break;
        }
      }

      if (overLine) {
        if (!dangerStart) {
          dangerStart = now;
          dangerPlayed = false;
        }
        if (now - dangerStart > 600 && !dangerPlayed) {
          dangerPlayed = true;
          SFX.warn();
        }
        if (now - dangerStart > getDangerDuration()) showGameOver();
      } else {
        dangerStart = 0;
      }
    }

    function showGameOver() {
      gameOver = true;
      SFX.gameOver();
      const earnedCredits = calculateRunCredits(score);
      const unlockedTaskHints = getUnlockedTaskHints(score);
      const taskHintText = unlockedTaskHints.length
        ? ` 已解锁 ${unlockedTaskHints.join("、")} 的领取条件。`
        : "";
      localStorage.setItem("neonCoreBest", String(bestScore));
      finalText.textContent = `最终得分：${score}，结束本局可结算 ${earnedCredits} 积分${profile.upgrades.creditBoost ? "（已含 +15% 结算增幅）" : ""}。返回主页或重新开始后会同步更新任务与商店。${taskHintText}`;
      updateReviveButton();
      modal.classList.add("show");
    }

    function reviveByAd() {
      const chipCount = Number(profile.inventory.reviveChip || 0);
      const finishRevive = () => {
        clearTopObstacles();
        gameOver = false;
        dangerStart = 0;
        dangerPlayed = false;
        SFX.revive();
        modal.classList.remove("show");
      };

      if (chipCount > 0) {
        profile.inventory.reviveChip = chipCount - 1;
        saveProfile();
        updateReviveButton();
        finishRevive();
        return;
      }

      triggerRewardedAd().then((ok) => {
        if (!ok) return;
        finishRevive();
      });
    }

    reviveBtn.addEventListener("click", reviveByAd);
    restartBtn.addEventListener("click", () => restartGame(true));

    // ------------------------- 粒子爆炸 -------------------------
    function spawnParticles(x, y, color, count) {
      const available = Math.max(0, MAX_PARTICLES - particles.length);
      count = Math.min(count, available);
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 6;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          decay: 0.018 + Math.random() * 0.02,
          size: 2 + Math.random() * 4,
          color
        });
      }
    }

    function updateParticles() {
      let write = 0;
      for (let read = 0; read < particles.length; read++) {
        const p = particles[read];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.06;
        p.vx *= 0.985;
        p.vy *= 0.985;
        p.life -= p.decay;
        if (p.life > 0) particles[write++] = p;
      }
      particles.length = write;
    }

    // ------------------------- 渲染循环 -------------------------
    function loop(now) {
      const frameTime = Math.min(now - lastTime || FIXED_STEP, 50);
      lastTime = now;
      physicsAccumulator += frameTime;

      let steps = 0;
      while (!gameOver && physicsAccumulator >= FIXED_STEP && steps < MAX_PHYSICS_STEPS) {
        Engine.update(engine, FIXED_STEP);
        physicsAccumulator -= FIXED_STEP;
        steps++;
      }
      if (steps === MAX_PHYSICS_STEPS) physicsAccumulator = 0;

      if (!gameOver) checkGameOver(now);
      updateCooldownUI(now);
      updateParticles();
      draw(now);
      requestAnimationFrame(loop);
    }

    function draw(now) {
      ctx.clearRect(0, 0, W, H);
      drawBackground(now);
      drawContainer();
      drawWarningLine(now);
      drawPreview(now);

      // 避免每帧复制并排序数组，降低连续点击后核心数量增加带来的 GC 和 CPU 压力。
      for (const body of cores) drawCore(body, now);
      drawParticles();
    }

    function drawBackground(now) {
      // Background video is rendered beneath the canvas layer.
    }

    function drawContainer() {
      ctx.save();
      const width = layout.width;
      const height = layout.bottom - layout.top;

      const glass = ctx.createLinearGradient(layout.left, layout.top, layout.right, layout.bottom);
      glass.addColorStop(0, "rgba(91, 177, 255, .12)");
      glass.addColorStop(.45, "rgba(255, 255, 255, .04)");
      glass.addColorStop(1, "rgba(255, 80, 219, .12)");
      ctx.fillStyle = glass;
      ctx.fillRect(layout.left + 10, layout.top + 10, width - 20, height - 20);

      ctx.strokeStyle = "rgba(71, 244, 255, .9)";
      ctx.shadowColor = "#52f8ff";
      ctx.shadowBlur = 22;
      ctx.lineWidth = 4;
      ctx.strokeRect(layout.left, layout.top, width, height);

      ctx.strokeStyle = "rgba(255, 70, 218, .65)";
      ctx.lineWidth = 2;
      ctx.strokeRect(layout.left + 8, layout.top + 8, width - 16, height - 16);

      ctx.shadowBlur = 0;
      ctx.fillStyle = "rgba(255,255,255,.14)";
      ctx.beginPath();
      ctx.moveTo(layout.left + width * 0.58, layout.top + 4);
      ctx.lineTo(layout.left + width * 0.77, layout.top + 4);
      ctx.lineTo(layout.left + width * 0.42, layout.bottom - 10);
      ctx.lineTo(layout.left + width * 0.23, layout.bottom - 10);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "rgba(118, 233, 255, .55)";
      ctx.lineWidth = 12;
      ctx.beginPath();
      ctx.moveTo(layout.left + 18, layout.top - 8);
      ctx.lineTo(layout.right - 18, layout.top - 8);
      ctx.stroke();

      ctx.strokeStyle = "rgba(255, 73, 223, .42)";
      ctx.lineWidth = 14;
      ctx.beginPath();
      ctx.moveTo(layout.left + 24, layout.bottom + 10);
      ctx.lineTo(layout.right - 24, layout.bottom + 10);
      ctx.stroke();

      ctx.fillStyle = "rgba(8, 10, 35, .92)";
      ctx.fillRect(layout.left - 12, layout.bottom + 4, width + 24, 22);
      ctx.strokeStyle = "rgba(103, 234, 255, .72)";
      ctx.lineWidth = 2;
      ctx.strokeRect(layout.left - 12, layout.bottom + 4, width + 24, 22);
      ctx.restore();
    }

    function drawWarningLine(now) {
      const dangerRatio = dangerStart ? clamp((now - dangerStart) / getDangerDuration(), 0, 1) : 0;
      ctx.save();
      ctx.setLineDash([14, 9]);
      ctx.lineDashOffset = -now * 0.04;
      ctx.lineWidth = 3;
      ctx.strokeStyle = dangerStart ? `rgba(255, 62, 125, ${0.72 + dangerRatio * 0.28})` : "rgba(85, 246, 255, .68)";
      ctx.shadowColor = dangerStart ? "#ff4e8b" : "#52f8ff";
      ctx.shadowBlur = dangerStart ? 24 : 14;
      ctx.beginPath();
      ctx.moveTo(layout.left, layout.warningY);
      ctx.lineTo(layout.right, layout.warningY);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.font = "bold 12px 'Trebuchet MS', 'Microsoft YaHei'";
      ctx.fillStyle = dangerStart ? "#ff8aa4" : "rgba(208, 248, 255, .88)";
      ctx.fillText(dangerStart ? `警戒：${Math.ceil(getDangerDuration() / 1000 - dangerRatio * (getDangerDuration() / 1000))}s` : "WARNING LINE", layout.left + 12, layout.warningY - 10);
      ctx.restore();
    }

    function drawPreview(now) {
      if (gameOver) return;
      const cfg = scaledType(currentLevel);

      ctx.save();
      ctx.strokeStyle = "rgba(255,255,255,.18)";
      ctx.setLineDash([4, 8]);
      ctx.beginPath();
      ctx.moveTo(dropX, layout.spawnY + cfg.r + 4);
      ctx.lineTo(dropX, layout.bottom - 8);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.globalAlpha = 0.92;
      drawMechanicalShape(dropX, layout.spawnY, currentLevel, cfg.r, now, true);
      ctx.restore();
    }

    function drawCore(body, now) {
      const level = body.plugin.level;
      const cfg = scaledType(level);
      body.plugin.radius = cfg.r;
      const flash = body.plugin.mergedFlash || 0;
      if (flash > 0) body.plugin.mergedFlash = Math.max(0, flash - 0.035);

      const sprite = getCoreSprite(level);
      const size = sprite.displaySize;
      const scale = 1 + flash * 0.16;

      ctx.save();
      ctx.translate(body.position.x, body.position.y);
      ctx.rotate(body.angle);
      ctx.scale(scale, scale);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(sprite.canvas, -size / 2, -size / 2, size, size);
      ctx.restore();
    }

    function getCoreSprite(level) {
      const cfg = scaledType(level);
      const key = `${level}-${Math.round(cfg.r * 100)}-${DPR}`;
      if (coreSpriteCache.has(key)) return coreSpriteCache.get(key);

      const padding = Math.max(20, cfg.r * 0.35);
      const displaySize = Math.ceil((cfg.r + padding) * 2);
      const spriteCanvas = document.createElement("canvas");
      spriteCanvas.width = Math.ceil(displaySize * DPR);
      spriteCanvas.height = Math.ceil(displaySize * DPR);
      const spriteCtx = spriteCanvas.getContext("2d");
      spriteCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
      spriteCtx.imageSmoothingEnabled = false;
      drawMechanicalShapeOnContext(spriteCtx, displaySize / 2, displaySize / 2, level, cfg.r, 0, false);

      const sprite = { canvas: spriteCanvas, displaySize };
      coreSpriteCache.set(key, sprite);
      return sprite;
    }

    function drawMechanicalShape(x, y, level, r, now, preview) {
      drawMechanicalShapeOnContext(ctx, x, y, level, r, now, preview);
    }

    function drawParticles() {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.shadowBlur = 0;
      for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawMechanicalShapeOnContext(targetCtx, x, y, level, r, now, preview) {
      targetCtx.save();
      targetCtx.translate(x, y);
      targetCtx.globalAlpha *= preview ? 0.82 : 1;
      targetCtx.imageSmoothingEnabled = false;
      drawFruitOnContext(targetCtx, level, r, now, preview);
      targetCtx.restore();
    }

    function drawFruitOnContext(targetCtx, level, r, now, preview) {
      const style = getFruitStyle(level);
      targetCtx.shadowColor = style.glow;
      targetCtx.shadowBlur = preview ? 14 : 22;
      drawPixelFruit(targetCtx, level, r, now, style);
    }

    function getFruitStyle(level) {
      return [
        { body: "#9b64ff", body2: "#6e31ff", glow: "#d89cff", leaf: "#67ff92", face: "#2e0f54" },
        { body: "#ff4f88", body2: "#ff7e63", glow: "#ff95bb", leaf: "#7fff85", face: "#5c112d" },
        { body: "#ffb13a", body2: "#ff7f1f", glow: "#ffd56e", leaf: "#79ff8b", face: "#6e2a00" },
        { body: "#ff4d55", body2: "#ff8e3d", glow: "#ff8f90", leaf: "#62ff8d", face: "#531616" },
        { body: "#ff82c1", body2: "#ffb66e", glow: "#ffc2dc", leaf: "#72ff9a", face: "#5e1945" },
        { body: "#ffe26c", body2: "#ffbf2d", glow: "#fff4a7", leaf: "#7dffa1", face: "#5b4a0a" },
        { body: "#ff59d8", body2: "#9e46ff", glow: "#ffabf3", leaf: "#6dffb3", face: "#4f1952" },
        { body: "#ff4167", body2: "#ff6d4b", glow: "#ff95ab", leaf: "#79ff93", face: "#60121f" },
        { body: "#8e5f46", body2: "#6d3f2e", glow: "#d3b29c", leaf: "#79ff93", face: "#2d180f" },
        { body: "#48c84b", body2: "#157d23", glow: "#8fff9c", leaf: "#73ff8a", face: "#123d12" }
      ][level] || { body: "#ffffff", body2: "#cccccc", glow: "#ffffff", leaf: "#79ff93", face: "#111111" };
    }

    function drawPixelFruit(targetCtx, level, r, now, style) {
      const sprite = getPixelFruitSprite(level);
      const grid = sprite.length;
      const unit = Math.max(2, (r * 2.3) / grid);
      const size = grid * unit;
      const palette = {
        1: darkenHex(style.body2, 0.4),
        2: style.body2,
        3: style.body,
        4: lightenHex(style.body, 0.28),
        5: style.leaf,
        6: "#ffe37a",
        7: style.face,
        8: level === 9 ? "#0f641a" : "#6b3d17",
        9: level === 8 ? "#f2e2c8" : "#151515"
      };

      targetCtx.save();
      targetCtx.translate(-size / 2, -size / 2);
      for (let y = 0; y < grid; y++) {
        const row = sprite[y];
        for (let x = 0; x < row.length; x++) {
          const code = row[x];
          if (code === "." || !palette[code]) continue;
          targetCtx.fillStyle = palette[code];
          targetCtx.fillRect(x * unit, y * unit, unit, unit);
        }
      }
      targetCtx.restore();
      drawFruitFace(targetCtx, r, now, style.face, unit);
    }

    function getPixelFruitSprite(level) {
      switch (level) {
        case 0: return [
          "......55........",
          ".....5555.......",
          "......58........",
          "....233223......",
          "...233333223.....",
          "...233333223.....",
          "..23323332322....",
          "..23333333322....",
          "..22333333322....",
          "...223333322.....",
          "....2233322......",
          ".....22322.......",
          "......222........",
          "................",
          "................",
          "................"
        ];
        case 7: return [
          "......5555......",
          ".....555555.....",
          "....55.55.55....",
          ".....333333.....",
          "....23333332....",
          "...2333333332...",
          "...2333333332...",
          "..233336333332..",
          "..233333333332..",
          "..233333333332..",
          "...2333333332...",
          "...2233333322...",
          "....22333322....",
          ".....222222.....",
          "......2222......",
          "................"
        ];
        case 8: return [
          "......8888......",
          ".....888888.....",
          "....82222228....",
          "...8222222228...",
          "...8222442228...",
          "..822224442228..",
          "..822244444228..",
          "..822244444228..",
          "..822244444228..",
          "..822224442228..",
          "...8222222228...",
          "...8222222228...",
          "....82222228....",
          ".....888888.....",
          "......8888......",
          "................"
        ];
        case 9: return [
          "......555.......",
          ".....5588.......",
          "...233333322.....",
          "..23334433322....",
          ".2333444443332...",
          ".2334444444332...",
          "233444949444332..",
          "233444444444332..",
          "233444444444332..",
          "233444949444332..",
          ".2334444444332...",
          ".2333444443332...",
          "..23333433322....",
          "...222222222.....",
          ".....22222.......",
          "................"
        ];
        case 6: return [
          "......555.......",
          ".....55555......",
          "....2233332.....",
          "...2233343332....",
          "...23334443322...",
          "..233344444332...",
          "..233444444332...",
          "..233444444332...",
          "..233444444332...",
          "..233344444332...",
          "...2333343332....",
          "...2233333332....",
          "....22333322.....",
          ".....222222......",
          "................",
          "................"
        ];
        default: return [
          "......555.......",
          ".....5588.......",
          "...22222222.....",
          "..2233333322....",
          ".223334433322...",
          ".2333444443332..",
          ".2333444443332..",
          ".2334444444332..",
          ".2334444444332..",
          ".2333444443332..",
          ".223334433322...",
          "..2233333322....",
          "...22222222.....",
          ".....2222.......",
          "................",
          "................"
        ];
      }
    }

    function drawFruitFace(targetCtx, r, now, color, unit = Math.max(2, r * 0.12)) {
      const blink = Math.sin(now * 0.008) > 0.96;
      const eyeW = unit;
      const eyeH = blink ? Math.max(1, unit * 0.35) : unit * 1.15;
      targetCtx.save();
      targetCtx.shadowBlur = 0;
      targetCtx.fillStyle = color;
      targetCtx.fillRect(-unit * 2.3, -unit * 0.35, eyeW, eyeH);
      targetCtx.fillRect(unit * 1.2, -unit * 0.35, eyeW, eyeH);
      targetCtx.fillRect(-unit * 1.15, unit * 1.25, unit * 3.1, Math.max(1, unit * 0.7));
      targetCtx.fillRect(-unit * 0.15, unit * 1.95, unit * 1.2, Math.max(1, unit * 0.6));
      targetCtx.restore();
    }

    function lightenHex(hex, amount) {
      return mixHex(hex, "#ffffff", amount);
    }

    function darkenHex(hex, amount) {
      return mixHex(hex, "#000000", amount);
    }

    function mixHex(a, b, amount) {
      const ar = parseInt(a.slice(1, 3), 16);
      const ag = parseInt(a.slice(3, 5), 16);
      const ab = parseInt(a.slice(5, 7), 16);
      const br = parseInt(b.slice(1, 3), 16);
      const bg = parseInt(b.slice(3, 5), 16);
      const bb = parseInt(b.slice(5, 7), 16);
      const rr = Math.round(ar + (br - ar) * amount);
      const rg = Math.round(ag + (bg - ag) * amount);
      const rb = Math.round(ab + (bb - ab) * amount);
      return `#${rr.toString(16).padStart(2, "0")}${rg.toString(16).padStart(2, "0")}${rb.toString(16).padStart(2, "0")}`;
    }

    // ------------------------- UI 面板渲染 -------------------------
    function setupGalleryUI() {
      filterBtns.forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          SFX.uiClick();
          galleryFilter = btn.dataset.filter;
          filterBtns.forEach((item) => item.classList.toggle("active", item === btn));
          renderGallery();
        });
      });
    }

    function updateRankUI() {
      if (rankUIScheduled) return;
      rankUIScheduled = true;
      setTimeout(() => {
        rankUIScheduled = false;
        const rows = [...rankBase, { name: "NOW", score }]
          .sort((a, b) => b.score - a.score)
          .slice(0, 5);

        rankListEl.innerHTML = rows.map((row, index) => `
          <div class="rank-row ${row.name === "NOW" ? "rank-now" : ""}">
            <span class="rank-medal">${index + 1}</span>
            <span class="rank-name">${row.name}</span>
            <span class="rank-score">${row.score}</span>
          </div>
        `).join("");
      }, 160);
    }

    function updateScoreUI() {
      if (scoreUIScheduled) return;
      scoreUIScheduled = true;
      requestAnimationFrame(() => {
        scoreUIScheduled = false;
        scoreEl.textContent = String(score);
        if (score > bestScore) {
          bestScore = score;
          bestScoreEl.textContent = String(bestScore);
        }
        updateRankUI();
      });
    }

    function updateNextPreview() {
      if (!nextCtx) return;
      nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
      const cfg = coreTypes[nextLevel];
      const scale = 58 / cfg.r;
      nextCtx.save();
      nextCtx.translate(80, 82);
      nextCtx.scale(scale, scale);
      drawMechanicalShapeOnContext(nextCtx, 0, 0, nextLevel, cfg.r, performance.now(), true);
      nextCtx.restore();
    }

    function renderGallery() {
      const levels = coreTypes
        .map((_, level) => level)
        .filter((level) => galleryFilter === "all" || (galleryFilter === "basic" ? level <= 4 : level >= 5));

      coreGalleryEl.innerHTML = "";
      levels.forEach((level) => {
        const item = document.createElement("button");
        item.className = `core-item ${level === selectedCoreLevel ? "active" : ""}`;
        item.type = "button";
        item.setAttribute("aria-label", coreNames[level]);

        const mini = document.createElement("canvas");
        mini.width = 72;
        mini.height = 72;
        const miniCtx = mini.getContext("2d");
        const cfg = coreTypes[level];
        const scale = 26 / cfg.r;
        miniCtx.save();
        miniCtx.translate(36, 36);
        miniCtx.scale(scale, scale);
        drawMechanicalShapeOnContext(miniCtx, 0, 0, level, cfg.r, performance.now(), true);
        miniCtx.restore();

        item.appendChild(mini);
        item.addEventListener("click", (e) => {
          e.preventDefault();
          SFX.uiClick();
          selectedCoreLevel = level;
          coreNameEl.textContent = `L${level + 1} ${coreNames[level]}`;
          coreValueEl.textContent = `${coreTypes[level].score * 10} pts`;
          renderGallery();
        });
        coreGalleryEl.appendChild(item);
      });

      coreNameEl.textContent = `L${selectedCoreLevel + 1} ${coreNames[selectedCoreLevel]}`;
      coreValueEl.textContent = `${coreTypes[selectedCoreLevel].score * 10} pts`;
    }

    function rebuildBackgroundCache() {
      return;
    }

    // ------------------------- 工具函数 -------------------------
    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function drawImageCover(targetCtx, image, width, height) {
      const scale = Math.max(width / image.naturalWidth, height / image.naturalHeight);
      const drawWidth = image.naturalWidth * scale;
      const drawHeight = image.naturalHeight * scale;
      const dx = (width - drawWidth) / 2;
      const dy = (height - drawHeight) / 2;
      targetCtx.drawImage(image, dx, dy, drawWidth, drawHeight);
    }
  </script>
